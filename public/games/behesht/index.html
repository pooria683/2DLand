    const legs = Math.sin(e.anim * 5) * (Math.abs(e.vx) > 15 ? 4 : 0);
    fillRR(c, -20 + legs, -20, 15, 21, 5, C('#3d2a1c'));
    fillRR(c, 6 - legs, -20, 15, 21, 5, C('#3d2a1c'));
    ell(c, 0, -40, 29, 24, C(wind ? '#b86a3a' : '#7c4524'));   // تنه
    ell(c, 0, -34, 20, 15, C('#9c5c32'));
    // بازوها
    const armY = wind ? -62 : (smash ? -18 : -40);
    fillRR(c, -32, armY - 6, 13, 26, 6, C('#7c4524'));
    fillRR(c, 19, armY - 6, 13, 26, 6, C('#7c4524'));
    ell(c, 4, -62 + bob, 13, 12, C('#8a4e2a'));                 // سر کوچک
    c.fillStyle = e.stun > 0 ? '#fff' : (wind ? '#ffe07a' : '#ffb05e');
    c.beginPath(); c.arc(2, -63 + bob, 2.2, 0, TAU); c.fill();
    c.beginPath(); c.arc(9, -63 + bob, 2.2, 0, TAU); c.fill();
    // شاخ‌های کوچک
    c.fillStyle = C('#e8dcc0');
    c.beginPath(); c.moveTo(-3, -70 + bob); c.lineTo(-6, -79 + bob); c.lineTo(1, -72 + bob); c.fill();
    c.beginPath(); c.moveTo(11, -70 + bob); c.lineTo(14, -79 + bob); c.lineTo(7, -72 + bob); c.fill();
    // جعبه‌ی بایگانی روی پشت
    fillRR(c, -26, -56, 17, 15, 2, C('#b9a07a'));
    c.strokeStyle = '#6d5c3f'; c.lineWidth = 1.2; rr(c, -26, -56, 17, 15, 2); c.stroke();
    if (smash) {
      c.globalAlpha = 0.5;
      for (let i = 0; i < 3; i++) ell(c, 0, -2, 26 + i * 16, 5, '#ffb978');
      c.globalAlpha = 1;
    }
  }

  else if (e.type === 'auditor') {
    // حسابرسِ شبگرد: لاغر، ردای ارغوانی، دفتر و خودکار قرمز
    const gone = e.state === 'vanish';
    const slash = e.state === 'slash';
    c.globalAlpha = gone ? Math.max(0.2, 1 - e.t / 0.3) : 1;
    const legs = Math.sin(e.anim * 8) * (Math.abs(e.vx) > 15 ? 3 : 0);
    fillRR(c, -8 + legs, -14, 7, 15, 3, C('#241a38'));
    fillRR(c, 2 - legs, -14, 7, 15, 3, C('#241a38'));
    // ردا
    c.fillStyle = C(slash ? '#9a6fe0' : '#6b3f9e');
    c.beginPath();
    c.moveTo(-13, -44); c.lineTo(13, -44);
    c.quadraticCurveTo(17, -14, 0, -10);
    c.quadraticCurveTo(-17, -14, -13, -44);
    c.fill();
    fillRR(c, -10, -46, 20, 10, 4, C('#4e2c78'));         // یقه
    ell(c, 0, -54 + bob, 10, 10, C('#d8c9a8'));            // سر
    c.fillStyle = e.stun > 0 ? '#fff' : '#201434';
    c.beginPath(); c.arc(-2.5, -55 + bob, 1.5, 0, TAU); c.fill();
    c.beginPath(); c.arc(3.5, -55 + bob, 1.5, 0, TAU); c.fill();
    // عینک تک‌چشمی
    c.strokeStyle = C('#e8c24a'); c.lineWidth = 1.4;
    c.beginPath(); c.arc(3.5, -55 + bob, 4.2, 0, TAU); c.stroke();
    c.beginPath(); c.moveTo(7.5, -54 + bob); c.lineTo(11, -48 + bob); c.stroke();
    // دفتر در دست چپ
    fillRR(c, -20, -38, 11, 14, 2, C('#e8e2d0'));
    c.fillStyle = '#8a7f66'; c.fillRect(-18, -35, 7, 1.3); c.fillRect(-18, -32, 5, 1.3);
    // خودکار قرمز
    c.save();
    c.translate(13, -36);
    c.rotate(slash ? -1.1 + Math.min(1, e.t / 0.26) * 2.2 : 0.3);
    fillRR(c, 0, -2, 20, 4, 2, C('#c0392b'));
    c.fillStyle = C('#f0e4cc'); c.fillRect(18, -1.5, 5, 3);
    c.restore();
    if (slash && e.t > 0.2) {
      c.globalAlpha = 0.6;
      c.strokeStyle = '#efe6ff'; c.lineWidth = 3;
      c.beginPath(); c.arc(16, -34, 26, -0.9, 0.7); c.stroke();
      c.globalAlpha = 1;
    }
    c.globalAlpha = 1;
  }

  else if (e.type === 'safebox') {
    // صندوقِ امانات: زره‌پوش، فقط از بالا باز می‌شود
    const hop = e.state === 'hop';
    const sq = hop ? 1.08 : 1;
    c.scale(1 / sq, sq);
    // پاهای کوتاه فلزی
    const legs = Math.sin(e.anim * 7) * (Math.abs(e.vx) > 12 ? 2.5 : 0);
    fillRR(c, -15 + legs, -10, 8, 11, 3, C('#3a3f4c'));
    fillRR(c, 7 - legs, -10, 8, 11, 3, C('#3a3f4c'));
    // بدنه
    fillRR(c, -23, -44, 46, 36, 5, C('#6a7183'));
    fillRR(c, -19, -40, 38, 28, 3, C('#848c9e'));
    // درز درِ صندوق
    c.strokeStyle = C('#4a505f'); c.lineWidth = 1.6;
    c.beginPath(); c.moveTo(-19, -26); c.lineTo(19, -26); c.stroke();
    // گاوصندوقِ چرخ‌دار
    c.strokeStyle = C('#e8c24a'); c.lineWidth = 2.6;
    c.beginPath(); c.arc(0, -26, 8, 0, TAU); c.stroke();
    c.lineWidth = 2;
    for (let i = 0; i < 4; i++) {
      const a = e.anim * 1.6 + i * Math.PI / 2;
      c.beginPath(); c.moveTo(Math.cos(a) * 5, -26 + Math.sin(a) * 5);
      c.lineTo(Math.cos(a) * 12, -26 + Math.sin(a) * 12); c.stroke();
    }
    // چشم‌های کوچک بالای بدنه
    c.fillStyle = e.stun > 0 ? '#fff' : (e.aggro ? '#ffb05e' : '#7f8798');
    c.beginPath(); c.arc(-9, -38, 2.2, 0, TAU); c.fill();
    c.beginPath(); c.arc(9, -38, 2.2, 0, TAU); c.fill();
    // علامتِ «فقط از بالا» روی سقف صندوق
    c.fillStyle = C('#ffd45e');
    c.beginPath(); c.moveTo(0, -52); c.lineTo(-6, -45); c.lineTo(6, -45); c.closePath(); c.fill();
    if (hop) {
      c.globalAlpha = 0.5;
      ell(c, 0, -4, 28, 5, '#cfd6e6');
      c.globalAlpha = 1;
    }
  }

  else if (e.type === 'dummy') {
    const wob = Math.sin(e.anim * 6) * 0.08 + (e.hitFlash > 0 ? Math.sin(e.anim * 50) * 0.18 : 0);
    c.rotate(wob);
    fillRR(c, -17, -54, 34, 54, 16, C('#ffffff'));
    c.strokeStyle = '#bcd9ef'; c.lineWidth = 2; rr(c, -17, -54, 34, 54, 16); c.stroke();
    c.fillStyle = '#9fc6e0';
    c.beginPath(); c.arc(-6, -36, 2.6, 0, TAU); c.fill();
    c.beginPath(); c.arc(6, -36, 2.6, 0, TAU); c.fill();
    c.strokeStyle = '#9fc6e0'; c.lineWidth = 2;
    c.beginPath(); c.arc(0, -26, 6, 0.1 * Math.PI, 0.9 * Math.PI); c.stroke();
    c.strokeStyle = '#ffd95e'; c.lineWidth = 2.5;
    c.beginPath(); c.ellipse(0, -62, 10, 3.5, 0, 0, TAU); c.stroke();
  }

  c.restore();

  // نوار جان
  if (!e.isBoss && e.hp < e.maxHp) {
    const w = Math.max(30, e.w);
    const x = cx - w / 2, y = e.y - 12;
    c.fillStyle = 'rgba(0,0,0,.5)'; c.fillRect(x, y, w, 5);
    c.fillStyle = e.hp / e.maxHp > 0.4 ? '#ff6b4a' : '#ff3b3b';
    c.fillRect(x, y, w * clamp(e.hp / e.maxHp, 0, 1), 5);
    c.strokeStyle = 'rgba(255,255,255,.35)'; c.lineWidth = 1; c.strokeRect(x, y, w, 5);
  }
  // تله‌گراف حمله
  if (e.state === 'shoot' && e.shootT > 0) {
    c.globalAlpha = 0.6; faText(c, '!', cx, e.y - 22, 22, '#ffd45e', 'center', 900, '#2a0a10'); c.globalAlpha = 1;
  }
  if (e.state === 'wind') {
    c.globalAlpha = 0.8; faText(c, '!!', cx, e.y - 20, 24, '#ff6b4a', 'center', 900, '#2a0a10'); c.globalAlpha = 1;
  }
}


/* ===== 05-bosses.js ===== */
/* ============================================================
   رئیس‌ها: هر ۳ مرحله یک‌بار. هر کدام جایزه‌ای می‌دهند.
   ============================================================ */

let BOSS = null;

function say(b, text, dur = 2.2) { b.say = { text, t: dur }; }

const EMPTY_SKIN = {};

/* اعلان حمله: اگر رئیس «نسخه‌ی ریمیکس» باشد، جمله‌ی مخصوص خودش را می‌گوید */
function cry(b, key, fallback, dur) {
  say(b, (b.calls && b.calls[key]) || fallback, dur);
}

function bossBase(type, x, y, w, h, hp, name, title) {
  return {
    type, isBoss: true, x: x - w / 2, y: y - h, w, h, vx: 0, vy: 0,
    hp, maxHp: hp, dmg: 18, score: 1500, name, title,
    facing: -1, onGround: false, state: 'intro', t: 0, cd: 1.4, phase: 1,
    hitFlash: 0, dead: false, deadT: 0, anim: 0, stun: 0, say: null, last: '',
    contactDmg: 16
  };
}

function bossThink(b, dt, p) {
  b.anim += dt;
  b.t += dt;
  b.hitFlash = Math.max(0, b.hitFlash - dt);
  if (b.say) { b.say.t -= dt; if (b.say.t <= 0) b.say = null; }
  // آسیب تماسی
  if (!b.dead && b.state !== 'intro' && aabb(rectOf(b), rectOf(p))) hurtPlayer(p, b.contactDmg, b.x + b.w / 2);
}

function bossDie(b) {
  if (b.dead) return;                 // دوبار اجرا نشود
  b.dead = true; b.deadT = 0;
  Sound.boss(); Sound.win();
  Cam.kick(24);
  hitstop = 0.35;
  const cx = b.x + b.w / 2, cy = b.y + b.h / 2;
  for (let i = 0; i < 6; i++) {
    setTimeout(() => {
      spawnParts(30, cx + rand(70, -70), cy + rand(60, -60), {
        col: ['#ffd45e', '#ff6b4a', '#ffffff', '#9af0ff', '#ff9ad5'], speed: 340, life: 1.1, size: 7, shape: 'confetti'
      });
      ring(cx + rand(60, -60), cy + rand(50, -50), '#ffd45e', 10, 520, 0.45);
      Cam.kick(10);
    }, i * 160);
  }
  RUN.score += 2500;
  spillBossGems(cx, cy, RUN.level);   // خزانه‌ی رئیس
  onBossDefeated(b);
}

function pickAttack(b, options) {
  let list = options.filter(o => o !== b.last);
  const sel = list[Math.floor(Math.random() * list.length)];
  b.last = sel;
  return sel;
}

/* ============================================================
   رئیس ۱ — بَلیعال، مدیر منابع انسانی جهنم
   ============================================================ */
function makeBoss1(index) {
  const b = bossBase('hr', 1050, GROUND_Y, 64, 106, 430 + index * 25,
    'بَلیعال', 'مدیر منابع انسانی جهنم');
  b.contactDmg = 15;
  b.quips = ['فرم ۳۸ رو پر کردی؟', 'رزومه‌ت ناقصه!', 'ساعت کاری تموم نشده!', 'مرخصی نداریم!', 'این مصاحبه‌ست، نه دعوا!'];
  b.update = (b, dt, p) => {
    bossThink(b, dt, p);
    if (b.dead) return;
    const pcx = p.x + p.w / 2, cx = b.x + b.w / 2;
    b.facing = sign(pcx - cx) || b.facing;
    if (b.hp < b.maxHp * 0.5 && b.phase === 1) {
      b.phase = 2; cry(b, 'phase2', 'اضافه‌کاری اجباری!', 2.4);
      Cam.kick(14); Sound.boss();
      ring(cx, b.y + b.h / 2, '#ff6b4a', 20, 700, 0.5);
    }
    b.vy += 2000 * dt;

    if (b.state === 'intro') { b.vx = 0; if (b.t > 0.6) { b.state = 'idle'; b.t = 0; } }
    else if (b.state === 'idle') {
      const want = clamp((pcx - cx) * 1.6, -78, 78);
      b.vx = approach(b.vx, want, 450 * dt);
      if (b.t > b.cd) {
        b.state = pickAttack(b, b.phase === 1 ? (b.pool1 || ['forms', 'stamp', 'summon']) : (b.pool2 || ['forms', 'stamp', 'forms', 'summon']));
        b.t = 0; b.sub = 0;
        if (b.state === 'forms') cry(b, 'forms', 'فرم‌ها رو امضا کن!', 1.6);
        if (b.state === 'stamp') cry(b, 'stamp', 'مُهــــر!', 1.4);
        if (b.state === 'summon') cry(b, 'summon', 'کارآموزها! بیاین!', 1.6);
      }
    }
    else if (b.state === 'forms') {
      b.vx = approach(b.vx, 0, 900 * dt);
      const shots = b.phase === 1 ? 3 : (b.rookie ? 4 : 5);
      if (b.t > 0.45 && b.sub < shots) {
        const want = 0.45 + b.sub * 0.16;
        if (b.t > want) {
          b.sub++;
          const sp = b.rookie ? 0.13 : 0.22;          // پخشِ کمتر = قابلِ خواندن‌تر
          const a = Math.atan2(p.y + p.h / 2 - (b.y + 40), pcx - cx) + rand(sp, -sp);
          const spd = b.rookie ? 290 : 330;
          shoot(cx + b.facing * 30, b.y + 40, Math.cos(a) * spd, Math.sin(a) * spd - 40, 11, b.rookie ? 9 : 13, 'paper');
          Sound.tone({ f: 700, f2: 400, t: 0.1, type: 'square', g: 0.06 });
        }
      }
      if (b.t > 1.5) { b.state = 'idle'; b.t = 0; b.cd = (b.rookie ? 1.65 : 1.1) + Math.random() * 0.8; }
    }
    else if (b.state === 'stamp') {
      const tel = b.rookie ? 0.62 : 0.45;             // مکثِ بلندترِ پیش از پرش = وقت برای جاخالی
      if (b.t < tel) { b.vx = approach(b.vx, 0, 1200 * dt); }
      else if (b.t < tel + 0.05 && b.onGround) { b.vy = -760; b.vx = clamp((pcx - cx) * 2.2, -260, 260); }
      else if (b.vy > 0 && b.onGround && b.sub === 0) {
        b.sub = 1;
        Cam.kick(16); Sound.noise({ t: 0.3, g: 0.26, hp: 60, lp: 1800 });
        spawnParts(24, cx, b.y + b.h, { col: ['#ffd45e', '#ff8e3c', '#fff'], speed: 320, life: 0.6, size: 6, angle: -Math.PI / 2, spread: 2.6 });
        ring(cx, b.y + b.h, '#ffd45e', 10, 900, 0.4);
        for (const d of [-1, 1]) {
          const w = { x: cx + d * 40, y: b.y + b.h - 18, vx: d * (b.rookie ? 250 : 300), vy: 0, r: 18, dmg: b.rookie ? 10 : 15, kind: 'wave', friendly: false, life: 0, max: 3, grav: 0, spin: 0 };
          PROJ.push(w);
        }
        if (b.phase === 2) {
          for (let i = 0; i < (b.rookie ? 2 : 3); i++) shoot(cx, b.y + 30, rand(220, -220), -rand(520, 380), 10, b.rookie ? 9 : 12, 'paper');
        }
      }
      if (b.t > 1.5) { b.state = 'idle'; b.t = 0; b.sub = 0; b.cd = (b.rookie ? 1.55 : 1.0) + Math.random() * 0.7; }
    }
    else if (b.state === 'summon') {
      b.vx = approach(b.vx, 0, 900 * dt);
      if (b.t > 0.5 && b.sub === 0) {
        b.sub = 1;
        const n = b.phase === 1 ? (b.rookie ? 1 : 2) : (b.rookie ? 2 : 3);
        for (let i = 0; i < n; i++) {
          const ex = clamp(cx + rand(240, -240), 90, L.w - 90);
          const en = makeEnemy('imp', ex, GROUND_Y - 10, 3);
          en.aggro = true;
          ENEMIES.push(en);
          ring(ex, GROUND_Y - 20, '#b57aff', 8, 420, 0.4);
          spawnParts(14, ex, GROUND_Y - 20, { col: ['#b57aff', '#e3c6ff'], speed: 180, life: 0.5, size: 5 });
        }
        Sound.tone({ f: 200, f2: 500, t: 0.3, type: 'sawtooth', g: 0.1 });
      }
      if (b.t > 1.1) { b.state = 'idle'; b.t = 0; b.sub = 0; b.cd = b.rookie ? 1.95 : 1.3; }
    }
    moveEntity(b, dt);
    if (Math.random() < 0.004 && !b.say) say(b, pickAny(b.quips), 2);
  };
  b.draw = drawBoss1;
  return b;
}

function drawBoss1(c, b) {
  const cx = b.x + b.w / 2, by = b.y + b.h;
  const flash = b.hitFlash > 0;
  const SK = b.skin || EMPTY_SKIN;
  const C = col => flash ? '#ffffff' : (SK[col] || col);
  const bob = Math.sin(b.anim * 3) * 2;
  c.save();
  c.translate(cx, by);
  c.scale(b.facing >= 0 ? 1 : -1, 1);
  c.globalAlpha = 0.25; ell(c, 0, 2, 36, 7, '#000'); c.globalAlpha = 1;

  // پاها (شلوار رسمی)
  const walk = Math.sin(b.anim * 7) * (Math.abs(b.vx) > 20 ? 4 : 0);
  fillRR(c, -18 + walk, -34, 14, 36, 5, C('#20232e'));
  fillRR(c, 5 - walk, -34, 14, 36, 5, C('#20232e'));
  fillRR(c, -20 + walk, -6, 18, 7, 3, C('#101218'));
  fillRR(c, 4 - walk, -6, 18, 7, 3, C('#101218'));

  // کت
  fillRR(c, -26, -84 + bob, 52, 54, 10, C('#2b2f3d'));
  // پیراهن
  c.fillStyle = C('#f3f3f7');
  c.beginPath(); c.moveTo(-9, -84 + bob); c.lineTo(9, -84 + bob); c.lineTo(4, -46 + bob); c.lineTo(-4, -46 + bob); c.fill();
  // کراوات
  c.fillStyle = C('#c0392b');
  c.beginPath(); c.moveTo(-4, -80 + bob); c.lineTo(4, -80 + bob); c.lineTo(2, -52 + bob); c.lineTo(0, -46 + bob); c.lineTo(-2, -52 + bob); c.fill();
  // کارت شناسایی
  fillRR(c, 10, -70 + bob, 14, 10, 2, C('#ffd45e'));
  c.fillStyle = '#3a2a06'; c.fillRect(12, -67 + bob, 10, 1.6); c.fillRect(12, -64 + bob, 7, 1.6);

  // سر
  ell(c, 0, -96 + bob, 17, 16, C('#c0392b'));
  // شاخ
  c.fillStyle = C('#8e2a1e');
  c.beginPath(); c.moveTo(-12, -108 + bob); c.lineTo(-18, -122 + bob); c.lineTo(-6, -110 + bob); c.fill();
  c.beginPath(); c.moveTo(12, -108 + bob); c.lineTo(18, -122 + bob); c.lineTo(6, -110 + bob); c.fill();
  // مو (فرق از وسط)
  c.fillStyle = C('#1b1b22');
  c.beginPath(); c.ellipse(0, -106 + bob, 16, 7, 0, Math.PI, 0); c.fill();
  // عینک
  c.strokeStyle = '#f0f0f5'; c.lineWidth = 2;
  c.beginPath(); c.arc(-6, -98 + bob, 6, 0, TAU); c.stroke();
  c.beginPath(); c.arc(8, -98 + bob, 6, 0, TAU); c.stroke();
  c.beginPath(); c.moveTo(0, -98 + bob); c.lineTo(2, -98 + bob); c.stroke();
  c.fillStyle = '#ffe9a8';
  c.beginPath(); c.arc(-6, -98 + bob, 2.4, 0, TAU); c.fill();
  c.beginPath(); c.arc(8, -98 + bob, 2.4, 0, TAU); c.fill();
  // دهان
  c.strokeStyle = '#5a1510'; c.lineWidth = 2;
  c.beginPath();
  if (b.state === 'stamp' || b.state === 'forms') c.arc(1, -86 + bob, 5, 0, Math.PI);
  else c.arc(1, -84 + bob, 5, Math.PI, 0);
  c.stroke();

  // مُهر غول‌پیکر در دست
  const stampUp = b.state === 'stamp' ? Math.min(1, b.t / 0.45) : 0;
  c.save();
  c.translate(26, -66 + bob - stampUp * 26);
  c.rotate(-0.3 - stampUp * 0.6);
  c.fillStyle = C('#8c5a2b'); c.fillRect(-4, -26, 8, 26);
  fillRR(c, -16, 0, 32, 16, 4, C('#6b4423'));
  c.fillStyle = C('#c0392b'); c.fillRect(-14, 16, 28, 5);
  c.restore();

  // کیف سامسونت
  if (b.state !== 'stamp') {
    c.save(); c.translate(-30, -22);
    fillRR(c, -11, 0, 22, 18, 3, C('#4a3524'));
    c.strokeStyle = '#2a1d13'; c.lineWidth = 2; c.beginPath(); c.arc(0, 0, 6, Math.PI, 0); c.stroke();
    c.restore();
  }
  c.restore();
  drawBossSpeech(c, b);
}

/* ============================================================
   رئیس ۲ — استاد کبابی، سرآشپزِ دوزخ
   ============================================================ */
function makeBoss2(index) {
  const b = bossBase('chef', 1050, GROUND_Y, 80, 104, 700 + index * 30,
    'استاد کبابی', 'سرآشپزِ دوزخ (درجه یک)');
  b.contactDmg = 18;
  b.quips = ['کباب بی‌دود نمیشه!', 'نمکش کمه؟', 'آتیشش تنده، نه؟', 'مشتری بعدی!', 'یه سیخ دیگه؟'];
  b.update = (b, dt, p) => {
    bossThink(b, dt, p);
    if (b.dead) return;
    const pcx = p.x + p.w / 2, cx = b.x + b.w / 2;
    if (b.state !== 'ladle') b.facing = sign(pcx - cx) || b.facing;
    if (b.hp < b.maxHp * 0.55 && b.phase === 1) {
      b.phase = 2; cry(b, 'phase2', 'شعله‌ی زیاد!', 2.2); Cam.kick(14); Sound.boss();
      ring(cx, b.y + b.h / 2, '#ff8e3c', 20, 760, 0.5);
    }
    b.vy += 2000 * dt;

    if (b.state === 'intro') { b.vx = 0; if (b.t > 0.6) { b.state = 'idle'; b.t = 0; } }
    else if (b.state === 'idle') {
      b.vx = approach(b.vx, clamp((pcx - cx) * 1.3, -70, 70), 420 * dt);
      if (b.t > b.cd) {
        b.state = pickAttack(b, b.phase === 1 ? (b.pool1 || ['skewers', 'pools', 'ladle']) : (b.pool2 || ['skewers', 'pools', 'ladle', 'pepper']));
        b.t = 0; b.sub = 0;
        if (b.state === 'skewers') cry(b, 'skewers', 'سه سیخ ویژه!', 1.5);
        if (b.state === 'pools') cry(b, 'pools', 'منقل آماده‌ست!', 1.5);
        if (b.state === 'ladle') cry(b, 'ladle', 'کفگیــــر!', 1.3);
        if (b.state === 'pepper') cry(b, 'pepper', 'فلفل اضافه!', 1.4);
      }
    }
    else if (b.state === 'skewers') {
      b.vx = approach(b.vx, 0, 900 * dt);
      const n = b.phase === 1 ? 3 : 4;
      if (b.t > 0.4 && b.sub < n && b.t > 0.4 + b.sub * 0.22) {
        b.sub++;
        const dxp = pcx - cx;
        const vx0 = clamp(dxp * 1.1, -360, 360) + rand(40, -40);
        shoot(cx + b.facing * 24, b.y + 26, vx0, -rand(380, 260), 10, 15, 'skewer');
        Sound.tone({ f: 600, f2: 300, t: 0.12, type: 'triangle', g: 0.07 });
      }
      if (b.t > 1.6) { b.state = 'idle'; b.t = 0; b.cd = 1.0 + Math.random() * 0.7; }
    }
    else if (b.state === 'pools') {
      if (b.t < 0.5) b.vx = approach(b.vx, 0, 1200 * dt);
      else if (b.t < 0.56 && b.onGround) b.vy = -620;
      else if (b.vy > 0 && b.onGround && b.sub === 0) {
        b.sub = 1;
        Cam.kick(14); Sound.noise({ t: 0.26, g: 0.24, hp: 80, lp: 2000 });
        const n = b.phase === 1 ? 3 : 4;
        for (let i = 0; i < n; i++) {
          const px = clamp(cx + (i - (n - 1) / 2) * 150 + rand(30, -30), 60, L.w - 120);
          addFirePool(px, GROUND_Y, 5.5);
        }
      }
      if (b.t > 1.6) { b.state = 'idle'; b.t = 0; b.sub = 0; b.cd = 1.2; }
    }
    else if (b.state === 'ladle') {
      if (b.t < 0.6) { b.vx = approach(b.vx, -b.facing * 60, 800 * dt); }
      else if (b.t < 1.6) {
        b.vx = b.facing * 430;
        if (b.t % 0.09 < dt) spawnParts(3, cx, b.y + b.h - 10, { col: ['#ff8e3c', '#ffd45e'], speed: 120, life: 0.4, size: 5 });
      } else { b.vx = approach(b.vx, 0, 1400 * dt); }
      if (b.t > 2.1) { b.state = 'idle'; b.t = 0; b.cd = 1.1; }
    }
    else if (b.state === 'pepper') {
      b.vx = approach(b.vx, 0, 900 * dt);
      if (b.t > 0.4 && b.sub < 8 && b.t > 0.4 + b.sub * 0.14) {
        b.sub++;
        const px = clamp(p.x + rand(320, -320), 40, L.w - 40);
        PROJ.push({ x: px, y: -30, vx: rand(40, -40), vy: 160, r: 9, dmg: 12, kind: 'pepper', friendly: false, life: 0, max: 6, grav: 420, spin: 0 });
      }
      if (b.t > 2.2) { b.state = 'idle'; b.t = 0; b.cd = 1.0; }
    }
    moveEntity(b, dt);
    if (Math.random() < 0.004 && !b.say) say(b, pickAny(b.quips), 2);
  };
  b.draw = drawBoss2;
  return b;
}

function addFirePool(x, y, life) {
  const hz = { x: x - 55, y: y - 24, w: 110, h: 26, kind: 'lava', dmg: 12, temp: true, life, maxLife: life };
  L.hazards.push(hz);
  ring(x, y - 10, '#ff8e3c', 10, 420, 0.35);
  spawnParts(16, x, y - 10, { col: ['#ff8e3c', '#ffd45e', '#fff'], speed: 200, life: 0.5, size: 5, angle: -Math.PI / 2, spread: 2.4 });
}
function updateTempHazards(dt) {
  for (let i = L.hazards.length - 1; i >= 0; i--) {
    const h = L.hazards[i];
    if (!h.temp) continue;
    h.life -= dt;
    if (h.life <= 0) L.hazards.splice(i, 1);
  }
}

/* ============================================================
   رئیس ۳ — ابلیسِ بازنشسته
   ============================================================ */
function makeBoss3(index) {
  const b = bossBase('satan', 1050, GROUND_Y, 92, 124, 1050 + index * 30,
    'ابلیسِ بازنشسته', 'مدیرکل سابق، حقوق‌بگیر فعلی');
  b.contactDmg = 20;
  b.quips = ['تو جوونی، من بازنشسته‌ام!', 'حقوقم کفاف نمی‌ده!', 'کمرم!', 'در زمان ما این‌طوری نبود!', 'بذار چایم رو بخورم!'];
  b.update = (b, dt, p) => {
    bossThink(b, dt, p);
    if (b.dead) return;
    const pcx = p.x + p.w / 2, cx = b.x + b.w / 2;
    if (b.state !== 'laser') b.facing = sign(pcx - cx) || b.facing;
    if (b.hp < b.maxHp * 0.65 && b.phase === 1) { b.phase = 2; cry(b, 'phase2', 'عینکم کو؟! حالا جدی شدم!', 2.4); Cam.kick(16); Sound.boss(); }
    if (b.hp < b.maxHp * 0.3 && b.phase === 2) { b.phase = 3; cry(b, 'phase3', 'مرخصی‌ام رو لغو کردی!', 2.4); Cam.kick(20); Sound.boss(); }
    b.vy += 2000 * dt;

    if (b.state === 'intro') { b.vx = 0; if (b.t > 0.8) { b.state = 'idle'; b.t = 0; } }
    else if (b.state === 'idle') {
      b.vx = approach(b.vx, clamp((pcx - cx) * 1.2, -60, 60), 400 * dt);
      const cdd = b.phase === 3 ? 0.55 : (b.phase === 2 ? 0.85 : 1.15);
      if (b.t > cdd) {
        const opts = b.phase === 1 ? (b.pool1 || ['orbs', 'summon', 'teleport'])
          : b.phase === 2 ? (b.pool2 || ['orbs', 'laser', 'meteor', 'summon', 'teleport'])
            : (b.pool3 || ['orbs', 'laser', 'meteor', 'orbs', 'laser', 'summon']);
        b.state = pickAttack(b, opts);
        b.t = 0; b.sub = 0;
        if (b.state === 'orbs') cry(b, 'orbs', 'بگیرش!', 1.2);
        if (b.state === 'laser') cry(b, 'laser', 'چشمک مرگبار!', 1.3);
        if (b.state === 'meteor') cry(b, 'meteor', 'سنگ‌بارون!', 1.3);
        if (b.state === 'summon') cry(b, 'summon', 'بچه‌ها بیاین کمک!', 1.4);
      }
    }
    else if (b.state === 'teleport') {
      if (b.t < 0.3) { b.vx = 0; }
      else if (b.sub === 0) {
        b.sub = 1;
        spawnParts(24, cx, b.y + b.h / 2, { col: ['#b57aff', '#e3c6ff', '#fff'], speed: 260, life: 0.5, size: 5, grav: 0 });
        b.x = clamp(p.x + (Math.random() < 0.5 ? 240 : -240), 60, L.w - b.w - 60);
        spawnParts(24, b.x + b.w / 2, b.y + b.h / 2, { col: ['#b57aff', '#e3c6ff', '#fff'], speed: 260, life: 0.5, size: 5, grav: 0 });
        Sound.tone({ f: 900, f2: 200, t: 0.25, type: 'sine', g: 0.1 });
      }
      if (b.t > 0.6) { b.state = 'idle'; b.t = 0; }
    }
    else if (b.state === 'orbs') {
      b.vx = approach(b.vx, 0, 900 * dt);
      const n = b.phase === 3 ? 5 : 3;
      if (b.t > 0.35 && b.sub < n && b.t > 0.35 + b.sub * 0.18) {
        b.sub++;
        const a = Math.atan2(p.y + p.h / 2 - (b.y + 50), pcx - cx) + rand(0.3, -0.3);
        const pr = { x: cx + b.facing * 30, y: b.y + 50, vx: Math.cos(a) * 250, vy: Math.sin(a) * 250, r: 10, dmg: 16, kind: 'orb', friendly: false, life: 0, max: 5, grav: 0, spin: 0, homing: true };
        PROJ.push(pr);
        Sound.tone({ f: 300, f2: 700, t: 0.15, type: 'sine', g: 0.08 });
      }
      if (b.t > 1.6) { b.state = 'idle'; b.t = 0; }
    }
    else if (b.state === 'laser') {
      // تله‌گراف ۰.۸ ثانیه، شلیک ۱.۲ ثانیه با چرخش
      if (b.t < 0.85) { b.vx = 0; b.laserA = Math.atan2(p.y + p.h / 2 - (b.y + 36), pcx - cx); }
      else if (b.t < 2.05) {
        b.vx = 0;
        b.laserA += dt * 0.45 * (p.x < b.x ? -1 : 1);
        const ox = cx, oy = b.y + 36;
        const len = 900;
        // آسیب در طول پرتو
        for (let s = 20; s < len; s += 18) {
          const lx = ox + Math.cos(b.laserA) * s, ly = oy + Math.sin(b.laserA) * s;
          if (aabb({ x: lx - 9, y: ly - 9, w: 18, h: 18 }, rectOf(p))) { hurtPlayer(p, 16, lx, { fire: true }); break; }
        }
        if (b.t % 0.1 < dt) Cam.kick(2);
      }
      if (b.t > 2.3) { b.state = 'idle'; b.t = 0; }
    }
    else if (b.state === 'meteor') {
      b.vx = approach(b.vx, 0, 900 * dt);
      const n = b.phase === 3 ? 14 : 9;
      if (b.t > 0.4 && b.sub < n && b.t > 0.4 + b.sub * 0.13) {
        b.sub++;
        const px = clamp(p.x + rand(360, -360), 40, L.w - 40);
        PROJ.push({ x: px, y: -40, vx: rand(50, -50), vy: 220, r: 12, dmg: 15, kind: 'meteor', friendly: false, life: 0, max: 6, grav: 500, spin: 0 });
      }
      if (b.t > 2.6) { b.state = 'idle'; b.t = 0; }
    }
    else if (b.state === 'summon') {
      b.vx = approach(b.vx, 0, 900 * dt);
      if (b.t > 0.5 && b.sub === 0) {
        b.sub = 1;
        const n = b.phase === 3 ? 3 : 2;
        for (let i = 0; i < n; i++) {
          const ex = clamp(cx + rand(300, -300), 80, L.w - 80);
          const en = makeEnemy(Math.random() < 0.5 ? 'flyer' : 'bomber', ex, GROUND_Y - 140, 7);
          en.aggro = true; ENEMIES.push(en);
          ring(ex, GROUND_Y - 150, '#b57aff', 8, 420, 0.4);
        }
      }
      if (b.t > 1.2) { b.state = 'idle'; b.t = 0; }
    }
    moveEntity(b, dt);
    if (Math.random() < 0.004 && !b.say) say(b, pickAny(b.quips), 2);
  };
  b.draw = drawBoss3;
  return b;
}

function drawBoss3(c, b) {
  const cx = b.x + b.w / 2, by = b.y + b.h;
  const flash = b.hitFlash > 0;
  const SK = b.skin || EMPTY_SKIN;
  const C = col => flash ? '#ffffff' : (SK[col] || col);
  const bob = Math.sin(b.anim * 2.6) * 3;
  const rage = b.phase >= 3;

  // پرتو
  if (b.state === 'laser' && b.laserA !== undefined) {
    const ox = cx, oy = b.y + 36;
    if (b.t < 0.85) {
      c.save(); c.globalAlpha = 0.35 + Math.sin(b.anim * 30) * 0.2;
      c.strokeStyle = '#ff6b6b'; c.lineWidth = 3; c.setLineDash([12, 10]);

      c.setLineDash([]); c.restore();
    } else if (b.t < 2.05) {
      c.save();
      const g = c.createLinearGradient(ox, oy, ox + Math.cos(b.laserA) * 900, oy + Math.sin(b.laserA) * 900);
      g.addColorStop(0, 'rgba(255,255,255,.95)'); g.addColorStop(0.3, 'rgba(255,120,220,.85)'); g.addColorStop(1, 'rgba(180,80,255,0)');
      c.strokeStyle = g; c.lineWidth = 16 + Math.sin(b.anim * 40) * 4; c.lineCap = 'round';
      c.beginPath(); c.moveTo(ox, oy); c.lineTo(ox + Math.cos(b.laserA) * 900, oy + Math.sin(b.laserA) * 900); c.stroke();
      c.strokeStyle = 'rgba(255,255,255,.9)'; c.lineWidth = 5;
      c.beginPath(); c.moveTo(ox, oy); c.lineTo(ox + Math.cos(b.laserA) * 900, oy + Math.sin(b.laserA) * 900); c.stroke();
      c.restore();
      glow(c, ox, oy, 60, 'rgba(255,120,220,.8)', 0.7);
    }
  }

  c.save();
  c.translate(cx, by);

  fillRR(c, -28 + walk, -7, 24, 8, 4, C('#3a6ea5'));
  fillRR(c, 4 - walk, -7, 24, 8, 4, C('#3a6ea5'));

  // بدن
  ell(c, 0, -74 + bob, 34, 40, C(rage ? '#e0452c' : '#b8372a'));
  // ژاکت بافتنی
  c.fillStyle = C('#5c7a52');
  c.beginPath();
  c.moveTo(-34, -92 + bob); c.lineTo(-10, -92 + bob); c.lineTo(-12, -38 + bob); c.lineTo(-32, -42 + bob); c.fill();
  c.beginPath();
  c.moveTo(34, -92 + bob); c.lineTo(10, -92 + bob); c.lineTo(12, -38 + bob); c.lineTo(32, -42 + bob); c.fill();
  c.fillStyle = 'rgba(0,0,0,.15)';
  for (let i = 0; i < 5; i++) c.fillRect(-32, -86 + bob + i * 10, 64, 2);

  // دم
  c.strokeStyle = C('#b8372a'); c.lineWidth = 7; c.lineCap = 'round';
  c.beginPath(); c.moveTo(-30, -52 + bob);
  c.quadraticCurveTo(-60, -40 + bob + Math.sin(b.anim * 3) * 10, -52, -74 + bob);
  c.stroke();
  c.fillStyle = C('#8e2a1e');
  c.beginPath(); c.moveTo(-58, -74 + bob); c.lineTo(-44, -78 + bob); c.lineTo(-52, -92 + bob); c.fill();

  // سر
  ell(c, 4, -116 + bob, 24, 22, C(rage ? '#f05a3c' : '#c0392b'));

  c.fillStyle = C('#f0e4cc');
  c.beginPath(); c.moveTo(-14, -132 + bob); c.quadraticCurveTo(-34, -152 + bob, -18, -166 + bob);
  c.quadraticCurveTo(-18, -146 + bob, -2, -136 + bob); c.fill();
  c.beginPath(); c.moveTo(20, -132 + bob); c.quadraticCurveTo(40, -152 + bob, 24, -166 + bob);
  c.quadraticCurveTo(24, -146 + bob, 8, -136 + bob); c.fill();

  c.beginPath(); c.arc(4, -106 + bob, 7, 0.15 * Math.PI, 0.85 * Math.PI); c.stroke();
  c.fillStyle = C('#e8e8ee');
  c.beginPath();
  c.moveTo(-12, -102 + bob);
  c.quadraticCurveTo(-10, -84 + bob, 4, -80 + bob);
  c.quadraticCurveTo(18, -84 + bob, 20, -102 + bob);
  c.quadraticCurveTo(12, -96 + bob, 4, -97 + bob);
  c.quadraticCurveTo(-4, -96 + bob, -12, -102 + bob);
  c.fill();
  // عینک مطالعه
  c.strokeStyle = '#2b2b33'; c.lineWidth = 2.5;

  // لیوان چای در دست
  if (b.state === 'idle' || b.state === 'teleport') {
    c.save(); c.translate(36, -70 + bob); c.rotate(0.2);
    fillRR(c, -8, -10, 16, 18, 3, C('#f3f3f7'));
    c.strokeStyle = '#d8d8e2'; c.lineWidth = 2.4;
    c.beginPath(); c.arc(10, 0, 6, -1.2, 1.2); c.stroke();

    c.globalAlpha = 0.5;
    for (let i = 0; i < 2; i++) {
      c.strokeStyle = '#fff'; c.lineWidth = 2;
      c.beginPath(); c.moveTo(-3 + i * 5, -12); c.quadraticCurveTo(0 + i * 5, -20 + Math.sin(b.anim * 4 + i) * 3, -3 + i * 5, -26); c.stroke();

    c.beginPath(); c.arc(-7, -20, 7, 0, Math.PI, true); c.stroke();
    c.restore();
  }
  c.restore();
  drawBossSpeech(c, b);
}

/* حباب گفتار رئیس */
function drawBossSpeech(c, b) {
  if (!b.say) return;
  const x = b.x + b.w / 2, y = b.y - 34;
  c.save();
  c.font = '700 18px Vazirmatn, Tahoma, sans-serif';

];

function makeBossFor(level) {
  const n = Math.max(1, Math.round(level / 3));
  const slot = BOSS_SLOTS[Math.min(n, BOSS_SLOTS.length) - 1];
  const b = slot.fn(level);
  b.maxHp = slot.hp; b.hp = slot.hp;
  b.contactDmg = slot.dmg;
  /* نخستین نبردِ رئیسِ بازی جای یاد گرفتن است، نه جای دیوار خوردن.
     این پرچم فقط روی سالن ۳ روشن می‌شود؛ شش رئیسی که از همین الگو
     ریمیکس شده‌اند (۱۲، ۲۱، …) دست‌نخورده و سخت می‌مانند. */
  b.rookie = (level === 3);
  return b;
}

/* ---------------- HUD ---------------- */
function updateHUD(p) {
  const pct = clamp(p.hp / p.maxHp, 0, 1) * 100;
  UI.hpFill.style.width = pct + '%';
  UI.hpFill.style.background = pct > 50 ? 'linear-gradient(90deg,#49d67a,#9bf0a8)'
    : pct > 25 ? 'linear-gradient(90deg,#e8b23a,#ffd978)' : 'linear-gradient(90deg,#e04444,#ff8a8a)';
  UI.hpText.textContent = faNum(p.hp) + ' / ' + faNum(p.maxHp);
  UI.score.textContent = faNum(RUN.score);
  if (UI.coinVal) UI.coinVal.textContent = '🪙 ' + faNum(RUN.coins || 0);
  if (UI.gemVal) UI.gemVal.textContent = '💎 ' + faNum(RUN.gems || 0);
  if (UI.lootVal) {
    const n = Object.values(RUN.loot || {}).reduce((a, b) => a + b, 0);
    UI.lootVal.textContent = n ? '🎁 ' + faNum(n) : '';
  }
  updatePowerButton();
  if (RUN.combo > 1 && RUN.comboT > 0) {
    UI.combo.style.opacity = '1';
    UI.combo.textContent = 'زنجیره × ' + faNum(RUN.combo);
    UI.combo.style.transform = 'scale(' + (1 + Math.min(0.35, RUN.combo * 0.02)) + ')';
  } else UI.combo.style.opacity = '0';

  // تراشه‌ی مرحله: همیشه بدانی کجای ۶۹ سالن ایستاده‌ای
  if (UI.stageChip) {
    const n = RUN ? RUN.level : 0;
    const show = !L.arena && !L.town && n >= 1;
    UI.stageChip.classList.toggle('show', show);
    if (show) {
      UI.stageNum.textContent = 'سالن ' + faNum(n) + ' از ' + faNum(FINAL_LEVEL);
      const W = typeof worldOf === 'function' ? worldOf(L.theme) : null;
      UI.stageWorld.textContent = W ? W.name : '';
      UI.stageChip.classList.toggle('boss', !!L.isBoss);
      if (W) UI.stageChip.style.setProperty('--wc', W.lip);
    }
  }

  const remaining = ENEMIES.filter(e => !e.dead && !e.isBoss).length;
  if (L.arena) {
    const left = ENEMIES.filter(e => !e.dead).length;
    UI.objective.textContent = typeof ARENA !== 'undefined' && ARENA
      ? 'موجِ ' + faNum(ARENA.wave) + (left ? ' — ' + faNum(left) + ' دشمن مانده' : ' — پاک شد!')
      : '';
  }
  else if (L.town) UI.objective.textContent = 'خرید کن، نفسی تازه کن — بعد برو سمت دروازه →';
  else if (L.isBoss) UI.objective.textContent = 'رئیس را شکست بده!';
  else if (remaining > 0) UI.objective.textContent = 'دشمنان باقی‌مانده: ' + faNum(remaining);
  else UI.objective.textContent = 'در باز شد — برو سمت نور! →';

  if (BOSS && !BOSS.dead) {
    UI.bossBar.classList.add('show');
    UI.bossFill.style.width = clamp(BOSS.hp / BOSS.maxHp, 0, 1) * 100 + '%';
    UI.bossName.textContent = BOSS.name;
    UI.bossTitle.textContent = BOSS.title + ' — فاز ' + faNum(BOSS.phase);
  } else UI.bossBar.classList.remove('show');
}

function renderPerks() {
  UI.perks.innerHTML = RUN.perks.map(p =>

/* ---------------- چهره‌ها ---------------- */
function drawAngel(c, x, y, s, t, mood = 'happy') {
  c.save();
  c.translate(x, y); c.scale(s, s);
  const bob = Math.sin(t * 2) * 4;
  // هاله
  c.save();
  c.translate(0, -74 + bob); c.rotate(Math.sin(t) * 0.1);
  c.strokeStyle = '#ffd95e'; c.lineWidth = 5;
  if (PERF.softGlow) { c.shadowColor = 'rgba(255,215,90,.9)'; c.shadowBlur = 14; }
  c.beginPath(); c.ellipse(0, 0, 20, 6, 0, 0, TAU); c.stroke();
  c.restore();
  c.shadowBlur = 0;
  // بال‌ها
  c.fillStyle = 'rgba(255,255,255,.95)';
  const flap = Math.sin(t * 3) * 8;
  for (const d of [-1, 1]) {
    c.save(); c.scale(d, 1);
    c.beginPath();
    c.moveTo(16, -40 + bob);
    c.quadraticCurveTo(52, -62 - flap + bob, 60, -20 + bob);
    c.quadraticCurveTo(44, -28 + bob, 18, -22 + bob);
    c.fill();
    c.restore();
  }
  // بدن (ردای سفید)
  c.fillStyle = '#fdfdff';
  c.beginPath();
  c.moveTo(-20, -46 + bob); c.lineTo(20, -46 + bob);
  c.quadraticCurveTo(30, 0, 0, 2); c.quadraticCurveTo(-30, 0, -20, -46 + bob);
  c.fill();
  c.strokeStyle = '#cfe3f5'; c.lineWidth = 2; c.stroke();
  // کمربند و کارت شناسایی
  c.fillStyle = '#9fd0f5'; c.fillRect(-20, -26 + bob, 40, 5);
  c.strokeStyle = '#8aa8c0'; c.lineWidth = 1.6;
  c.beginPath(); c.moveTo(-8, -44 + bob); c.lineTo(2, -24 + bob); c.stroke();
  fillRR(c, -4, -24 + bob, 16, 11, 2, '#ffd95e');
  c.fillStyle = '#5a4210'; c.fillRect(-2, -21 + bob, 11, 1.5); c.fillRect(-2, -18 + bob, 7, 1.5);
  // سر
  circle(c, 0, -58 + bob, 17, '#ffe0c2');
  // مو
  c.fillStyle = '#6b4a2a';
  c.beginPath(); c.ellipse(0, -68 + bob, 17, 10, 0, Math.PI, 0); c.fill();
  // چشم‌ها
  const squint = mood === 'smug' ? 0.4 : 1;
  c.fillStyle = '#fff';
  c.beginPath(); c.ellipse(-6, -58 + bob, 4.6, 5 * squint, 0, 0, TAU); c.fill();
  c.beginPath(); c.ellipse(6, -58 + bob, 4.6, 5 * squint, 0, 0, TAU); c.fill();
  c.fillStyle = '#3a2a1a';
  const eyeShift = Math.sin(t * 0.7) * 1.4;
  c.beginPath(); c.arc(-6 + eyeShift, -57 + bob, 2.2, 0, TAU); c.fill();
  c.beginPath(); c.arc(6 + eyeShift, -57 + bob, 2.2, 0, TAU); c.fill();
  // عینک گرد
  c.strokeStyle = 'rgba(80,80,90,.8)'; c.lineWidth = 1.6;
  c.beginPath(); c.arc(-6, -58 + bob, 7, 0, TAU); c.stroke();
  c.beginPath(); c.arc(6, -58 + bob, 7, 0, TAU); c.stroke();
  c.beginPath(); c.moveTo(1, -58 + bob); c.lineTo(-1, -58 + bob); c.stroke();
  // لبخند
  c.strokeStyle = '#b4785a'; c.lineWidth = 2;
  c.beginPath();
  if (mood === 'worried') c.arc(0, -46 + bob, 5, Math.PI, 0);
  else c.arc(0, -49 + bob, 5.5, 0.1 * Math.PI, 0.9 * Math.PI);
  c.stroke();
  // تخته‌شاسی
  c.save();
  c.translate(26, -34 + bob); c.rotate(-0.25);
  fillRR(c, -11, -14, 22, 28, 2, '#c89a5b');
  c.fillStyle = '#fdf6e3'; c.fillRect(-9, -11, 18, 22);
  c.fillStyle = '#9aa3b2';
  for (let i = 0; i < 4; i++) c.fillRect(-7, -8 + i * 5, 14, 1.6);
  c.fillStyle = '#8a8a96'; c.fillRect(-5, -16, 10, 4);
  c.restore();
  c.restore();
}

function drawPortrait(who) {
  const c = UI.pctx;
  c.clearRect(0, 0, 112, 112);
  c.save();
  const g = c.createLinearGradient(0, 0, 0, 112);
  if (who === 'angel') { g.addColorStop(0, '#dff1ff'); g.addColorStop(1, '#fff7dd'); }
  else if (who === 'hero') { g.addColorStop(0, '#e9f6ff'); g.addColorStop(1, '#cfe6ff'); }
  else { g.addColorStop(0, '#3a0f18'); g.addColorStop(1, '#8e2416'); }
  c.fillStyle = g; c.fillRect(0, 0, 112, 112);
  if (who === 'angel') {
    c.save(); c.translate(0, 18); drawAngel(c, 56, 100, 0.95, timeNow); c.restore();
  } else if (who === 'hero') {
    const fake = {
      anim: timeNow, squash: 1, onGround: true, vx: 0, flash: 0, atkT: 0, idleT: 0,
      combo: 0, slam: false, dashT: 0, h: 42, w: 26
    };
    c.save(); c.translate(0, 26); c.scale(1.5, 1.5); drawSpirit(c, 37, 56, 1, fake, false); c.restore();
  } else {
    c.save(); c.translate(56, 92); c.scale(0.62, 0.62);
    if (BOSS) { c.translate(-BOSS.x - BOSS.w / 2, -BOSS.y - BOSS.h); BOSS.draw(c, BOSS); }
    c.restore();
  }
  c.restore();
}

/* ---------------- گفت‌وگو ---------------- */
const Dlg = {
  lines: [], i: 0, chars: 0, t: 0, active: false, done: null, speed: 42,
  start(lines, onDone) {
    this.lines = lines; this.i = 0; this.chars = 0; this.t = 0; this.active = true; this.done = onDone;
    UI.dlg.classList.add('show');
    this.render();
  },
  render() {
    const l = this.lines[this.i];
    if (!l) return;
    UI.dlgName.textContent = l.who === 'angel' ? 'هوشنگ — فرشته‌ی کارآموز'
      : l.who === 'hero' ? 'منوچهر — روحِ تازه‌وارد'
        : l.who === 'boss' ? (BOSS ? BOSS.name : 'رئیس') : 'راوی';
    UI.dlgName.className = 'dlg-name ' + l.who;
    UI.dlgText.textContent = '';
    drawPortrait(l.who === 'hero' ? 'hero' : l.who === 'boss' ? 'boss' : 'angel');
  },
  update(dt) {
    if (!this.active) return;
    const l = this.lines[this.i];
    if (!l) return;
    if (this.chars < l.text.length) {
      this.t += dt;
      const target = Math.min(l.text.length, Math.floor(this.t * this.speed));
      if (target > this.chars) {
        this.chars = target;
        UI.dlgText.textContent = l.text.slice(0, this.chars);
        if (this.chars % 3 === 0) Sound.blip(620 + (this.chars % 5) * 40);
      }
      UI.dlgHint.textContent = 'فاصله: رد کردن';
    } else {
      UI.dlgHint.textContent = 'فاصله / کلیک: ادامه ▸';
    }
    if (timeNow % 0.2 < dt) drawPortrait(l.who === 'hero' ? 'hero' : l.who === 'boss' ? 'boss' : 'angel');
    if (IN.confirm) this.advance();
  },
  advance() {
    const l = this.lines[this.i];
    if (!l) return;
    if (this.chars < l.text.length) { this.chars = l.text.length; UI.dlgText.textContent = l.text; return; }
    this.i++; this.chars = 0; this.t = 0;
    Sound.ui();
    if (this.i >= this.lines.length) {
      this.active = false;
      UI.dlg.classList.remove('show');
      const cb = this.done; this.done = null;
      if (cb) cb();
    } else this.render();
  }
};

/* ---------------- اورلی/منوها ---------------- */
function showOverlay(html, cls = '') {
  // پیشوند «ov-» تا کلاس‌های داخلی (مثل menu) روی خود اورلی اثر نگذارند
  UI.overlay.className = 'show' + (cls ? ' ov-' + cls : '');
  UI.overlay.innerHTML = html;
  overlayButtons = Array.from(UI.overlay.querySelectorAll('[data-action]'));
  overlayIndex = 0;
  overlayOpen = true;
  highlightBtn();
}
function hideOverlay() {
  UI.overlay.className = '';
  UI.overlay.innerHTML = '';
  overlayButtons = []; overlayOpen = false;
}
function highlightBtn() {
  overlayButtons.forEach((b, i) => b.classList.toggle('sel', i === overlayIndex));
}
function overlayInput() {
  if (!overlayOpen || overlayButtons.length === 0) return;
  if (hit('ArrowDown', 'KeyS', 'ArrowLeft', 'KeyA')) { overlayIndex = (overlayIndex + 1) % overlayButtons.length; Sound.blip(500); highlightBtn(); }
  if (hit('ArrowUp', 'KeyW', 'ArrowRight', 'KeyD')) { overlayIndex = (overlayIndex - 1 + overlayButtons.length) % overlayButtons.length; Sound.blip(500); highlightBtn(); }
  if (hit('Enter', 'Space', 'NumpadEnter', 'KeyJ')) {
    const b = overlayButtons[overlayIndex];
    if (b) { Sound.ui(); doAction(b.dataset.action, b.dataset.arg); }
  }
}

/* ---------------- کنترل لمسی ---------------- */
/* سه حالت: 'auto' (تشخیص خودکار) | 'on' (همیشه روشن) | 'off' (همیشه خاموش).
   تشخیصِ خودکار به‌تنهایی کافی نیست: لپ‌تاپِ لمسی، تبلتِ وصل‌به‌کیبورد، حالتِ
   «نمایش دسکتاپ» و بعضی iframeها خودشان را «لمسی» معرفی نمی‌کنند. پس سه لایه داریم:
   ۱) مدیا-کوئریِ pointer: coarse   ۲) اولین لمسِ واقعیِ صفحه   ۳) کلیدِ دستی در منو. */
const TOUCH = { on: false, bound: false, gestures: false };
const TOUCH_MAP = {
  tLeft: 'ArrowLeft', tRight: 'ArrowRight', tJump: 'Space', tAtk: 'KeyJ',
  tDash: 'ShiftLeft', tDown: 'ArrowDown', tUp: 'ArrowUp', tPower: 'KeyK'
};

function touchPref() { return Store.get('touchui', 'auto'); }
/* هر نشانه‌ای از صفحه‌ی لمسی کافی است — pointer: coarse به‌تنهایی خیلی دستگاه را از قلم می‌اندازد */
function touchDetected() {
  return PERF.mobile || (navigator.maxTouchPoints || 0) > 0 || ('ontouchstart' in window);
}
function touchWanted() {
  const p = touchPref();
  return p === 'on' ? true : (p === 'off' ? false : touchDetected());
}

/* ---------------- تنظیماتِ دکمه‌های لمسی ----------------
   اندازه، شفافیت، دست‌چپ/راست، لرزش و جای دلخواهِ هر دسته (کشیدنی).
   جابه‌جایی بر حسب درصدِ صفحه ذخیره می‌شود تا با چرخاندن گوشی هم معنا بدهد. */
const TCFG_DEF = { scale: 1, alpha: 1, hand: 'r', vibe: true, pos: {} };
let TCFG = null;

function loadTouchCfg() {
  const raw = Store.get('touchcfg', null);
  TCFG = Object.assign({}, TCFG_DEF, raw && typeof raw === 'object' ? raw : {});
  TCFG.pos = Object.assign({}, (raw && raw.pos) || {});
  return TCFG;
}
function saveTouchCfg() { Store.set('touchcfg', TCFG); }

function applyTouchCfg() {
  if (!TCFG) loadTouchCfg();
  const t = $('touch');
  if (!t) return;
  t.style.setProperty('--tscale', TCFG.scale);
  t.style.setProperty('--talpha', TCFG.alpha);
  document.body.classList.toggle('lefty', TCFG.hand === 'l');
  for (const key of ['tpad', 'tact', 'tex']) {
    const el = t.querySelector('.' + key);
    if (!el) continue;
    const o = TCFG.pos[key];
    el.style.transform = o ? `translate(${o.x}vw, ${o.y}vh)` : '';
  }
}

function resetTouchCfg() {
  TCFG = Object.assign({}, TCFG_DEF, { pos: {} });
  saveTouchCfg(); applyTouchCfg();
}

/* ---- حالت چیدمان: دسته‌ها را با انگشت جابه‌جا کن ---- */
let tEditOn = false;
function touchEditOn() { return tEditOn; }
function setTouchEdit(on) {
  tEditOn = !!on;
  document.body.classList.toggle('tedit', tEditOn);
  const t = $('touch');
  if (t) t.classList.toggle('editing', tEditOn);
}

function bindTouchDrag() {
  const t = $('touch');
  if (!t) return;
  for (const key of ['tpad', 'tact', 'tex']) {
    const el = t.querySelector('.' + key);
    if (!el) continue;
    let drag = null;
    el.addEventListener('pointerdown', e => {
      if (!tEditOn) return;
      e.preventDefault(); e.stopPropagation();
      const o = TCFG.pos[key] || { x: 0, y: 0 };
      drag = { id: e.pointerId, sx: e.clientX, sy: e.clientY, ox: o.x, oy: o.y };
      el.setPointerCapture(e.pointerId);
      el.classList.add('dragging');
    }, { capture: true });
    el.addEventListener('pointermove', e => {
      if (!drag || e.pointerId !== drag.id) return;
      e.preventDefault();
      const nx = drag.ox + (e.clientX - drag.sx) / window.innerWidth * 100;
      const ny = drag.oy + (e.clientY - drag.sy) / window.innerHeight * 100;
      TCFG.pos[key] = { x: clamp(nx, -70, 70), y: clamp(ny, -70, 70) };
      applyTouchCfg();
    }, { capture: true });
    const end = e => {
      if (!drag || e.pointerId !== drag.id) return;
      drag = null; el.classList.remove('dragging'); saveTouchCfg();
    };
    el.addEventListener('pointerup', end, { capture: true });
    el.addEventListener('pointercancel', end, { capture: true });
  }
}

function setupTouch() {
  loadTouchCfg();
  bindTouchButtons();
  bindTouchChip();
  bindTouchDrag();
  applyTouchCfg();
  applyTouchUI(touchWanted());

  // لایه‌ی دوم: اگر مرورگر لمسی‌بودنش را اعلام نکرده بود، اولین لمسِ واقعی لوش می‌دهد
  window.addEventListener('touchstart', () => {
    if (!TOUCH.on && touchPref() === 'auto') {
      applyTouchUI(true);
      toast('📱 دکمه‌های لمسی روشن شد — از منوی مکث می‌توانی خاموشش کنی.', 4);
    }
  }, { passive: true });

  window.addEventListener('orientationchange', () => setTimeout(checkOrientation, 220));
  window.addEventListener('resize', checkOrientation);
}

/* شنونده‌ها یک‌بار بسته می‌شوند؛ وقتی دکمه‌ها پنهان‌اند اصلاً رویدادی نمی‌گیرند */
function bindTouchButtons() {
  if (TOUCH.bound) return;
  TOUCH.bound = true;
  for (const id in TOUCH_MAP) {
    const el = $(id);
    if (!el) continue;
    const code = TOUCH_MAP[id];
    const on = e => {
      if (tEditOn) return;                       // در حالت چیدمان، لمس یعنی «بکش»
      e.preventDefault(); Sound.unlock(); vkey(code, true); el.classList.add('press');
      if (TCFG && TCFG.vibe && navigator.vibrate) navigator.vibrate(8);
    };
    const off = e => { e.preventDefault(); vkey(code, false); el.classList.remove('press'); };
    el.addEventListener('pointerdown', on, { passive: false });
    el.addEventListener('pointerup', off);
    el.addEventListener('pointercancel', off);
    el.addEventListener('pointerleave', off);
  }
  // دکمه‌ی مکث (تک‌ضرب، نه نگه‌داشتن)
  const pz = $('tPause');
  if (pz) pz.addEventListener('pointerdown', e => {
    e.preventDefault(); Sound.unlock();
    doAction(GAMESTATE === 'play' ? 'pause' : 'resume');
  }, { passive: false });
}

/* دکمه‌ی همیشه‌حاضرِ «📱 دکمه‌های لمسی» */
function bindTouchChip() {
  const chip = $('touchChip');
  if (!chip) return;
  chip.addEventListener('pointerdown', e => {
    e.preventDefault(); Sound.unlock();
    Store.set('touchui', 'on');
    applyTouchUI(true);
    toast('📱 دکمه‌های لمسی آمد. برای اندازه و جایش: منو ← دکمه‌های لمسی.', 4);
  }, { passive: false });
}

/* روشن/خاموش کردن در همان لحظه — بدون نیاز به بارگذاری دوباره‌ی صفحه */
function applyTouchUI(on) {
  TOUCH.on = !!on;
  const t = $('touch');
  if (t) t.classList.toggle('show', TOUCH.on);
  document.body.classList.toggle('is-touch', TOUCH.on);
  const chip = $('touchChip');
  if (chip) chip.classList.toggle('show', !TOUCH.on);

  if (!TOUCH.on) {
    // کلیدهای مجازیِ نیمه‌فشرده را رها کن تا بازیکن تا ابد به چپ ندود
    for (const id in TOUCH_MAP) {
      vkey(TOUCH_MAP[id], false);
      const el = $(id); if (el) el.classList.remove('press');
    }
  } else if (!TOUCH.gestures) {
    // جلوگیری از زوم دوضربه‌ای، کشیدن صفحه و منوی راست‌کلیک — فقط وقتی لمسی فعال است
    TOUCH.gestures = true;
    const stop = e => { if (e.target.closest('#overlay')) return; e.preventDefault(); };
    document.addEventListener('gesturestart', e => e.preventDefault());
    document.addEventListener('contextmenu', e => e.preventDefault());
    document.addEventListener('touchmove', stop, { passive: false });
    document.addEventListener('dblclick', stop, { passive: false });
  }
  applyTouchCfg();
  if (typeof resize === 'function') resize();
  checkOrientation();
  updatePowerButton();
}

/* یادآوریِ چرخاندن — دیگر پرده‌ی تمام‌صفحه نیست: یک نوارِ باریک که بعد از
   چند ثانیه خودش می‌رود. حالت عمودی کاملاً قابل بازی است. */
let rotateHintT = null;
function checkOrientation() {
  const hint = $('rotateHint');
  if (!hint) return;
  const portrait = window.innerHeight > window.innerWidth * 1.08;
  const want = TOUCH.on && PERF.mobile && portrait;
  if (want && !hint.classList.contains('show')) {
    hint.classList.add('show');
    clearTimeout(rotateHintT);
    rotateHintT = setTimeout(() => hint.classList.remove('show'), 4200);
  } else if (!want) {
    clearTimeout(rotateHintT);
    hint.classList.remove('show');
  }
  if (typeof resize === 'function') resize();
}

/* نمایش وضعیت قدرت ویژه روی دکمه‌ی لمسی */
function updatePowerButton() {
  const btn = $('tPower');
  if (!btn || !TOUCH.on) return;
  if (!RUN || !RUN.power) { btn.classList.add('empty'); btn.classList.remove('ready'); return; }
  const pw = powerById(RUN.power);
  const ic = $('tPowerIcon'), cd = $('tPowerCd');
  if (ic && pw) ic.textContent = pw.icon;
  const left = RUN.powerCd || 0;
  btn.classList.remove('empty');
  btn.classList.toggle('ready', left <= 0);
  if (cd) cd.textContent = left > 0 ? faNum(Math.ceil(left)) : '';
}


/* ===== 065-map.js ===== */
/* ============================================================
   نقشه‌ی مرحله‌ها — صفحه‌ی پیمایشِ سالن‌ها به سبکِ نقشه‌ی جهان
   روحِ منوچهر روی مسیر راه می‌رود، هر دنیا رنگ و زمینه‌ی خودش را دارد.
   ============================================================ */

const MAP_GAP = 112;          // فاصله‌ی افقیِ دو گره
const MAP_BASE_Y = 330;       // خطِ میانیِ مسیر
const MAP_AMP = 40;           // دامنه‌ی موجِ مسیر

let MAP = null;

function mapNodeX(i) { return 150 + i * MAP_GAP; }
function mapNodeY(i) {
  // موجِ دوفرکانسی تا مسیر یکنواخت به‌نظر نرسد
  return MAP_BASE_Y + Math.sin(i * 0.78) * MAP_AMP + Math.sin(i * 0.31 + 1.4) * 18;
}

function buildMap(startLevel) {
  const maxL = maxLevelReached();
  const done = Store.get('finished', false);
  const nodes = [];
  for (let n = 1; n <= FINAL_LEVEL; n++) {
    nodes.push({
      n,
      x: mapNodeX(n - 1),
      y: mapNodeY(n - 1),
      boss: isBossLevel(n),
      world: worldIdOf(n),
      unlocked: done || n <= maxL + 1,
      pop: 0
    });
  }
  const want = clamp(startLevel || 1, 1, FINAL_LEVEL);
  let sel = nodes.findIndex(d => d.n === want);
  if (sel < 0) sel = 0;
  // اگر قفل بود، برو به آخرین بازِ قبلش
  while (sel > 0 && !nodes[sel].unlocked) sel--;

  MAP = {
    nodes, sel,
    tokX: nodes[sel].x, tokY: nodes[sel].y,
    walkFrom: -1, walkTo: -1, walkT: 0, walkDur: 0,
    camX: nodes[sel].x - VW / 2,
    t: 0, bob: 0, enterT: 0, hintT: 3.2,
    lastWorld: nodes[sel].world
  };
  MAP.camX = clamp(MAP.camX, 0, Math.max(0, mapNodeX(FINAL_LEVEL - 1) + 150 - VW));
  return MAP;
}

/* باز کردنِ نقشه. `walkFrom` یعنی روح از آن سالن تا سالنِ هدف راه برود. */
function showMap(startLevel, walkFrom) {
  hideOverlay();
  GAMESTATE = 'map';
  buildMap(startLevel);
  Sound.mode = 'heaven';
  if (walkFrom && walkFrom >= 1 && walkFrom < (startLevel || 1)) {
    const fi = walkFrom - 1;
    MAP.tokX = mapNodeX(fi); MAP.tokY = mapNodeY(fi);
    MAP.walkFrom = fi; MAP.walkTo = MAP.sel;
    MAP.walkT = 0; MAP.walkDur = 0.55 + Math.abs(MAP.sel - fi) * 0.25;
  }
}

function mapSelNode() { return MAP ? MAP.nodes[MAP.sel] : null; }

function mapMove(dir) {
  if (!MAP || MAP.walkTo >= 0) return;
  const next = MAP.sel + dir;
  if (next < 0 || next >= MAP.nodes.length) return;
  if (!MAP.nodes[next].unlocked) {
    Sound.tone({ f: 180, f2: 120, t: 0.12, type: 'square', g: 0.05 });
    toast('این سالن هنوز باز نشده', 1.1);
    return;
  }
  MAP.walkFrom = MAP.sel; MAP.walkTo = next;
  MAP.walkT = 0; MAP.walkDur = 0.3;
  MAP.sel = next;
  MAP.hintT = 0;
  Sound.blip(620);
}

function updateMap(dt) {
  if (!MAP) return;
  MAP.t += dt; MAP.bob += dt;
  if (MAP.hintT > 0) MAP.hintT -= dt;
  overlayInput();

  // ---- راه رفتنِ روح بین گره‌ها ----
  if (MAP.walkTo >= 0) {
    MAP.walkT += dt;
    const k = clamp(MAP.walkT / MAP.walkDur, 0, 1);
    const e = k < 0.5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2;   // easeInOutQuad
    const ax = mapNodeX(MAP.walkFrom), ay = mapNodeY(MAP.walkFrom);
    const bx = mapNodeX(MAP.walkTo), by = mapNodeY(MAP.walkTo);
    MAP.tokX = ax + (bx - ax) * e;
    MAP.tokY = ay + (by - ay) * e - Math.sin(k * Math.PI) * 16;        // قوسِ کوچکِ قدم
    if (k >= 1) {
      MAP.sel = MAP.walkTo;
      MAP.tokX = bx; MAP.tokY = by;
      MAP.nodes[MAP.sel].pop = 1;
      MAP.walkFrom = -1; MAP.walkTo = -1;
      const w = MAP.nodes[MAP.sel].world;
      if (w !== MAP.lastWorld) {
        MAP.lastWorld = w;
        toast('دنیای تازه: ' + worldNameOf(MAP.nodes[MAP.sel].n), 2.4);
        Sound.win();
      }
    }
  } else {
    // ---- کنترل ----
    if (hit('ArrowRight', 'KeyD')) mapMove(1);
    if (hit('ArrowLeft', 'KeyA')) mapMove(-1);
    if (hit('KeyJ', 'KeyX', 'Space', 'Enter', 'NumpadEnter', 'KeyW', 'ArrowUp')) {
      const nd = mapSelNode();
      if (nd && nd.unlocked) {
        Sound.ui();
        MAP.enterT = 0.001;
      }
    }
    if (IN.pause) { GAMESTATE = 'menu'; MAP = null; showMenu(); return; }

    // لمس/کلیک روی گره: اولین زدن انتخاب می‌کند، زدنِ دوباره روی همان گره وارد می‌شود
    const pt = takePointer();
    if (pt) {
      let best = -1, bestD = 34 * 34;
      for (let i = 0; i < MAP.nodes.length; i++) {
        const nd = MAP.nodes[i];
        const dx = (nd.x - MAP.camX) - pt.x, dy = nd.y - pt.y;
        const d = dx * dx + dy * dy;
        if (d < bestD) { bestD = d; best = i; }
      }
      if (best >= 0) {
        const nd = MAP.nodes[best];
        if (!nd.unlocked) { toast('این سالن هنوز باز نشده', 1.1); Sound.tone({ f: 180, f2: 120, t: 0.12, type: 'square', g: 0.05 }); }
        else if (best === MAP.sel) { Sound.ui(); MAP.enterT = 0.001; }
        else {
          MAP.walkFrom = MAP.sel; MAP.walkTo = best;
          MAP.walkT = 0; MAP.walkDur = 0.3 + Math.min(0.5, Math.abs(best - MAP.sel) * 0.05);
          MAP.sel = best; MAP.hintT = 0; Sound.blip(620);
        }
      }
    }
  }

  // ---- ورود به سالن ----
  if (MAP.enterT > 0) {
    MAP.enterT += dt;
    if (MAP.enterT > 0.18) {
      const nd = mapSelNode();
      MAP.enterT = 0;
      MAP = null;
      startLevelFromMenu(nd.n);
      return;
    }
  }

  for (const nd of MAP.nodes) if (nd.pop > 0) nd.pop = Math.max(0, nd.pop - dt * 2.4);

  // ---- دوربین ----
  const tx = clamp(MAP.tokX - VW / 2, 0, Math.max(0, mapNodeX(FINAL_LEVEL - 1) + 150 - VW));
  MAP.camX = approach(MAP.camX, tx, Math.max(380, Math.abs(tx - MAP.camX) * 5) * dt);
}

/* ---------------- رسم ---------------- */
function drawMap(c) {
  if (!MAP) return;
  const camX = MAP.camX;

  // ---- آسمانِ دنیای گرهِ انتخابی، با محوشدنِ نرم به دنیای بعدی ----
  const selNode = mapSelNode();
  const W = WORLDS[selNode.world];
  c.fillStyle = vGrad(c, 0, VH, W.sky);      // sky آرایه‌ی [نقطه, رنگ, …] است
  c.fillRect(0, 0, VW, VH);

  // کُره‌ی دوردستِ همان دنیا (چشمِ سرخ، ماهِ یخی، چراغِ وضعیت…)
  const O = W.orb;
  const mx = VW * O.x - camX * 0.04, my = O.y;
  glow(c, mx, my, O.r * 3.5, O.glow, 0.7);
  circle(c, mx, my, O.r, O.out);
  circle(c, mx + O.r * 0.19, my + O.r * 0.08, O.r * 0.85, O.in);
  circle(c, mx + O.r * 0.08, my, O.r * 0.3, O.pupil);

  // ---- نوارهای دنیا: هر دنیا یک تپه‌ی پس‌زمینه با رنگ خودش ----
  for (const wp of WORLD_PLAN) {
    const WW = WORLDS[wp.id];
    const x0 = mapNodeX(wp.from - 1) - MAP_GAP * 0.6 - camX;
    const x1 = mapNodeX(wp.to - 1) + MAP_GAP * 0.6 - camX;
    if (x1 < -80 || x0 > VW + 80) continue;
    // تپه
    c.fillStyle = WW.ridge[0];
    c.beginPath();
    c.moveTo(x0, VH);
    for (let x = x0; x <= x1; x += 24) {
      const k = (x + camX) * 0.004;
      c.lineTo(x, 404 + Math.sin(k) * 26 + Math.sin(k * 2.3) * 12);
    }
    c.lineTo(x1, VH); c.closePath(); c.fill();
    // کفِ دنیا
    c.fillStyle = WW.ground[0];
    c.fillRect(x0, 452, x1 - x0, VH - 452);
    c.fillStyle = WW.lip;
    c.fillRect(x0, 452, x1 - x0, 4);
    // مرزِ دنیا + نامش
    if (x0 > -200 && x0 < VW + 200) {
      c.save();
      c.strokeStyle = 'rgba(255,255,255,.18)'; c.lineWidth = 2;
      c.setLineDash([7, 9]);
      c.beginPath(); c.moveTo(x0, 150); c.lineTo(x0, VH); c.stroke();
      c.restore();
    }
    if (x1 > 50 && x0 < VW - 50) {
      c.save();
      c.font = '700 14px Vazirmatn, sans-serif';
      c.textAlign = 'center'; c.textBaseline = 'top';
      c.globalAlpha = 0.92;
      const tw = c.measureText(WW.name).width;
      // وسطِ بخشِ دیده‌شده‌ی همین دنیا، ولی همیشه کاملاً داخلِ کادر
      const vis0 = Math.max(x0, 8), vis1 = Math.min(x1, VW - 8);
      const bx = clamp((vis0 + vis1) / 2, tw / 2 + 18, VW - tw / 2 - 18);
      fillRR(c, bx - tw / 2 - 11, 150, tw + 22, 24, 7, 'rgba(8,4,14,.62)');
      c.fillStyle = WW.lip;
      c.fillText(WW.name, bx, 154);
      c.restore();
    }
  }

  // ---- مسیر ----
  c.save();
  c.lineCap = 'round'; c.lineJoin = 'round';
  c.strokeStyle = 'rgba(10,5,18,.45)'; c.lineWidth = 13;
  c.beginPath();
  for (let i = 0; i < MAP.nodes.length; i++) {
    const nd = MAP.nodes[i];
    const x = nd.x - camX;
    if (i === 0) c.moveTo(x, nd.y); else c.lineTo(x, nd.y);
  }
  c.stroke();
  c.setLineDash([3, 13]);
  c.strokeStyle = 'rgba(255,233,168,.75)'; c.lineWidth = 3;
  c.stroke();
  c.setLineDash([]);
  c.restore();

  // ---- گره‌ها ----
  for (const nd of MAP.nodes) {
    const x = nd.x - camX, y = nd.y;
    if (x < -70 || x > VW + 70) continue;
    const WW = WORLDS[nd.world];
    const isSel = nd.n === selNode.n;
    const r = (nd.boss ? 17 : 13) + (nd.pop > 0 ? nd.pop * 4 : 0) + (isSel ? 2 : 0);

    c.globalAlpha = 0.3; ell(c, x, y + r + 5, r * 0.9, 4, '#000'); c.globalAlpha = 1;

    if (!nd.unlocked) {
      // قفل: دایره‌ی خاکستری و یک قفلِ کوچک
      c.fillStyle = 'rgba(255,255,255,.1)';
      c.beginPath(); c.arc(x, y, r, 0, TAU); c.fill();
      c.strokeStyle = 'rgba(255,255,255,.2)'; c.lineWidth = 2;
      c.beginPath(); c.arc(x, y, r, 0, TAU); c.stroke();
      c.fillStyle = 'rgba(255,255,255,.35)';
      fillRR(c, x - 5, y - 1, 10, 9, 2, 'rgba(255,255,255,.35)');
      c.strokeStyle = 'rgba(255,255,255,.35)'; c.lineWidth = 2;
      c.beginPath(); c.arc(x, y - 1, 3.6, Math.PI, 0); c.stroke();
      continue;
    }

    // دایره‌ی اصلی
    const grad = c.createLinearGradient(x, y - r, x, y + r);
    if (nd.boss) { grad.addColorStop(0, '#ffe9a8'); grad.addColorStop(1, '#ffb648'); }
    else { grad.addColorStop(0, WW.lip); grad.addColorStop(1, WW.ground[1]); }
    c.fillStyle = grad;
    c.beginPath(); c.arc(x, y, r, 0, TAU); c.fill();
    c.strokeStyle = nd.boss ? '#fff3cf' : 'rgba(255,255,255,.55)';
    c.lineWidth = isSel ? 3.5 : 2;
    c.beginPath(); c.arc(x, y, r, 0, TAU); c.stroke();

    // حلقه‌ی انتخاب
    if (isSel) {
      c.save();
      c.strokeStyle = '#8cff9b'; c.lineWidth = 2.5;
      c.globalAlpha = 0.5 + Math.sin(MAP.t * 5) * 0.3;
      c.beginPath(); c.arc(x, y, r + 7 + Math.sin(MAP.t * 3) * 1.5, 0, TAU); c.stroke();
      c.restore();
    }

    // شماره
    c.save();
    c.font = (nd.boss ? '900 ' : '800 ') + (nd.boss ? 13 : 11) + 'px Vazirmatn, sans-serif';
    c.textAlign = 'center'; c.textBaseline = 'middle';
    c.fillStyle = nd.boss ? '#2a1206' : '#10060f';
    c.fillText(faNum(nd.n), x, y + 1);
    c.restore();

    // تاجِ رئیس
    if (nd.boss) {
      c.save();
      c.translate(x, y - r - 7);
      c.fillStyle = '#ffd45e';
      c.beginPath();
      c.moveTo(-8, 3); c.lineTo(-8, -4); c.lineTo(-4, 0); c.lineTo(0, -6);
      c.lineTo(4, 0); c.lineTo(8, -4); c.lineTo(8, 3);
      c.closePath(); c.fill();
      c.strokeStyle = '#8c5a12'; c.lineWidth = 1; c.stroke();
      c.restore();
    }
  }

  // ---- روحِ بازیکن ----
  const tx = MAP.tokX - camX;
  const ty = MAP.tokY - 52 + Math.sin(MAP.bob * 3.2) * 2.5;   // بالای گره، نه رویش
  drawPlayerToken(c, tx, ty, MAP.walkTo >= 0);

  // ---- کارتِ اطلاعاتِ گرهِ انتخابی ----
  const info = LEVELS[selNode.n];
  const nm = info ? info.name : 'سالن ' + selNode.n;
  const wn = worldNameOf(selNode.n);
  c.save();
  c.font = '900 19px Vazirmatn, sans-serif';
  const w1 = c.measureText(nm).width;
  c.font = '700 13px Vazirmatn, sans-serif';
  const w2 = c.measureText(wn + ' — سالن ' + faNum(selNode.n) + ' از ' + faNum(FINAL_LEVEL)).width;
  const cw = Math.max(w1, w2) + 40;
  const cx = VW / 2, cy = 34;
  fillRR(c, cx - cw / 2, cy, cw, 58, 12, 'rgba(8,4,14,.82)');
  c.strokeStyle = selNode.boss ? '#ffd45e' : WORLDS[selNode.world].lip;
  c.lineWidth = 2;
  rr(c, cx - cw / 2, cy, cw, 58, 12); c.stroke();
  c.textAlign = 'center'; c.textBaseline = 'top';
  c.font = '900 19px Vazirmatn, sans-serif';
  c.fillStyle = selNode.boss ? '#ffd45e' : '#fff';
  c.fillText(nm, cx, cy + 8);
  c.font = '700 13px Vazirmatn, sans-serif';
  c.fillStyle = '#c9b8e4';
  c.fillText(wn + ' — سالن ' + faNum(selNode.n) + ' از ' + faNum(FINAL_LEVEL), cx, cy + 34);
  c.restore();

  // ---- راهنمای کلیدها ----
  if (MAP.hintT > 0) {
    c.save();
    c.globalAlpha = Math.min(1, MAP.hintT / 0.6);
    const txt = TOUCH.on ? 'بکش یا روی گره بزن — دکمه‌ی ضربه برای ورود' : '← → انتخاب   ·   Enter ورود   ·   Esc بازگشت';
    c.font = '700 14px Vazirmatn, sans-serif';
    c.textAlign = 'center'; c.textBaseline = 'middle';
    const tw = c.measureText(txt).width;
    fillRR(c, VW / 2 - tw / 2 - 16, VH - 54, tw + 32, 30, 15, 'rgba(8,4,14,.78)');
    c.fillStyle = '#ffe9a8';
    c.fillText(txt, VW / 2, VH - 38);
    c.restore();
  }

  // ---- فلشِ «بازهم هست» در لبه‌ها ----
  const lastX = mapNodeX(FINAL_LEVEL - 1) - camX;
  if (lastX > VW + 20) drawMapArrow(c, VW - 22, MAP_BASE_Y, 1);
  if (mapNodeX(0) - camX < -20) drawMapArrow(c, 22, MAP_BASE_Y, -1);

  // ---- محوشدن هنگام ورود ----
  if (MAP.enterT > 0) {
    c.fillStyle = 'rgba(0,0,0,' + Math.min(1, MAP.enterT / 0.18) + ')';
    c.fillRect(0, 0, VW, VH);
  }
}

function drawMapArrow(c, x, y, dir) {
  c.save();
  c.translate(x, y + Math.sin(MAP.t * 4) * 3);
  c.scale(dir, 1);
  c.fillStyle = 'rgba(255,233,168,.75)';
  c.beginPath(); c.moveTo(-6, -11); c.lineTo(7, 0); c.lineTo(-6, 11); c.closePath(); c.fill();
  c.restore();
}

/* روحِ کوچکِ منوچهر روی نقشه */
function drawPlayerToken(c, x, y, walking) {
  c.save();
  c.translate(x, y);
  c.globalAlpha = 0.3; ell(c, 0, 27, 13, 4, '#000'); c.globalAlpha = 1;
  const sway = walking ? Math.sin(MAP.bob * 14) * 3 : 0;
  c.rotate(sway * 0.012);
  // بدن
  fillRR(c, -10, -2, 20, 26, 9, '#cfe6f5');
  c.beginPath();
  c.moveTo(-10, 20);
  for (let i = 0; i <= 4; i++) {
    const px = -10 + i * 5;
    c.quadraticCurveTo(px + 2.5, 24 + Math.sin(MAP.bob * 5 + i) * 2.5, px + 5, 20);
  }
  c.lineTo(10, 14); c.lineTo(-10, 14); c.closePath();
  c.fillStyle = '#cfe6f5'; c.fill();
  // سر
  ell(c, 0, -8, 11, 11, '#e6f3fb');
  // هاله
  c.strokeStyle = '#ffd45e'; c.lineWidth = 2.5;
  c.beginPath(); c.ellipse(0, -21, 9, 3.2, 0, 0, TAU); c.stroke();
  // چشم‌ها
  c.fillStyle = '#28405a';
  c.beginPath(); c.arc(-3.6, -8, 1.8, 0, TAU); c.fill();
  c.beginPath(); c.arc(3.6, -8, 1.8, 0, TAU); c.fill();
  c.restore();
}

/* حرکتِ هوشنگ هنگام احضار */
function updateAngelSweep(dt) {
  if (!ANGEL_SWEEP) return;
  ANGEL_SWEEP.t += dt;
  ANGEL_SWEEP.x += 940 * dt;
  const ay = (PLAYER ? PLAYER.y : 300) - 30;
  spawnParts(2, ANGEL_SWEEP.x, ay + 20, { col: ['#ffd45e', '#ffffff', '#8cff9b'], speed: 110, life: 0.5, size: 5 });
  for (const e of ENEMIES) {
    if (e.dead || e.sweptBy === ANGEL_SWEEP) continue;
    if (Math.abs((e.x + e.w / 2) - ANGEL_SWEEP.x) < 60 && Math.abs((e.y + e.h / 2) - (ay + 30)) < 150) {
      e.sweptBy = ANGEL_SWEEP;
      damageEnemy(e, 60 * RUN.stats.dmgMul, sign(e.x - ANGEL_SWEEP.x) || 1, { crit: true });
    }
  }
  if (ANGEL_SWEEP.x > Cam.x + VW + 140) ANGEL_SWEEP = null;
}
function drawAngelSweep(c) {
  if (!ANGEL_SWEEP) return;
  const ay = (PLAYER ? PLAYER.y : 300) - 10;
  c.save();
  glow(c, ANGEL_SWEEP.x, ay + 20, 90, 'rgba(255,230,160,.9)', 0.7);
  c.translate(ANGEL_SWEEP.x, ay + 20);
  const fl = Math.sin(timeNow * 24) * 6;
  c.fillStyle = 'rgba(255,255,255,.95)';
  c.beginPath(); c.ellipse(-22, -6 + fl, 20, 11, -0.5, 0, TAU); c.fill();
  c.beginPath(); c.ellipse(-22, 10 - fl, 20, 11, 0.5, 0, TAU); c.fill();
  ell(c, 0, 0, 15, 19, '#dff3ff');
  ell(c, 0, -22, 12, 12, '#f4e2c4');
  c.strokeStyle = '#ffd45e'; c.lineWidth = 3;
  c.beginPath(); c.ellipse(0, -38, 11, 3.6, 0, 0, TAU); c.stroke();
  c.fillStyle = '#20384d';
  c.beginPath(); c.arc(-4, -23, 1.9, 0, TAU); c.fill();
  c.beginPath(); c.arc(4, -23, 1.9, 0, TAU); c.fill();
  c.restore();
}

function availablePerks() {
  return PERKS.filter(p => {
    const count = RUN.perks.filter(x => x.id === p.id).length;
    if (p.max && count >= p.max) return false;
    if (['energy', 'shield', 'magnet', 'boom', 'tea'].includes(p.id) && count >= 1) return false;
    return true;
  });
}
/* سقف و کفِ آمار. با ۲۲ پاداشِ رئیس + نعمت‌ها + فروشگاه، ضریب‌ها روی هم جمع می‌شوند؛
   بدون این، آسیبِ دریافتی عملاً صفر و سرعت آن‌قدر زیاد می‌شود که از دیوار رد شوی. */
function clampStats(st) {
  if (!st) return;
  st.maxHp = clamp(Math.round(st.maxHp), 20, 4000);
  st.dmgMul = clamp(st.dmgMul, 0.2, 40);
  st.speedMul = clamp(st.speedMul, 0.4, 2.8);      // ۳۲۰×۲٫۸ = ۸۹۶px/s، کمتر از عرضِ بازیکن در هر گام
  st.atkSpeedMul = clamp(st.atkSpeedMul, 0.4, 3);
  st.dashCdMul = clamp(st.dashCdMul, 0.3, 3);
  st.dmgTakenMul = clamp(st.dmgTakenMul, 0.22, 3); // هیچ‌وقت شکست‌ناپذیر نشو
  st.extraJumps = clamp(Math.round(st.extraJumps), 0, 4);
}

function applyPerk(p) {
  RUN.perks.push(p);
  p.apply(RUN.stats);
  clampStats(RUN.stats);
  if (PLAYER) {
    PLAYER.maxHp = RUN.stats.maxHp;
    if (p.id === 'heart') PLAYER.hp = PLAYER.maxHp;
  }
  renderPerks();
}

/* ---------------- ذخیره و بارگذاری ---------------- */
const SAVE_V = 2;

/* جانی که با آن وارد مرحله‌ی بعد می‌شوی */
/* بعد از هر باخت، از هر راهی که برگردی، با جانِ پر شروع می‌کنی:
   «تلاش دوباره»، منوی مکث، منوی اصلی ← ادامه، یا حتی بستن مرورگر و برگشتن فردا. */
let diedSinceStart = false;

function carryHp(prevHp, maxHp) {
  return clamp(Math.round(prevHp + maxHp * 0.25 + (RUN.stats.tea ? 25 : 0)), 1, maxHp);
}

function buildSaveData(levelOverride, hpOverride) {
  if (!RUN) return null;
  const lvl = levelOverride === undefined ? RUN.level : levelOverride;
  if (lvl < 1) return null;                  // مرحله‌ی آموزش ذخیره نمی‌شود
  const hp = hpOverride === undefined ? (PLAYER ? PLAYER.hp : RUN.stats.maxHp) : hpOverride;
  return {
    v: SAVE_V, level: lvl, hp: Math.max(1, Math.round(hp)),
    score: RUN.score, coins: RUN.coins, kills: RUN.kills, deaths: RUN.deaths,
    bestCombo: RUN.bestCombo, totalTime: Math.round(RUN.totalTime),
    damageTaken: RUN.damageTaken,
    stats: RUN.stats,
    perks: RUN.perks.map(x => ({ id: x.id, icon: x.icon, name: x.name, desc: x.desc })),
    gems: RUN.gems || 0, loot: RUN.loot || {},
    powers: RUN.powers || [], power: RUN.power || null,
    shopBuys: RUN.shopBuys || {}, powerTune: RUN.powerTune || {}, townVisits: RUN.townVisits || 0,
    at: Date.now()
  };
}

function saveGame(levelOverride, hpOverride) {
  if (RUN && RUN.practice) return null;      // حالتِ تمرین هرگز سیوِ اصلی را دست نمی‌زند
  const d = buildSaveData(levelOverride, hpOverride);
  if (!d) return null;
  Store.set('save', d);
  RUN.savedAt = d.level;
  return d;
}

/* ---------------- فایل سیو (.json) ---------------- */
const SAVE_MAGIC = 'behesht-zaheran-save';
let lastFileLevel = 0;        // برای هر مرحله فقط یک فایل ساخته می‌شود
let lastFileName = '';

function fileSaveOn() { return Store.get('filesave', true) !== false; }

function saveFileName(lvl) {
  return 'behesht-save-level-' + String(lvl).padStart(2, '0') + '.json';
}

function levelNameOf(lvl) {
  return LEVELS[Math.min(lvl, LEVELS.length - 1)].name;
}

/* ساخت و دانلودِ فایل سیو. خروجی: نام فایل یا null */
function exportSaveFile(data) {
  const d = data || getSave();
  if (!d) { toast('هنوز چیزی برای ذخیره نیست.', 2.5); return null; }
  const name = saveFileName(d.level);
  const payload = Object.assign({ magic: SAVE_MAGIC, game: 'بهشت، ظاهراً!' }, d, {
    levelName: levelNameOf(d.level),
    savedAtText: new Date().toLocaleString('fa-IR')
  });
  try {
    const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = name; a.rel = 'noopener'; a.style.display = 'none';
    document.body.appendChild(a);
    a.click();
    setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 3000);
    lastFileLevel = Math.max(lastFileLevel, d.level);
    lastFileName = name;
    return name;
  } catch (e) {
    toast('مرورگر اجازه‌ی ساخت فایل نداد.', 3);
    return null;
  }
}

/* بعد از هر مرحله، خودکار یک فایل بساز (یک‌بار برای هر مرحله) */
function autoExportSave(data) {
  if (!fileSaveOn()) return;
  const d = data || getSave();
  if (!d || !d.level || d.level < 1 || d.level <= lastFileLevel) return;
  const name = exportSaveFile(d);
  if (!name) return;
  // در قاب سندباکس‌شده دانلود معمولاً مسدود است
  if (!Store.ok) toast('💾 فایل سیو درخواست شد (اگر مرورگر اجازه بدهد): ' + name, 3.5);
  else toast('💾 فایل سیو ساخته شد: ' + name, 3.5);
}

/* خواندن فایل سیوِ انتخاب‌شده و ادامه‌ی بازی از روی آن */
function readSaveFile(file) {
  if (!file) return;
  const fr = new FileReader();
  fr.onerror = () => toast('نشد فایل را بخوانم.', 3);
  fr.onload = () => {
    let d = null;
    try { d = JSON.parse(String(fr.result)); } catch (e) { d = null; }
    if (!d || typeof d !== 'object' || !d.level || d.v !== SAVE_V || d.level < 1 || d.level > FINAL_LEVEL) {
      toast('این فایل، سیوِ «بهشت، ظاهراً!» نیست.', 3.5);
      return;
    }
    const clean = {
      v: SAVE_V, level: d.level, hp: d.hp, score: d.score || 0, coins: d.coins || 0,
      kills: d.kills || 0, deaths: d.deaths || 0, bestCombo: d.bestCombo || 0,
      totalTime: d.totalTime || 0, damageTaken: d.damageTaken || 0,
      stats: d.stats || {}, perks: d.perks || [],
      gems: d.gems || 0, loot: d.loot || {},
      powers: d.powers || [], power: d.power || null,
      shopBuys: d.shopBuys || {}, powerTune: d.powerTune || {}, townVisits: d.townVisits || 0,
      at: d.at || Date.now()
    };
    Store.set('save', clean);
    lastFileLevel = clean.level;
    loadGame();
    toast('📂 فایل سیو خوانده شد — ' + levelNameOf(clean.level), 3.5);
  };
  fr.readAsText(file);
}

function pickSaveFile() {
  const inp = document.createElement('input');
  inp.type = 'file';
  inp.accept = '.json,application/json';
  inp.style.display = 'none';
  inp.addEventListener('change', () => {
    const f = inp.files && inp.files[0];
    inp.remove();
    if (f) readSaveFile(f);
  });
  document.body.appendChild(inp);
  inp.click();
}

/* کشیدن و رها کردن فایل سیو روی صفحه */
function setupSaveDrop() {
  window.addEventListener('dragover', e => { e.preventDefault(); }, false);
  window.addEventListener('drop', e => {
    e.preventDefault();
    const f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
    if (f) readSaveFile(f);
  }, false);
}

function getSave() {
  const d = Store.get('save', null);
  if (!d || d.v !== SAVE_V || !d.level || d.level < 1 || d.level > FINAL_LEVEL) return null;
  return d;
}
function clearSave() { Store.set('save', null); }

function loadGame() {
  const d = getSave();
  if (!d) { showMenu(); return; }
  newRun();
  RUN.score = d.score || 0; RUN.coins = d.coins || 0; RUN.kills = d.kills || 0;
  RUN.deaths = d.deaths || 0; RUN.bestCombo = d.bestCombo || 0;
  RUN.totalTime = d.totalTime || 0; RUN.damageTaken = d.damageTaken || 0;
  RUN.gems = d.gems || 0; RUN.loot = d.loot || {};
  RUN.powers = d.powers || []; RUN.power = d.power || null;
  RUN.shopBuys = d.shopBuys || {}; RUN.powerTune = d.powerTune || {}; RUN.townVisits = d.townVisits || 0;
  Object.assign(RUN.stats, d.stats || {});
  RUN.perks = (d.perks || []).map(x => ({ id: x.id, icon: x.icon, name: x.name, desc: x.desc, apply() { } }));
  renderPerks();
  hideOverlay();
  PLAYER = null;                               // تا جانِ ذخیره‌شده اعمال شود
  lastFileLevel = d.level;                     // دوباره فایل همین مرحله ساخته نشود
  const afterLoss = diedSinceStart;            // startLevel پرچم را پاک می‌کند
  startLevel(d.level, false, true);
  if (PLAYER) PLAYER.hp = afterLoss ? PLAYER.maxHp : clamp(d.hp || PLAYER.maxHp, 1, PLAYER.maxHp);
  toast('ادامه از ' + LEVELS[Math.min(d.level, LEVELS.length - 1)].name, 3);
}

/* ---------------- شروع و جریان مراحل ---------------- */
function startRun() {
  newRun();
  clearSave();
  lastFileLevel = 0;
  renderPerks();
  hideOverlay();
  startLevel(0, true);
}

/* ============================================================
   باز شدنِ مرحله‌ها برای منوی انتخابِ مرحله
   ============================================================ */
function maxLevelReached() {
  let m = Store.get('maxlevel', 0);
  const sv = getSave();                       // سیوِ فعلی هم حساب می‌شود
  if (sv && sv.level > m) m = sv.level;
  return clamp(m, 0, FINAL_LEVEL);
}
function noteLevelReached(n) {
  if (!(n > 0)) return;
  if (n > Store.get('maxlevel', 0)) Store.set('maxlevel', Math.min(n, FINAL_LEVEL));
}

/* آمارِ بازیکن را به چیزی که طبیعتاً تا این سالن داشت برسان:
   همه‌ی پاداش‌های رئیسِ قبلی + معادلِ تقریبیِ نعمت‌ها و خریدهای بین راه. */
function applyProgressFor(level) {
  const st = RUN.stats;
  for (let k = 3; k < level; k += 3) {
    const r = BOSS_REWARDS[k];
    if (r) r.apply(st);
  }
  // جای نعمت‌هایی که در مسیر طبیعی گرفته می‌شد
  let normal = 0;
  for (let k = 1; k < level; k++) if (!isBossLevel(k)) normal++;
  st.maxHp += Math.round(normal * 6);
  st.dmgMul += normal * 0.035;
  st.speedMul += normal * 0.012;
  st.atkSpeedMul += normal * 0.012;
  st.dashCdMul *= Math.pow(0.994, normal);
  clampStats(st);
}

/* شروعِ یک سالن از منو — حالتِ تمرین: سیوِ اصلی دست نمی‌خورد */
function startLevelFromMenu(n) {
  n = clamp(Math.round(n), 0, FINAL_LEVEL);
  newRun();
  RUN.practice = true;
  RUN.level = n;
  applyProgressFor(n);
  diedSinceStart = false;
  renderPerks();
  hideOverlay();
  fadeTo(() => startLevel(n, n === 0, false, true));
}

function startLevel(n, intro = false, loading = false, fresh = false) {
  noteLevelReached(n);
  const afterLoss = diedSinceStart;
  if (diedSinceStart) { fresh = true; diedSinceStart = false; }   // باختیم ⇒ جانِ پر
  const prevHp = PLAYER ? PLAYER.hp : null;
  RUN.level = n;
  RUN.levelTime = 0;
  RUN.levelDamage = 0;
  RUN.levelKills = 0;
  RUN.combo = 0; RUN.comboT = 0;
  PROJ.length = 0; PICKUPS.length = 0; parts.length = 0; texts.length = 0; EMBERS.length = 0;
  ENEMIES.length = 0; BOSS = null; hitstop = 0;

  const isBoss = n > 0 && n % 3 === 0;
  L = n === 0 ? buildTutorial() : (isBoss ? buildBossArena(n) : buildLevel(n));
  Sound.mode = n === 0 ? 'heaven' : 'hell';
  // بستن هر گفت‌وگوی بازمانده
  Dlg.active = false; Dlg.lines = []; Dlg.done = null;
  UI.dlg.classList.remove('show');
  UI.tutorialTip.classList.remove('show'); tipT = 0;
  UI.toast.classList.remove('show'); toastT = 0;
  const info = LEVELS[Math.min(n, LEVELS.length - 1)];
  UI.levelName.textContent = info.name;

  PLAYER = makePlayer(L.spawn.x, L.spawn.y);
  PLAYER.maxHp = RUN.stats.maxHp;
  // carryHp فقط برای «رفتن به سالن بعد» است. شروعِ دوباره‌ی همین سالن —
  // چه بعد از مرگ (hp = 0) چه از منوی مکث — همیشه با جانِ پر شروع می‌شود.
  if (prevHp !== null && !intro && !loading && !fresh) PLAYER.hp = carryHp(prevHp, PLAYER.maxHp);
  else PLAYER.hp = PLAYER.maxHp;
  // بعد از باخت، پرشدنِ جان را به چشم بیاور تا کسی شک نکند
  UI.hpFill.classList.remove('refill');
  if (afterLoss) {
    updateHUD(PLAYER);
    void UI.hpFill.offsetWidth;                 // ری‌استارتِ انیمیشن
    UI.hpFill.classList.add('refill');
    toast('جانت پر شد — برو دوباره', 2.4);
    floatText(PLAYER.x + PLAYER.w / 2, PLAYER.y - 14, 'جانِ پر!', '#8cff9b', 22);
  }

  spawnEnemiesFor(L);
  if (n === 0) {
    ENEMIES.push(makeEnemy('dummy', 1740, GROUND_Y, 0));
    ENEMIES.push(makeEnemy('dummy', 1880, GROUND_Y, 0));
  }
  if (isBoss) {
    BOSS = makeBossFor(n);
    ENEMIES.push(BOSS);
  }

  ANGEL = { x: L.spawn.x + 110, y: GROUND_Y - 110, t: 0, visible: n === 0 || isBoss, mood: 'happy' };
  Cam.reset(clamp(L.spawn.x - VW / 2, 0, Math.max(0, L.w - VW)), 0);
  levelTitleT = 2.5;
  // ورود به یک بخشِ تازه‌ی بهشت: اسمش را اعلام کن تا تغییرِ فضا حس شود
  worldBannerT = (n > 0 && isWorldStart(n)) ? 3.4 : 0;
  worldBannerName = worldBannerT ? worldNameOf(n) : '';
  renderPerks();

  if (!loading && !(RUN && RUN.practice)) {
    const snap = saveGame(n, PLAYER.hp);
    // کمی تأخیر تا پیام فایل روی کارت عنوانِ سالن نیفتد (داده‌ی همان لحظه ذخیره می‌شود)
    const tok = RUN.id;
    if (snap) setTimeout(() => { if (RUN && RUN.id === tok) autoExportSave(snap); }, 2600);
  }

  if (intro) {
    GAMESTATE = 'story';
    Dlg.start(STORY.intro, () => { GAMESTATE = 'play'; showTip('با <b>← →</b> یا <b>A D</b> راه برو', 4); });
  } else if (isBoss) {
    GAMESTATE = 'story';
    const key = 'boss' + n + 'Intro';
    Dlg.start(STORY[key] || STORY.boss3Intro, () => { GAMESTATE = 'play'; ANGEL.visible = false; toast('نبرد با رئیس آغاز شد!'); Sound.boss(); });
  } else {
    GAMESTATE = 'play';
  }
}

  { id: 'jump', x: 420, text: '<b>Space</b> = پرش — در هوا دوباره بزن = <b>پرش دوگانه</b>' },

];

function updateTutorial() {
  if (RUN.level !== 0) return;
  for (const t of TUT) {
    if (!RUN.tut[t.id] && PLAYER.x > t.x) { RUN.tut[t.id] = true; showTip(t.text, 5); Sound.blip(880); }
  }
}

function completeLevel() {
  if (GAMESTATE !== 'play') return;
  GAMESTATE = 'levelend';
  RUN.totalTime += RUN.levelTime;
  Sound.win();
  if (RUN.level === 0) {
    GAMESTATE = 'story';
    ANGEL.visible = true;
    Dlg.start(STORY.tutorialEnd, () => { fadeTo(() => startLevel(1)); });
    return;

const BOSS_LOOT_RUSH = 3.6;        // مهلتِ پایه برای جمع‌کردنِ خزانه‌ی رئیس
const BOSS_LOOT_RUSH_MAX = 12;     // سقفِ مطلق اگر آیتمی گیر کرده باشد

function onBossDefeated(b) {
  const token = RUN.id;
  /* رئیس که می‌افتد، خزانه‌اش پخش می‌شود. قبلاً دیالوگ بعد از ۱٫۵ ثانیه
     می‌آمد و بازیکن را وسطِ جمع‌کردن قفل می‌کرد. حالا یک پنجره‌ی واقعی
     می‌دهیم و در همان مدت همه‌ی آیتم‌ها به سمتش کشیده می‌شوند. */
  RUN.lootRushT = BOSS_LOOT_RUSH;
  levelTitleT = 0;   // کارتِ عنوان کنار برود تا نوارِ خزانه خوانا بماند
  /* دیالوگ تا وقتی چیزی روی زمین مانده شروع نمی‌شود — پس هرچقدر هم دیر
     بجنبی، غنیمت از دستت نمی‌رود. سقفِ مطلق تا گیر نکنیم. */
  const t0 = Date.now();
  const c0 = RUN.coins, g0 = RUN.gems || 0;
  const tryStart = () => {
    if (!RUN || RUN.id !== token) return;
    const waited = (Date.now() - t0) / 1000;
    if (PICKUPS.length > 0 && waited < BOSS_LOOT_RUSH_MAX) {
      RUN.lootRushT = Math.max(RUN.lootRushT, 0.9);
      setTimeout(tryStart, 400);
      return;
    }
    RUN.lootRushT = 0;
    /* تورِ ایمنی: هرچه از خزانه مانده همین‌جا — پیش از قفل‌شدنِ دیالوگ —
       به حساب بازیکن می‌رود و با تُست نشانش می‌دهیم که گرفته شده. */
    const swept = collectRemainingPickups();
    const gained = [];
    if (RUN.coins - c0 > 0) gained.push(faNum(RUN.coins - c0) + ' سکه');
    if ((RUN.gems || 0) - g0 > 0) gained.push(faNum((RUN.gems || 0) - g0) + ' قیراط');
    if (gained.length) toast('خزانه‌ی رئیس: ' + gained.join(' و ') + ' گرفتی', 2.6);
    const n = RUN.level;
    GAMESTATE = 'story';
    ANGEL.visible = true;
    ANGEL.x = PLAYER.x + 120; ANGEL.y = GROUND_Y - 120;
    if (n === FINAL_LEVEL) {
      Dlg.start(STORY.ending, () => showVictory());
    } else {
      Dlg.start(STORY['boss' + n + 'Win'] || [], () => showReward(n));
    }
  };
  setTimeout(tryStart, BOSS_LOOT_RUSH * 1000);
}

function lootCount() {
  return Object.values(RUN.loot || {}).reduce((a, b) => a + b, 0);
}

/* هرچه از خزانه‌ی رئیس روی زمین مانده، خودکار برداشته می‌شود */
function collectRemainingPickups() {
  let gems = 0, coins = 0, loots = 0;
  for (const k of PICKUPS) {
    if (k.kind === 'gem') { const g = GEMS[k.data] || GEMS.shard; gems += g.karat; }
    else if (k.kind === 'coin') coins += coinValue();
    else if (k.kind === 'loot') { RUN.loot[k.data] = (RUN.loot[k.data] || 0) + 1; loots++; }
  }
  PICKUPS.length = 0;
  if (gems) { RUN.gems = (RUN.gems || 0) + gems; RUN.score += gems * 30; }
  if (coins) { RUN.coins += coins; RUN.score += 25 * Math.round(coins / Math.max(1, coinValue())); }
  const bits = [];
  if (gems) bits.push(faNum(gems) + ' قیراط');
  if (coins) bits.push(faNum(coins) + ' سکه');
  if (loots) bits.push(faNum(loots) + ' غنیمت');
  return bits.length ? bits.join(' · ') : '';
}

function showReward(n) {

  PLAYER.maxHp = RUN.stats.maxHp;

  const maxL = maxLevelReached();
  const done = Store.get('finished', false);
  const cur = (RUN && RUN.level) || 0;

  const blocks = WORLD_PLAN.map(wp => {
    const W = WORLDS[wp.id];
    let open = 0;
    const chips = [];
    for (let n = wp.from; n <= wp.to; n++) {
      const boss = isBossLevel(n);
      // همه‌چیز تا یک سالن جلوترِ رکورد باز است؛ بعد از تمامِ بازی همه باز می‌شوند
      const unlocked = done || n <= maxL + 1;

      const here = n === cur ? ' here' : '';
