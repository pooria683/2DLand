/* کدام سالن در کدام دنیاست. هر دنیا سه قوسِ رئیس (۹ سالن) را می‌گیرد،
   مگر دو تای آخر که کوتاه‌ترند تا پایان‌بندی فشرده بماند. */
const WORLD_PLAN = [
  { id: 'hell',    from: 1,  to: 9 },
  { id: 'archive', from: 10, to: 18 },
  { id: 'frost',   from: 19, to: 27 },
  { id: 'server',  from: 28, to: 36 },
  { id: 'sewer',   from: 37, to: 45 },
  { id: 'kitchen', from: 46, to: 51 },
  { id: 'skyline', from: 52, to: 60 },
  { id: 'gold',    from: 61, to: 69 }
];

function worldIdOf(index) {
  for (const w of WORLD_PLAN) if (index >= w.from && index <= w.to) return w.id;
  return 'gold';
}
function worldOf(theme) { return WORLDS[theme] || WORLDS.hell; }
/* آیا این سالن اولین سالنِ یک دنیای تازه است؟ (برای پیامِ «به ... خوش آمدی») */
function isWorldStart(index) { return WORLD_PLAN.some(w => w.from === index); }
function worldNameOf(index) { return worldOf(worldIdOf(index)).name; }

function drawWorldBG(c, W) {
  c.fillStyle = vGrad(c, 0, VH, W.sky);
  c.fillRect(0, 0, VW, VH);

  // قرصِ آسمان: در جهنم یک چشمِ سرخ، در سردخانه ماهِ یخی، در مرکز داده چراغِ وضعیت
  const O = W.orb;
  const mx = VW * O.x - Cam.x * 0.05, my = O.y;
  glow(c, mx, my, O.r * 3.5, O.glow, 0.85);
  circle(c, mx, my, O.r, O.out);
  circle(c, mx + O.r * 0.19, my + O.r * 0.08, O.r * 0.85, O.in);
  circle(c, mx + O.r * 0.08, my, O.r * 0.3, O.pupil);

  // دو لایه کوه/سازه‌ی دوردست
  worldRidge(c, 0.18, 300, W.ridge[0], 180, 420);
  worldRidge(c, 0.36, 350, W.ridge[1], 130, 330);

  // سیلوئتِ میانی + تابلوهای اداری
  const off = -Cam.x * 0.55;
  for (let i = 0; i < 24; i++) {
    const x = i * 420 + off;
    if (x < -260 || x > VW + 260) continue;
    drawWorldProp(c, W, x, i);
    if (i % 3 === 1) {
      const sx = x + 120, sy = 215 + Math.sin(timeNow * 1.3 + i) * 5;
      const sg = W.signs, sc = W.signCol;
      c.save();
      c.translate(sx, sy); c.rotate(Math.sin(timeNow * 0.8 + i) * 0.05);
      fillRR(c, -62, -20, 124, 40, 6, sc[0]);
      c.strokeStyle = sc[1]; c.lineWidth = 3; rr(c, -62, -20, 124, 40, 6); c.stroke();
      faText(c, sg[Math.floor(i / 3) % sg.length], 0, 1, 15, sc[2], 'center', 700);
      c.restore();
    }
  }

  // مهِ پایینِ صحنه (رنگش از دنیا می‌آید)
  const lg = c.createLinearGradient(0, VH - 120, 0, VH);
  lg.addColorStop(0, 'rgba(0,0,0,0)'); lg.addColorStop(1, W.haze);
  c.fillStyle = lg; c.fillRect(0, VH - 120, VW, 120);

  // ذرات معلق: جرقه، گرد و غبار، برف، یا بخار
  for (const e of EMBERS) {
    c.globalAlpha = e.a * 0.9;
    circle(c, e.x - Cam.x * 0.8, e.y, e.r, W.ember);
  }
  c.globalAlpha = 1;
}

/* سیلوئتِ میانیِ هر دنیا — همان چیزی که از دور می‌گوید «کجایی» */
function drawWorldProp(c, W, x, i) {
  const M = W.mid, t = timeNow;
  switch (W.decor) {

    case 'shelf': { // قفسه‌های بایگانی، پر از زونکن
      c.fillStyle = M.body; c.fillRect(x - 10, 160, 120, 290);
      c.fillStyle = M.cap; c.fillRect(x - 16, 152, 132, 14);
      for (let r = 0; r < 4; r++) {
        const sy = 180 + r * 66;
        c.fillStyle = M.cap; c.fillRect(x - 6, sy + 44, 112, 7);
        for (let b = 0; b < 7; b++) {
          const h = 30 + ((i * 7 + r * 13 + b * 5) % 14);
          c.fillStyle = b % 3 === 0 ? M.line : 'rgba(0,0,0,.28)';
          c.fillRect(x + b * 15, sy + 44 - h, 11, h);
        }
      }
      break;
    }

    case 'ice': { // ستون‌های یخ و قندیل‌های آویزان
      c.fillStyle = M.body;
      c.beginPath();
      c.moveTo(x + 4, 450); c.lineTo(x + 16, 190); c.lineTo(x + 30, 160);
      c.lineTo(x + 46, 196); c.lineTo(x + 56, 450); c.closePath(); c.fill();
      c.fillStyle = M.line;
      c.beginPath(); c.moveTo(x + 20, 440); c.lineTo(x + 28, 186); c.lineTo(x + 34, 440); c.closePath(); c.fill();
      for (let k = 0; k < 4; k++) {
        const ix = x + 90 + k * 46, len = 30 + ((i * 11 + k * 17) % 46);
        c.fillStyle = M.cap;
        c.beginPath(); c.moveTo(ix, 150); c.lineTo(ix + 13, 150); c.lineTo(ix + 6, 150 + len); c.closePath(); c.fill();
      }
      c.fillStyle = M.cap; c.fillRect(x - 40, 142, 300, 10);
      break;
    }

    case 'rack': { // رَک سرور با ال‌ای‌دی‌های چشمک‌زن
      c.fillStyle = M.body; c.fillRect(x, 170, 96, 280);
      c.fillStyle = M.cap; c.fillRect(x - 6, 162, 108, 12);
      for (let u = 0; u < 9; u++) {
        const uy = 184 + u * 28;
        c.fillStyle = 'rgba(0,0,0,.35)'; c.fillRect(x + 7, uy, 82, 20);
        for (let d = 0; d < 5; d++) {
          const on = ((Math.floor(t * (2 + d)) + i * 3 + u * 5 + d) % 4) !== 0;
          c.globalAlpha = on ? 0.95 : 0.18;
          c.fillStyle = d === 4 ? '#ff7a6a' : M.line;
          c.fillRect(x + 13 + d * 13, uy + 7, 7, 6);
        }
        c.globalAlpha = 1;
      }
      c.strokeStyle = M.line; c.lineWidth = 2; c.globalAlpha = 0.5;
      c.beginPath(); c.moveTo(x + 48, 162); c.quadraticCurveTo(x + 150, 130 + Math.sin(t + i) * 6, x + 252, 168); c.stroke();
      c.globalAlpha = 1;
      break;
    }

    case 'pipe': { // لوله‌های فاضلاب با چکه
      c.fillStyle = M.body; c.fillRect(x - 60, 176, 360, 40);
      c.fillStyle = M.cap; c.fillRect(x - 60, 176, 360, 9);
      c.fillStyle = M.cap; c.fillRect(x + 30, 170, 26, 52); c.fillRect(x + 190, 170, 26, 52);
      c.fillStyle = M.body; c.fillRect(x + 110, 216, 34, 234);
      c.fillStyle = M.cap; c.fillRect(x + 104, 216, 46, 12);
      const dy = 230 + ((t * 120 + i * 90) % 180);
      c.globalAlpha = 0.7; circle(c, x + 43, dy, 4, M.line); c.globalAlpha = 1;
      c.strokeStyle = M.line; c.lineWidth = 2; c.globalAlpha = 0.35;
      c.beginPath(); c.arc(x + 43, 196, 16, 0, TAU); c.stroke(); c.globalAlpha = 1;
      break;
    }

    case 'stove': { // اجاق‌های غول‌پیکر و دیگ‌های در حال جوش
      c.fillStyle = M.body; c.fillRect(x, 250, 150, 200);
      c.fillStyle = M.cap; c.fillRect(x - 8, 240, 166, 16);
      c.fillStyle = 'rgba(0,0,0,.3)'; c.fillRect(x + 14, 290, 122, 70);
      c.globalAlpha = 0.55 + Math.sin(t * 3 + i) * 0.2;
      c.fillStyle = M.line; c.fillRect(x + 20, 296, 110, 58);
      c.globalAlpha = 1;
      c.fillStyle = M.cap;
      c.beginPath(); c.ellipse(x + 75, 240, 56, 16, 0, 0, TAU); c.fill();
      c.fillStyle = M.body;
      c.beginPath(); c.ellipse(x + 75, 236, 48, 12, 0, 0, TAU); c.fill();
      for (let k = 0; k < 3; k++) {
        const ph = (t * 0.5 + k * 0.33 + i * 0.17) % 1;
        c.globalAlpha = (1 - ph) * 0.3;
        circle(c, x + 55 + k * 22 + Math.sin(t * 2 + k) * 8, 232 - ph * 90, 12 + ph * 18, M.line);
      }
      c.globalAlpha = 1;
      break;
    }

    case 'cloud': { // بانک‌های ابر و برج‌های دور
      c.globalAlpha = 0.55;
      c.fillStyle = M.body;
      for (let k = 0; k < 5; k++) {
        const cx = x + k * 52, cy = 250 + Math.sin(i * 0.7 + k) * 22;
        c.beginPath(); c.ellipse(cx, cy, 52 - k * 4, 22 - k, 0, 0, TAU); c.fill();
      }
      c.globalAlpha = 0.85;
      c.fillStyle = M.cap; c.fillRect(x + 40, 170, 40, 170);
      c.fillRect(x + 150, 206, 28, 134);
      c.fillStyle = M.line; c.fillRect(x + 48, 178, 24, 5); c.fillRect(x + 48, 198, 24, 5);
      c.globalAlpha = 1;
      // ستاره‌های ثابت
      for (let k = 0; k < 4; k++) {
        const sxx = x + 20 + ((i * 37 + k * 91) % 380), syy = 60 + ((i * 53 + k * 29) % 90);
        c.globalAlpha = 0.5 + Math.sin(t * 2 + k + i) * 0.3;
        circle(c, sxx, syy, 2, M.line);
      }
      c.globalAlpha = 1;
      break;
    }

    case 'column': { // ستون‌های مرمرِ طبقه‌ی مدیریت
      c.fillStyle = M.body; c.fillRect(x, 150, 58, 300);
      c.fillStyle = M.cap; c.fillRect(x - 12, 140, 82, 18); c.fillRect(x - 10, 436, 78, 16);
      c.fillStyle = M.line; c.globalAlpha = 0.5;
      for (let k = 0; k < 4; k++) c.fillRect(x + 8 + k * 12, 160, 4, 270);
      c.globalAlpha = 1;
      c.fillStyle = M.cap;
      c.beginPath(); c.moveTo(x + 70, 140); c.lineTo(x + 240, 140); c.lineTo(x + 240, 158); c.lineTo(x + 70, 158); c.closePath(); c.fill();
      break;
    }

    default: { // 'pillar' — ستون و زنجیرِ سالن‌های اجاره‌ای
      c.fillStyle = M.body; c.fillRect(x, 150, 46, 300);
      c.fillStyle = M.cap; c.fillRect(x - 8, 142, 62, 16);
      c.strokeStyle = M.line; c.lineWidth = 3;
      c.beginPath(); c.moveTo(x + 23, 158); c.quadraticCurveTo(x + 120, 210 + Math.sin(t + i) * 8, x + 220, 170); c.stroke();
      break;
    }
  }
}

function worldRidge(c, par, baseY, col, amp, spacing) {
  const off = -Cam.x * par;
  c.fillStyle = col;
  c.beginPath(); c.moveTo(-50, VH);
  const start = Math.floor((-off) / spacing) - 2;
  for (let i = start; i < start + Math.ceil(VW / spacing) + 4; i++) {
    const x = i * spacing + off;
    c.lineTo(x, baseY - ((i * 53) % amp));
    c.lineTo(x + spacing / 2, baseY + 40 - ((i * 29) % (amp / 2)));
  }
  c.lineTo(VW + 60, VH); c.closePath(); c.fill();
}

/* ---------------- ترسیم زمین و خطرها ---------------- */
function drawTerrain(c) {
  const soft = L.theme === 'town' || L.theme === 'heaven';
  const W = soft ? null : worldOf(L.theme);
  for (const s of L.solids) {
    const top = s.y, h = Math.min(s.h, VH + 200 - s.y);
    if (!soft) {
      const g = c.createLinearGradient(0, top, 0, top + h);
      g.addColorStop(0, W.ground[0]); g.addColorStop(0.12, W.ground[1]); g.addColorStop(1, W.ground[2]);
      c.fillStyle = g; c.fillRect(s.x, top, s.w, h);
      c.fillStyle = W.lip; c.fillRect(s.x, top, s.w, 10);
      c.fillStyle = W.shine; c.fillRect(s.x, top, s.w, 3);
      c.fillStyle = 'rgba(0,0,0,.25)';
      for (let i = 0; i < s.w; i += 46) c.fillRect(s.x + i + 6, top + 18, 30, 6);
    } else {
      const g = c.createLinearGradient(0, top, 0, top + Math.min(h, 220));
      g.addColorStop(0, '#9ad986'); g.addColorStop(0.18, '#7ec96c');
      g.addColorStop(0.55, '#eaf7ff'); g.addColorStop(1, '#ffffff');
      c.fillStyle = g; c.fillRect(s.x, top, s.w, h);
      // پفِ ابری زیر چمن
      c.fillStyle = '#ffffff'; c.globalAlpha = 0.9;
      for (let i = -20; i < s.w + 20; i += 54) {
        c.beginPath(); c.ellipse(s.x + i + 27, top + 60 + Math.sin(i * 0.07) * 6, 40, 26, 0, 0, TAU); c.fill();
      }
      c.globalAlpha = 1;
      // چمن و گل
      c.fillStyle = '#6cc05c'; c.fillRect(s.x, top, s.w, 9);
      c.fillStyle = '#a7e58f';
      for (let i = 0; i < s.w; i += 26) {
        const gx = s.x + i + ((i * 7) % 13);
        c.beginPath(); c.moveTo(gx, top); c.quadraticCurveTo(gx + 3, top - 9, gx + 7, top); c.fill();
      }
      for (let i = 0; i < s.w; i += 150) {
        const fx = s.x + i + 40;
        c.strokeStyle = '#5fae52'; c.lineWidth = 2;
        c.beginPath(); c.moveTo(fx, top); c.lineTo(fx, top - 13); c.stroke();
        const col = ['#ffd95e', '#ff9ad5', '#fff'][(i / 150 | 0) % 3];
        for (let k = 0; k < 5; k++) {
          const a = k * TAU / 5;
          circle(c, fx + Math.cos(a) * 4, top - 16 + Math.sin(a) * 4, 2.6, col);
        }
        circle(c, fx, top - 16, 2.2, '#ffb347');
      }
    }
  }
  for (const p of L.oneways) {
    if (!soft) {
      fillRR(c, p.x, p.y, p.w, p.h, 5, W.oneway);
      c.fillStyle = W.onewayLip; c.fillRect(p.x + 4, p.y + 2, p.w - 8, 3);
    } else {
      fillRR(c, p.x, p.y, p.w, p.h, 8, '#ffffff');
      c.fillStyle = 'rgba(150,210,255,.6)'; c.fillRect(p.x + 6, p.y + p.h - 4, p.w - 12, 4);
    }
  }
  for (const m of L.movers) {
    fillRR(c, m.x, m.y, m.w, m.h, 6, soft ? '#ffffff' : W.mover);
    c.fillStyle = soft ? 'rgba(140,200,255,.7)' : W.moverLip;
    c.fillRect(m.x + 5, m.y + 3, m.w - 10, 3);
    glow(c, m.x + m.w / 2, m.y + m.h / 2, 40, soft ? 'rgba(180,230,255,.6)' : W.moverGlow, 0.35);
  }
}

function drawHazards(c) {
  const W = worldOf(L.theme);
  for (const hz of L.hazards) {
    if (hz.kind === 'lava') {
      const g = c.createLinearGradient(0, hz.y - 6, 0, hz.y + hz.h);
      g.addColorStop(0, W.lava[0]); g.addColorStop(0.25, W.lava[1]); g.addColorStop(1, W.lava[2]);
      c.fillStyle = g;
      c.beginPath();
      c.moveTo(hz.x, hz.y + 8);
      for (let i = 0; i <= hz.w; i += 12) {
        c.lineTo(hz.x + i, hz.y + 8 + Math.sin(timeNow * 3 + i * 0.1) * 5);
      }
      c.lineTo(hz.x + hz.w, hz.y + hz.h); c.lineTo(hz.x, hz.y + hz.h); c.closePath(); c.fill();
      glow(c, hz.x + hz.w / 2, hz.y + 6, Math.max(60, hz.w * 0.6), W.lavaGlow, 0.5);
    } else if (hz.kind === 'spike') {
      c.fillStyle = '#d8d2c6';
      for (let i = 0; i < hz.w; i += 18) {
        c.beginPath();
        c.moveTo(hz.x + i, hz.y + hz.h);
        c.lineTo(hz.x + i + 9, hz.y - 4);
        c.lineTo(hz.x + i + 18, hz.y + hz.h);
        c.closePath(); c.fill();
      }
      c.fillStyle = 'rgba(120,30,20,.6)'; c.fillRect(hz.x, hz.y + hz.h - 4, hz.w, 5);
    } else if (hz.kind === 'geyser') {
      const cxg = hz.x + hz.w / 2;
      const ph = (hz.t || 0) % 3;
      // دریچه‌ی فلزی روی زمین (همیشه دیده می‌شود تا بازیکن غافلگیر نشود)
      c.fillStyle = '#4a3026'; c.fillRect(hz.x - 4, hz.y - 7, hz.w + 8, 9);
      c.fillStyle = '#2a1812';
      for (let i = 2; i < hz.w; i += 11) c.fillRect(hz.x + i, hz.y - 5, 6, 5);
      if (!hz.active) {
        // هشدار: نیم‌ثانیه قبل از فوران شروع به تپیدن می‌کند
        const warn = clamp((ph - 1.15) / 0.65, 0, 1);
        if (warn > 0) {
          const puls = 0.35 + Math.sin(timeNow * 26) * 0.25;
          glow(c, cxg, hz.y - 4, 26 + warn * 26, W.lavaGlow, warn * puls);
          c.fillStyle = `rgba(255,190,90,${warn * 0.55})`;
          c.fillRect(hz.x + 3, hz.y - 6, hz.w - 6, 4);
        }
      } else {
        const hc = hz.hCur;
        // ستون شعله‌ی موج‌دار
        const g = c.createLinearGradient(0, hz.y, 0, hz.y - hc);
        g.addColorStop(0, W.lava[0]);
        g.addColorStop(0.35, W.lava[1]);
        g.addColorStop(1, 'rgba(0,0,0,0)');
        c.fillStyle = g;
        c.beginPath();
        const steps = 9;
        for (let i = 0; i <= steps; i++) {
          const yy = hz.y - (hc * i) / steps;
          const wob = Math.sin(timeNow * 14 + i * 0.8 + hz.x * 0.01) * (3 + i * 1.1);
          c.lineTo(hz.x + wob + i * 0.6, yy);
        }
        for (let i = steps; i >= 0; i--) {
          const yy = hz.y - (hc * i) / steps;
          const wob = Math.sin(timeNow * 14 + i * 0.8 + 2.1 + hz.x * 0.01) * (3 + i * 1.1);
          c.lineTo(hz.x + hz.w + wob - i * 0.6, yy);
        }
        c.closePath(); c.fill();
        // مغز روشن
        c.fillStyle = 'rgba(255,255,230,.5)';
        c.fillRect(cxg - 5, hz.y - hc * 0.8, 10, hc * 0.8);
        glow(c, cxg, hz.y - hc * 0.45, 70, W.lavaGlow, 0.6);
        if (Math.random() < 0.6) {
          spawnParts(1, cxg + rand(hz.w / 2, -hz.w / 2), hz.y - hc * 0.85,
            { col: [W.lava[0], W.lava[1]], speed: 150, life: 0.45, size: 4, angle: -Math.PI / 2, spread: 0.7 });
        }
      }
    }
  }
}

function drawDecor(c) {
  for (const d of L.decor) {
    const gy = d.gy === undefined ? GROUND_Y : d.gy;
    if (d.kind === 'tower') {
      // برجِ ابریِ پس‌زمینه‌ی شهر
      c.save(); c.translate(d.x, gy); c.scale(d.s, d.s); c.globalAlpha = 0.5;
      c.fillStyle = '#5d4680'; c.fillRect(-28, -170, 56, 170);
      c.beginPath(); c.moveTo(-34, -170); c.lineTo(0, -214); c.lineTo(34, -170); c.closePath(); c.fill();
      c.fillStyle = 'rgba(255,214,140,.65)';
      for (let i = 0; i < 4; i++) { c.fillRect(-18, -150 + i * 34, 14, 18); c.fillRect(6, -150 + i * 34, 14, 18); }
      c.globalAlpha = 1; c.restore();
    } else if (d.kind === 'lamp') {
      // فانوسِ خیابانی
      c.save(); c.translate(d.x, gy);
      c.fillStyle = '#4a3a63'; c.fillRect(-3, -96, 6, 96);
      c.fillStyle = '#6a5485'; c.fillRect(-9, -2, 18, 5);
      const f = 1 + Math.sin(timeNow * 3 + d.x) * 0.08;
      glow(c, 0, -104, 46 * f, 'rgba(255,214,130,.85)', 0.6);
      c.fillStyle = '#ffeab5';
      c.beginPath(); c.moveTo(-9, -98); c.lineTo(9, -98); c.lineTo(6, -114); c.lineTo(-6, -114); c.closePath(); c.fill();
      c.fillStyle = '#4a3a63';
      c.beginPath(); c.moveTo(-11, -114); c.lineTo(11, -114); c.lineTo(0, -124); c.closePath(); c.fill();
      c.restore();
    } else if (d.kind === 'bunting') {
      // ریسه‌ی پرچم کوچک
      c.save(); c.translate(d.x, gy);
      c.strokeStyle = 'rgba(255,230,180,.5)'; c.lineWidth = 1.6;
      c.beginPath(); c.moveTo(-74, 0); c.quadraticCurveTo(0, 16, 74, 0); c.stroke();
      const cols = ['#ffd45e', '#8cd9ff', '#ff9ab0', '#a8f0c0'];
      for (let i = 0; i < 5; i++) {
        const t = (i + 1) / 6, px = -74 + 148 * t;
        const py = 16 * 2 * t * (1 - t);
        c.fillStyle = cols[i % 4];
        c.beginPath(); c.moveTo(px - 6, py); c.lineTo(px + 6, py); c.lineTo(px, py + 13); c.closePath(); c.fill();
      }
      c.restore();
    } else if (d.kind === 'banner') {
      // پرچمِ آویزانِ آرنا
      c.save(); c.translate(d.x, gy);
      c.strokeStyle = 'rgba(90,40,30,.9)'; c.lineWidth = 3;
      c.beginPath(); c.moveTo(-34, 0); c.lineTo(34, 0); c.stroke();
      const sw = Math.sin(timeNow * 1.4 + d.x * 0.01) * 4;
      c.fillStyle = '#7d1f1f';
      c.beginPath();
      c.moveTo(-22, 0); c.lineTo(22, 0); c.lineTo(22 + sw, 78); c.lineTo(0 + sw, 94); c.lineTo(-22 + sw, 78);
      c.closePath(); c.fill();
      c.fillStyle = 'rgba(255,200,120,.75)';
      c.beginPath(); c.arc(sw * 0.5, 40, 11, 0, TAU); c.fill();
      c.fillStyle = '#7d1f1f';
      c.beginPath(); c.arc(sw * 0.5, 40, 6, 0, TAU); c.fill();
      c.restore();
    } else if (d.kind === 'stall') {
      drawStall(c, d, gy);
    } else if (d.kind === 'skull') {
      c.save(); c.translate(d.x, gy - 10); c.scale(d.s, d.s); c.globalAlpha = 0.85;
      circle(c, 0, 0, 10, '#e9e0cf'); c.fillStyle = '#2a0a10';
      c.fillRect(-6, -3, 4, 5); c.fillRect(2, -3, 4, 5); c.fillRect(-2, 4, 4, 4);
      c.restore();
    } else if (d.kind === 'candle') {
      c.save(); c.translate(d.x, gy - 4); c.scale(d.s, d.s);
      c.fillStyle = '#efe3c8'; c.fillRect(-4, -26, 8, 26);
      const f = 1 + Math.sin(timeNow * 8 + d.x) * 0.15;
      glow(c, 0, -32, 22, 'rgba(255,180,60,.8)', 0.6);
      ell(c, 0, -32, 4 * f, 8 * f, '#ffd36a');
      c.restore();
    } else if (d.kind === 'bone') {
      c.save(); c.translate(d.x, gy - 6); c.rotate(0.4); c.globalAlpha = 0.7;
      fillRR(c, -14, -3, 28, 6, 3, '#ded5c2'); c.restore();
    } else if (d.kind === 'pillar') {
      c.globalAlpha = 0.35; c.fillStyle = worldOf(L.theme).propCol || '#240910';
      c.fillRect(d.x, gy - 180 * d.s, 34, 180 * d.s); c.globalAlpha = 1;
    } else if (d.kind === 'stack') {
      // دسته‌ی پرونده‌های روی هم — بایگانی
      c.save(); c.translate(d.x, gy); c.scale(d.s, d.s); c.globalAlpha = 0.9;
      for (let i = 0; i < 6; i++) {
        c.fillStyle = i % 2 ? '#d9c79b' : '#c3ad7e';
        c.fillRect(-13 + (i % 3) - 1, -5 - i * 5, 26, 5);
      }
      c.fillStyle = '#8a6a30'; c.fillRect(-13, -4, 26, 4);
      c.globalAlpha = 1; c.restore();
    } else if (d.kind === 'crate') {
      c.save(); c.translate(d.x, gy); c.scale(d.s, d.s); c.globalAlpha = 0.85;
      fillRR(c, -14, -26, 28, 26, 2, '#6b4e2a');
      c.strokeStyle = 'rgba(0,0,0,.35)'; c.lineWidth = 2;
      c.beginPath(); c.moveTo(-14, -26); c.lineTo(14, 0); c.moveTo(14, -26); c.lineTo(-14, 0); c.stroke();
      c.globalAlpha = 1; c.restore();
    } else if (d.kind === 'icechunk') {
      c.save(); c.translate(d.x, gy); c.scale(d.s, d.s); c.globalAlpha = 0.8;
      c.fillStyle = '#9fd9ea';
      c.beginPath(); c.moveTo(-14, 0); c.lineTo(-6, -24); c.lineTo(4, -30); c.lineTo(12, -14); c.lineTo(15, 0); c.closePath(); c.fill();
      c.fillStyle = 'rgba(255,255,255,.55)';
      c.beginPath(); c.moveTo(-5, 0); c.lineTo(0, -22); c.lineTo(4, 0); c.closePath(); c.fill();
      c.globalAlpha = 1; c.restore();
    } else if (d.kind === 'term') {
      // پایانه‌ی کوچک با صفحه‌ی چشمک‌زن — مرکز داده
      c.save(); c.translate(d.x, gy); c.scale(d.s, d.s);
      fillRR(c, -13, -24, 26, 24, 3, '#1b1940');
      const on = Math.sin(timeNow * 4 + d.x) > -0.3;
      c.fillStyle = on ? '#49f7c8' : '#1f6a58';
      c.fillRect(-9, -20, 18, 12);
      c.fillStyle = '#0d0c22'; c.fillRect(-7, -17, 9, 2); c.fillRect(-7, -13, 13, 2);
      c.fillStyle = '#2a2663'; c.fillRect(-15, -3, 30, 3);
      c.restore();
    } else if (d.kind === 'barrel') {
      c.save(); c.translate(d.x, gy); c.scale(d.s, d.s); c.globalAlpha = 0.9;
      fillRR(c, -12, -30, 24, 30, 5, '#4a5a28');
      c.fillStyle = 'rgba(0,0,0,.3)'; c.fillRect(-12, -23, 24, 3); c.fillRect(-12, -11, 24, 3);
      c.fillStyle = '#6d8238'; c.beginPath(); c.ellipse(0, -30, 12, 4, 0, 0, TAU); c.fill();
      c.globalAlpha = 1; c.restore();
    } else if (d.kind === 'pot') {
      // دیگِ کوچک با بخار — آشپزخانه
      c.save(); c.translate(d.x, gy); c.scale(d.s, d.s);
      c.fillStyle = '#5a4030';
      c.beginPath(); c.moveTo(-15, -22); c.lineTo(15, -22); c.lineTo(11, 0); c.lineTo(-11, 0); c.closePath(); c.fill();
      c.fillStyle = '#7d5a3c'; c.beginPath(); c.ellipse(0, -22, 15, 5, 0, 0, TAU); c.fill();
      c.fillStyle = '#ffb15a'; c.globalAlpha = 0.5 + Math.sin(timeNow * 3 + d.x) * 0.2;
      c.beginPath(); c.ellipse(0, -22, 11, 3.4, 0, 0, TAU); c.fill();
      const ph = (timeNow * 0.6 + d.x * 0.01) % 1;
      c.globalAlpha = (1 - ph) * 0.3;
      circle(c, Math.sin(timeNow * 2 + d.x) * 5, -26 - ph * 36, 5 + ph * 8, '#ffe6c0');
      c.globalAlpha = 1; c.restore();
    } else if (d.kind === 'tuft') {
      // پفِ ابرِ کوچک — بامِ ابرها
      c.save(); c.translate(d.x, gy - 6); c.scale(d.s, d.s); c.globalAlpha = 0.78;
      c.fillStyle = '#eaf2ff';
      c.beginPath(); c.ellipse(-9, 0, 12, 7, 0, 0, TAU); c.fill();
      c.beginPath(); c.ellipse(4, -4, 14, 9, 0, 0, TAU); c.fill();
      c.beginPath(); c.ellipse(15, 0, 10, 6, 0, 0, TAU); c.fill();
      c.globalAlpha = 1; c.restore();
    } else if (d.kind === 'vase') {
      c.save(); c.translate(d.x, gy); c.scale(d.s, d.s);
      c.fillStyle = '#c7a042';
      c.beginPath();
      c.moveTo(-6, 0); c.quadraticCurveTo(-16, -14, -8, -26); c.lineTo(8, -26);
      c.quadraticCurveTo(16, -14, 6, 0); c.closePath(); c.fill();
      c.fillStyle = 'rgba(255,245,200,.5)'; c.fillRect(-8, -28, 16, 3);
      c.restore();
    } else if (d.kind === 'plant') {
      c.save(); c.translate(d.x, gy); c.scale(d.s, d.s);
      c.fillStyle = '#8a6c22'; c.fillRect(-9, -12, 18, 12);
      c.fillStyle = '#3f7a3a';
      for (let k = -2; k <= 2; k++) {
        c.save(); c.translate(0, -12); c.rotate(k * 0.36 + Math.sin(timeNow + d.x) * 0.04);
        c.beginPath(); c.ellipse(0, -13, 4, 14, 0, 0, TAU); c.fill();
        c.restore();
      }
      c.restore();
    }
  }
  c.globalAlpha = 1;
}

/* دروازه‌ی خروج */
function drawExit(c) {
  if (L.isBoss && !L.exit.open) return;   // در میدان رئیس، در تا پایان نبرد دیده نمی‌شود
  const e = L.exit;
  const open = e.open;
  const pulse = 0.5 + Math.sin(timeNow * 3) * 0.5;
  glow(c, e.x + e.w / 2, e.y + e.h / 2, open ? 110 + pulse * 30 : 50,
    open ? 'rgba(255,240,170,.9)' : 'rgba(120,120,140,.5)', open ? 0.75 : 0.3);
  // قاب در
  fillRR(c, e.x - 8, e.y - 10, e.w + 16, e.h + 10, 10, open ? '#f0cf74' : '#6b6b78');
  fillRR(c, e.x, e.y, e.w, e.h, 6, open ? '#fff6d8' : '#2a2a33');
  if (open) {
    c.save();
    c.globalAlpha = 0.6 + pulse * 0.3;
    const g = c.createLinearGradient(e.x, e.y, e.x, e.y + e.h);
    g.addColorStop(0, '#ffffff'); g.addColorStop(1, '#ffe49a');
    c.fillStyle = g; c.fillRect(e.x + 4, e.y + 4, e.w - 8, e.h - 8);
    c.restore();
    for (let i = 0; i < 2; i++) {
      if (Math.random() < 0.3) spawnParts(1, e.x + e.w / 2 + rand(20, -20), e.y + e.h, { col: ['#fff3c4', '#ffd978'], grav: -60, speed: 30, life: 0.9, size: 3 });
    }
  } else {
    // قفل
    const lx = e.x + e.w / 2, ly = e.y + e.h / 2;
    c.strokeStyle = '#ffcf6a'; c.lineWidth = 4;
    c.beginPath(); c.arc(lx, ly - 6, 9, Math.PI, 0); c.stroke();
    fillRR(c, lx - 13, ly - 6, 26, 20, 4, '#ffcf6a');
    circle(c, lx, ly + 3, 3.4, '#5a3a06');
  }
}

/* جواهرها واحدشان «قیراط» است و فقط در جواهرفروشیِ شهر خرج می‌شوند (خریدِ قدرت ویژه). */

};

  { id: 'ashtray', icon: '🧊', name: 'زیرسیگاریِ کریستال',    price: 150, desc: 'در جهنم هم کسی سیگار نمی‌کشد.' },

  { id: 'teapot',  icon: '🫖', name: 'قوریِ نقره‌ایِ آبدارخانه', price: 210, desc: 'چایش هیچ‌وقت سرد نمی‌شود.' }
];
function lootById(id) { return LOOT.find(l => l.id === id); }

/* دکه‌ی مغازه در شهر */
function drawStall(c, d, gy) {
  const sh = (L.shops || []).find(x => x.id === d.shop);
  const near = sh && sh.near;
  const w = d.w, x0 = d.x, h = 150;
  c.save();
  // سایه
  c.globalAlpha = 0.25; ell(c, x0 + w / 2, gy + 2, w * 0.5, 9, '#000'); c.globalAlpha = 1;
  // دیوارِ پشتی
  fillRR(c, x0 + 14, gy - h + 24, w - 28, h - 24, 4, '#3b2a44');
  // تیرک‌ها
  c.fillStyle = '#5a3f26';
  c.fillRect(x0 + 8, gy - h, 9, h);
  c.fillRect(x0 + w - 17, gy - h, 9, h);
  // سایبانِ راه‌راه
  const stripes = ['#e85d6c', '#fff3dc'];
  for (let i = 0; i < 7; i++) {
    c.fillStyle = stripes[i % 2];
    const sx = x0 + 2 + (w - 4) * (i / 7), ex = x0 + 2 + (w - 4) * ((i + 1) / 7);
    c.beginPath();
    c.moveTo(sx, gy - h); c.lineTo(ex, gy - h); c.lineTo(ex, gy - h + 24); c.lineTo(sx, gy - h + 24);
    c.closePath(); c.fill();
  }
  c.fillStyle = 'rgba(0,0,0,.2)'; c.fillRect(x0 + 2, gy - h + 20, w - 4, 5);

  // فروشنده پشت پیشخوان (قبل از پیشخوان رسم می‌شود تا پشتش بماند)
  const bob = Math.sin(timeNow * 2 + x0) * 2;
  c.save();
  c.translate(x0 + w / 2 + 38, gy - 50 + bob);
  c.scale(0.9, 0.9);
  ell(c, 0, -34, 15, 17, '#dfe8ff');
  ell(c, 0, -55, 11, 11, '#f4e2c4');
  c.strokeStyle = '#ffd45e'; c.lineWidth = 2.2;
  c.beginPath(); c.ellipse(0, -69, 9, 3, 0, 0, TAU); c.stroke();   // هاله
  c.fillStyle = '#2a2436';
  c.beginPath(); c.arc(-3.5, -56, 1.6, 0, TAU); c.fill();
  c.beginPath(); c.arc(3.5, -56, 1.6, 0, TAU); c.fill();
  c.strokeStyle = '#2a2436'; c.lineWidth = 1.4;
  c.beginPath(); c.arc(0, -52, 4, 0.15 * Math.PI, 0.85 * Math.PI); c.stroke();
  c.restore();

  // پیشخوان و بساطِ روی آن
  fillRR(c, x0 + 10, gy - 48, w - 20, 48, 5, '#6b4a2e');
  fillRR(c, x0 + 2, gy - 56, w - 4, 12, 4, '#8a6239');
  c.fillStyle = 'rgba(255,255,255,.07)'; c.fillRect(x0 + 10, gy - 36, w - 20, 3);
  for (let i = 0; i < 3; i++) {
    const bx = x0 + 24 + i * 22;
    c.fillStyle = ['#ffd45e', '#9df0ff', '#ff9ecb'][i];
    c.globalAlpha = 0.9;
    c.beginPath(); c.arc(bx, gy - 62, 5, 0, TAU); c.fill();
    c.globalAlpha = 1;
  }

  // تابلو با نام مغازه
  const name = sh ? sh.name : '';
  c.font = '800 15px Vazirmatn, Tahoma, sans-serif';
  const tw = Math.max(c.measureText(name).width + 46, 120);
  const bx0 = x0 + w / 2 - tw / 2, by0 = gy - h - 38;
  fillRR(c, bx0, by0, tw, 32, 7, '#f6ead0');
  c.strokeStyle = '#9a7a3c'; c.lineWidth = 2; rr(c, bx0, by0, tw, 32, 7); c.stroke();
  faText(c, name, bx0 + tw / 2 + 11, by0 + 21, 15, '#4a3418', 'center', 800);
  faText(c, (sh ? sh.icon : '🏷️'), bx0 + 18, by0 + 22, 16, '#5a3f26');
  // بندِ آویز
  c.strokeStyle = '#5a3f26'; c.lineWidth = 2;
  c.beginPath(); c.moveTo(x0 + 12, gy - h); c.lineTo(bx0 + 8, by0 + 30); c.stroke();
  c.beginPath(); c.moveTo(x0 + w - 12, gy - h); c.lineTo(bx0 + tw - 8, by0 + 30); c.stroke();

  // چراغ‌های کوچک زیر سایبان
  for (let i = 0; i < 5; i++) {
    const lx = x0 + 18 + i * ((w - 36) / 4);
    const on = (Math.sin(timeNow * 3 + i * 1.3) + 1) / 2;
    glow(c, lx, gy - h + 28, 11, 'rgba(255,220,140,' + (0.4 + on * 0.5) + ')', 0.5);
  }

  // راهنمای تعامل — حبابی بالای پیشخوان، دور از نوار بالای صفحه
  if (near) {
    const fl = 1 + Math.sin(timeNow * 7) * 0.07;
    c.save();
    c.translate(x0 + w / 2 - 44, gy - 112 + Math.sin(timeNow * 4) * 4);
    c.scale(fl, fl);
    fillRR(c, -52, -18, 104, 34, 9, 'rgba(18,10,30,.93)');
    c.strokeStyle = '#ffd45e'; c.lineWidth = 2; rr(c, -52, -18, 104, 34, 9); c.stroke();
    c.fillStyle = 'rgba(18,10,30,.93)';
    c.beginPath(); c.moveTo(-7, 15); c.lineTo(7, 15); c.lineTo(0, 24); c.closePath(); c.fill();
    faText(c, '↑ ورود', 0, 6, 17, '#ffd45e');
    c.restore();
  }
  c.restore();
}

/* آیتم‌ها */
function spawnPickup(x, y, kind, data) {
  PICKUPS.push({ x, y, w: 22, h: 22, vx: rand(80, -80), vy: -220, kind, data: data || null, t: 0, onGround: false });
}
function updatePickups(dt, p) {
  for (let i = PICKUPS.length - 1; i >= 0; i--) {
    const k = PICKUPS[i];
    k.t += dt;
    k.vy += 1500 * dt;
    k.vx *= Math.pow(0.9, dt * 60);
    moveEntity(k, dt);
    // بعد از کشتنِ رئیس، همه‌چیز از هر فاصله‌ای به سمتِ بازیکن کشیده می‌شود
    const rush = RUN.lootRushT > 0;
    const mag = rush ? 4000 : (RUN.stats.magnet ? 190 : 60);
    const d = dist(k.x + 11, k.y + 11, p.x + p.w / 2, p.y + p.h / 2);
    if (d < mag) {
      const a = Math.atan2(p.y + p.h / 2 - k.y - 11, p.x + p.w / 2 - k.x - 11);
      const sp = rush ? 700 : 420;
      k.x += Math.cos(a) * sp * dt; k.y += Math.sin(a) * sp * dt;
      if (rush) k.vy = Math.min(k.vy, 0);        // در پرواز، نیفتد
    }
    if (d < 26) {
      let cols = ['#ffe07a', '#fff'];
      if (k.kind === 'heart') { healPlayer(p, 22); floatText(k.x, k.y, '+' + faNum(22), '#8cff9b', 20); cols = ['#8cff9b', '#fff']; }
      else if (k.kind === 'gem') {
        const g = GEMS[k.data] || GEMS.shard;
        RUN.gems = (RUN.gems || 0) + g.karat;
        RUN.score += g.karat * 30;
        floatText(k.x, k.y, g.name + ' +' + faNum(g.karat), g.col, 20);
        cols = [g.col, g.col2, '#fff'];
        Sound.tone({ f: 900, f2: 1500, t: 0.22, type: 'triangle', g: 0.07 });
      } else if (k.kind === 'loot') {
        const it = lootById(k.data) || LOOT[0];
        RUN.loot = RUN.loot || {};
        RUN.loot[it.id] = (RUN.loot[it.id] || 0) + 1;
        RUN.score += 120;
        floatText(k.x, k.y - 6, it.icon + ' ' + it.name, '#ffd45e', 20);
        toast('آیتم قیمتی پیدا کردی: ' + it.name + ' — در شهر بفروشش!', 3.2);
        cols = ['#ffd45e', '#fff6cf', '#fff'];
        Sound.tone({ f: 620, f2: 1200, t: 0.3, type: 'triangle', g: 0.08 });
      } else {
        const v = coinValue();
        RUN.coins += v; RUN.score += 25;
        floatText(k.x, k.y, '+' + faNum(v) + ' سکه', '#ffe07a', 18);
      }
      if (k.kind !== 'gem' && k.kind !== 'loot') Sound.pickup();
      spawnParts(k.kind === 'loot' ? 16 : 8, k.x + 11, k.y + 11, { col: cols, speed: 140, life: 0.4, size: 4, grav: 200 });
      PICKUPS.splice(i, 1);
    }
  }
}
/* یک سکه چقدر می‌ارزد: در سالن‌های بالاتر بیشتر، تا با قیمت‌های پلکانیِ مغازه هم‌پا بماند.
   در نبردِ بی‌پایان موج جای سالن را می‌گیرد و یک ضریبِ ۱٫۶ هم رویش هست، چون تنها
   راهِ قوی‌شدن در آن حالت، خریدِ ارتقا بینِ موج‌هاست. */
function coinValue() {
  const lvl = economyLevel();
  const base = 3 + Math.round(lvl * 0.55);
  return inArena() ? Math.round(base * 1.6) : base;
}

function drawPickups(c) {
  for (const k of PICKUPS) {
    const b = Math.sin(timeNow * 5 + k.t * 3) * 3;
    if (k.kind === 'heart') {
      glow(c, k.x + 11, k.y + 11 + b, 26, 'rgba(120,255,150,.6)', 0.5);
      c.save(); c.translate(k.x + 11, k.y + 11 + b);
      // کلوچه‌ی بهشتی
      circle(c, 0, 0, 10, '#e8b773');
      circle(c, 0, 0, 10, 'rgba(255,255,255,0)');
      c.strokeStyle = '#c98f4c'; c.lineWidth = 1.6; c.beginPath(); c.arc(0, 0, 10, 0, TAU); c.stroke();
      c.fillStyle = '#6b4423';
      c.beginPath(); c.arc(-3, -3, 1.8, 0, TAU); c.fill();
      c.beginPath(); c.arc(3.5, 1, 1.8, 0, TAU); c.fill();
      c.beginPath(); c.arc(-1, 4, 1.6, 0, TAU); c.fill();
      c.strokeStyle = '#8cff9b'; c.lineWidth = 1.8;
      c.beginPath(); c.ellipse(0, -13, 7, 2.6, 0, 0, TAU); c.stroke();
      c.restore();
    } else if (k.kind === 'gem') {
      const g = GEMS[k.data] || GEMS.shard;
      const sc = 0.8 + (g.karat >= 12 ? 0.35 : g.karat >= 6 ? 0.2 : g.karat >= 3 ? 0.1 : 0);
      glow(c, k.x + 11, k.y + 11 + b, 28 * sc, hexA(g.col, 0.75), 0.55);
      c.save(); c.translate(k.x + 11, k.y + 11 + b); c.rotate(Math.sin(timeNow * 2.2 + k.t) * 0.35); c.scale(sc, sc);
      // سنگِ تراش‌خورده
      c.fillStyle = g.col;
      c.beginPath(); c.moveTo(0, -11); c.lineTo(8, -3); c.lineTo(5, 9); c.lineTo(-5, 9); c.lineTo(-8, -3); c.closePath(); c.fill();
      c.fillStyle = g.col2;
      c.beginPath(); c.moveTo(0, -11); c.lineTo(8, -3); c.lineTo(0, -1); c.closePath(); c.fill();
      c.beginPath(); c.moveTo(0, -11); c.lineTo(-8, -3); c.lineTo(0, -1); c.closePath(); c.fill();
      c.globalAlpha = 0.65; c.fillStyle = '#ffffff';
      c.beginPath(); c.moveTo(-3, -1); c.lineTo(1, -1); c.lineTo(-1, 8); c.closePath(); c.fill();
      c.globalAlpha = 1;
      c.strokeStyle = 'rgba(255,255,255,.75)'; c.lineWidth = 1;
      c.beginPath(); c.moveTo(0, -11); c.lineTo(8, -3); c.lineTo(5, 9); c.lineTo(-5, 9); c.lineTo(-8, -3); c.closePath(); c.stroke();
      // برقِ کوچک
      const tw = (Math.sin(timeNow * 6 + k.t * 4) + 1) / 2;
      c.globalAlpha = tw * 0.9; c.strokeStyle = '#fff'; c.lineWidth = 1.4;
      c.beginPath(); c.moveTo(-4, -6); c.lineTo(4, -6); c.moveTo(0, -10); c.lineTo(0, -2); c.stroke();
      c.globalAlpha = 1;
      c.restore();
    } else if (k.kind === 'loot') {
      const it = lootById(k.data) || LOOT[0];
      glow(c, k.x + 11, k.y + 11 + b, 32, 'rgba(255,212,94,.8)', 0.6);
      c.save(); c.translate(k.x + 11, k.y + 11 + b);
      // صندوقچه‌ی کوچک طلایی
      fillRR(c, -12, -4, 24, 15, 3, '#c9972e');
      fillRR(c, -12, -11, 24, 9, 4, '#e8c24a');
      c.fillStyle = '#6b4a12'; c.fillRect(-2.5, -6, 5, 7);
      c.fillStyle = '#fff6cf'; c.fillRect(-11, -9, 22, 2);
      faText(c, it.icon, 0, -20, 15, '#ffffff');
      c.restore();
    } else {
      glow(c, k.x + 11, k.y + 11 + b, 24, 'rgba(255,220,110,.65)', 0.5);
      c.save(); c.translate(k.x + 11, k.y + 11 + b); c.rotate(Math.sin(timeNow * 3) * 0.3);
      c.strokeStyle = '#ffd95e'; c.lineWidth = 4;
      c.beginPath(); c.ellipse(0, 0, 11, 5, 0, 0, TAU); c.stroke();
      c.restore();
    }
  }
}

/* ============================================================
   بازیکن: «منوچهر»، روحِ تازه‌وارد و گیج

const PHYS = {
  grav: 2250, maxFall: 1150,
  runAccel: 4200, airAccel: 2600,
  frictionGround: 4200, frictionAir: 900,
  maxSpeed: 320,
  jumpVel: -755, jumpCut: -430,
  coyote: 0.1, buffer: 0.13,
  dashSpeed: 860, dashTime: 0.17, dashCd: 0.6
};

function makePlayer(x, y) {
  return {
    x, y, w: 26, h: 42, vx: 0, vy: 0, facing: 1,
    onGround: false, standingOn: null, coyote: 0, buffer: 0, jumps: 0,
    dashT: 0, dashCd: 0, dashDir: 1, iframes: 0, flash: 0,
    atkT: 0, atkDur: 0, combo: 0, comboT: 0, hitSet: new Set(), slam: false, slamHit: false,
    hp: RUN.stats.maxHp, maxHp: RUN.stats.maxHp,
    shield: false, shieldT: 0,
    anim: 0, idleT: 0, trail: [], dead: false, deadT: 0, dropThrough: 0,
    squash: 1, landT: 0, control: true, kills: 0, safeX: x, safeY: y
  };
}

function healPlayer(p, amt) {
  p.hp = Math.min(p.maxHp, p.hp + amt);
  spawnParts(10, p.x + p.w / 2, p.y + p.h / 2, { col: ['#8cff9b', '#ffffff'], speed: 120, life: 0.6, size: 4, grav: -50 });
}

function hurtPlayer(p, dmg, srcX, opts = {}) {
  // opts.force: افتادن در گودال باید همیشه هزینه داشته باشد. وگرنه چون «نجات»
  // ۱٫۱ ثانیه مصونیت می‌دهد و بازیکن را لبِ همان گودال می‌گذارد، افتادنِ بعدی
  // مجانی می‌شد و می‌شد تا ابد توی حلقه‌ی افتادن ماند بدون اینکه جان کم شود.
  if (p.dead || GAMESTATE !== 'play') return;
  if (p.iframes > 0 && !opts.force) return;
  // سپرِ بوروکراتیک: تا وقتی برقرار است، هیچ ضربه‌ای ثبت نمی‌شود
  if (p.aegisT > 0) {
    p.iframes = 0.25;
    ring(p.x + p.w / 2, p.y + p.h / 2, '#ffd45e', 20, 460, 0.3);
    Sound.blip(1100);
    floatText(p.x + p.w / 2, p.y - 8, 'رد شد!', '#ffd45e', 20);
    return;
  }
  if (p.shield) {
    p.shield = false; p.shieldT = 0;
    p.iframes = 0.7;
    ring(p.x + p.w / 2, p.y + p.h / 2, '#9fe3ff', 18, 420, 0.35);
    Sound.blip(880); floatText(p.x + p.w / 2, p.y - 8, 'سپر!', '#9fe3ff', 20);
    return;
  }
  let d = dmg * RUN.stats.dmgTakenMul;
  if (opts.fire && RUN.stats.fireResist) d *= 0.5;
  d = Math.max(1, Math.round(d));
  p.hp -= d;
  p.iframes = 0.95; p.flash = 0.18;
  RUN.damageTaken += d;
  RUN.combo = 0;
  const dir = srcX === undefined ? -p.facing : sign(p.x + p.w / 2 - srcX) || 1;
  p.vx = dir * 290; p.vy = -290;
  hitstop = Math.max(hitstop, 0.07);
  Cam.kick(10);
  Sound.hurt();
  floatText(p.x + p.w / 2, p.y - 6, '-' + faNum(d), '#ff6b6b', 24);
  spawnParts(14, p.x + p.w / 2, p.y + p.h / 2, { col: ['#bfe6ff', '#ffffff', '#ff8e8e'], speed: 220, life: 0.5, size: 5 });
  if (p.hp <= 0) { p.hp = 0; killPlayer(p); }
}

function killPlayer(p) {
  if (p.dead) return;
  p.dead = true; p.deadT = 0; p.vy = -420; p.vx = -p.facing * 120;
  Sound.lose();
  spawnParts(40, p.x + p.w / 2, p.y + p.h / 2, { col: ['#dff3ff', '#9fd8ff', '#fff'], speed: 320, life: 1.1, size: 6, grav: 400 });
  ring(p.x + p.w / 2, p.y + p.h / 2, '#dff3ff', 10, 700, 0.5);
  setTimeout(() => { if (GAMESTATE === 'play') onPlayerDeath(); }, 900);
}

function playerAttackBox(p) {
  if (p.slam) return { x: p.x - 10, y: p.y + p.h - 10, w: p.w + 20, h: 40 };
  const reach = RUN.stats.sword ? 68 : 52;
  return { x: p.facing > 0 ? p.x + p.w - 8 : p.x - reach + 8, y: p.y - 2, w: reach, h: 46 };
}

function startAttack(p, slam) {
  p.atkDur = (slam ? 0.4 : 0.27) / RUN.stats.atkSpeedMul;
  p.atkT = p.atkDur;
  p.hitSet = new Set();
  p.slam = !!slam;
  p.slamHit = false;
  if (!slam) {
    p.combo = (p.comboT > 0 ? (p.combo + 1) % 3 : 0);
    p.comboT = 0.55;
    if (p.onGround) p.vx += p.facing * (p.combo === 2 ? 190 : 90);
  } else {
    p.vy = 980;
  }
  Sound.swing();
}

function updatePlayer(p, dt) {
  p.anim += dt;
  if (p.dead) {
    p.deadT += dt; p.vy += PHYS.grav * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= 0.97;
    return;
  }
  const st = RUN.stats;

  /* --- تایمرها --- */
  p.iframes = Math.max(0, p.iframes - dt);
  p.flash = Math.max(0, p.flash - dt);
  p.dashCd = Math.max(0, p.dashCd - dt);
  p.comboT = Math.max(0, p.comboT - dt);
  p.landT = Math.max(0, p.landT - dt);
  p.dropThrough = Math.max(0, p.dropThrough - dt);
  if (p.atkT > 0) p.atkT = Math.max(0, p.atkT - dt);
  if (st.shieldPerk) {
    if (!p.shield) { p.shieldT += dt; if (p.shieldT > 18) { p.shield = true; ring(p.x + p.w / 2, p.y + p.h / 2, '#9fe3ff', 10, 260, 0.4); Sound.blip(1200); } }
  }

  const wantLeft = p.control && IN.left, wantRight = p.control && IN.right;
  const moveDir = (wantRight ? 1 : 0) - (wantLeft ? 1 : 0);

  /* --- جاخالی (dash) --- */
  if (p.control && IN.dash && p.dashCd <= 0 && p.dashT <= 0) {
    p.dashT = PHYS.dashTime;
    p.dashCd = PHYS.dashCd * st.dashCdMul;
    p.dashDir = moveDir !== 0 ? moveDir : p.facing;
    p.facing = p.dashDir;
    p.iframes = Math.max(p.iframes, PHYS.dashTime + 0.08);
    p.atkT = 0; p.slam = false;
    Sound.dash();
    spawnParts(12, p.x + p.w / 2, p.y + p.h / 2, { col: ['#ffffff', '#bfe6ff'], speed: 200, life: 0.3, size: 5, grav: 0, angle: p.dashDir > 0 ? Math.PI : 0, spread: 1.1 });
    RUN.dashes++;
  }

  if (p.dashT > 0) {
    p.dashT -= dt;
    p.vx = p.dashDir * PHYS.dashSpeed;
    p.vy = 0;
    p.trail.push({ x: p.x, y: p.y, f: p.facing, t: 0 });
  } else {
    /* --- حرکت افقی --- */
    const maxS = PHYS.maxSpeed * st.speedMul * (p.atkT > 0 && p.onGround ? 0.55 : 1);
    if (moveDir !== 0) {
      p.vx = approach(p.vx, moveDir * maxS, (p.onGround ? PHYS.runAccel : PHYS.airAccel) * dt);
      if (p.atkT <= 0) p.facing = moveDir;
      p.idleT = 0;
    } else {
      p.vx = approach(p.vx, 0, (p.onGround ? PHYS.frictionGround : PHYS.frictionAir) * dt);
      p.idleT += dt;
    }
    /* --- گرانش --- */
    p.vy = Math.min(PHYS.maxFall, p.vy + PHYS.grav * dt * (p.vy < 0 && !IN.jumpHeld ? 1.5 : 1));
  }

  /* --- پرش --- */
  if (p.onGround) { p.coyote = PHYS.coyote; p.jumps = 0; }
  else {
    p.coyote = Math.max(0, p.coyote - dt);
    if (p.coyote <= 0 && p.jumps === 0) p.jumps = 1; // از لبه افتادی: پرش زمینی سوخت
  }
  if (p.control && IN.jump) p.buffer = PHYS.buffer;
  else p.buffer = Math.max(0, p.buffer - dt);

  const maxJumps = 2 + st.extraJumps;
  if (p.buffer > 0 && p.dashT <= 0 && p.jumps < maxJumps) {
    let dropped = false;
    if (IN.down && p.onGround) {
      // عبور از سکوی یک‌طرفه
      for (const o of L.oneways) {
        if (p.x + p.w > o.x && p.x < o.x + o.w && Math.abs(p.y + p.h - o.y) < 6) { dropped = true; break; }
      }
      if (dropped) { p.dropThrough = 0.22; p.y += 6; p.buffer = 0; }
    }
    if (!dropped && p.dropThrough <= 0) {
      const first = p.jumps === 0;
      p.vy = PHYS.jumpVel * (first ? 1 : 0.92);
      p.jumps++;
      p.coyote = 0; p.buffer = 0; p.squash = 0.72;
      Sound.jump();
      if (!first) {
        ring(p.x + p.w / 2, p.y + p.h, '#ffffff', 6, 300, 0.3);
        spawnParts(10, p.x + p.w / 2, p.y + p.h, { col: ['#ffffff', '#cfefff'], speed: 150, life: 0.4, size: 4, grav: 200 });
      } else {
        spawnParts(6, p.x + p.w / 2, p.y + p.h, { col: ['#ffffff'], speed: 90, life: 0.3, size: 3, grav: 300 });
      }
    }
  }
  if (!IN.jumpHeld && p.vy < PHYS.jumpCut) p.vy = PHYS.jumpCut;

  /* --- حمله --- */
  if (p.control && IN.attack && p.atkT <= 0) {
    if (!p.onGround && IN.down) startAttack(p, true);
    else startAttack(p, false);
  }
  if (p.slam) {
    if (p.onGround) {
      p.slam = false; p.atkT = 0;
      Cam.kick(8); Sound.hitEnemy();
      ring(p.x + p.w / 2, p.y + p.h, '#ffd27a', 8, 520, 0.35);
      spawnParts(16, p.x + p.w / 2, p.y + p.h, { col: ['#ffd27a', '#ff8e3c', '#fff'], speed: 260, life: 0.5, size: 5, angle: -Math.PI / 2, spread: 2.6 });
      // موج زمینی کوچک
      for (const e of ENEMIES) {
        if (e.dead || e.isBoss) continue;
        if (Math.abs(e.x + e.w / 2 - (p.x + p.w / 2)) < 110 && Math.abs(e.y + e.h - (p.y + p.h)) < 70) {
          damageEnemy(e, 10 * RUN.stats.dmgMul, sign(e.x - p.x) || 1, { light: true });
        }
      }
    } else p.vy = 1050;
  }

  const prevOnGround = p.onGround;
  moveEntity(p, dt);
  if (p.standingOn) { p.x += p.standingOn.dx; p.y += p.standingOn.dy; }
  if (!prevOnGround && p.onGround) {
    p.squash = 1.3; p.landT = 0.12;
    if (p.vyPrev > 500) spawnParts(8, p.x + p.w / 2, p.y + p.h, { col: ['#ffffff', '#d7ecff'], speed: 120, life: 0.3, size: 4, grav: 400, angle: -Math.PI / 2, spread: 2.4 });
  }
  p.vyPrev = p.vy;
  p.squash = approach(p.squash, 1, dt * 3.2);
  // روی سکوی متحرک «نقطه‌ی امن» ثبت نمی‌شود (وگرنه نجات، تو را وسط گدازه برمی‌گرداند)
  if (p.onGround && !p.standingOn && !inHazard(p)) { p.safeX = p.x; p.safeY = p.y - 4; }

  /* --- برخورد ضربه با دشمنان --- */
  if (p.atkT > 0) {
    const prog = 1 - p.atkT / p.atkDur;
    if (p.slam || (prog > 0.12 && prog < 0.66)) {
      const box = playerAttackBox(p);
      for (const e of ENEMIES) {
        if (e.dead || p.hitSet.has(e)) continue;
        if (!aabb(box, rectOf(e))) continue;
        p.hitSet.add(e);
        const dir = sign(e.x + e.w / 2 - (p.x + p.w / 2)) || p.facing;
        let dmg = 15 * RUN.stats.dmgMul * (p.combo === 2 ? 1.65 : 1) * (p.slam ? 1.5 : 1);
        // سپردارها از جلو آسیب نمی‌بینند
        if (e.type === 'shielder' && !p.slam && dir === -e.facing) {
          floatText(e.x + e.w / 2, e.y - 10, 'دنگ!', '#cfd6e6', 18);
          Sound.blip(300); Cam.kick(4); p.vx = -dir * 260;
          spawnParts(8, e.x + e.w / 2 + e.facing * -14, e.y + 20, { col: ['#ffffff', '#cfd6e6'], speed: 180, life: 0.3, size: 4 });
          continue;
        }
        // صندوقِ امانات زره‌پوش است: فقط ضربه‌ی کوبنده از بالا بازش می‌کند
        if (e.type === 'safebox' && !p.slam) {
          floatText(e.x + e.w / 2, e.y - 10, 'قفله!', '#cfd6e6', 18);
          Sound.blip(240); Cam.kick(4); p.vx = -dir * 230;
          spawnParts(8, e.x + e.w / 2, e.y + 16, { col: ['#cfd6e6', '#ffd45e'], speed: 170, life: 0.3, size: 4 });
          continue;
        }
        // باس‌ها نباید با زنجیره‌ی ضربه‌ی کوبنده از بالا و بدون خطر کشته شوند
        if (p.slam && e.isBoss && (e.slamCd || 0) > 0) {
          floatText(e.x + e.w / 2, e.y - 6, 'تکراری!', '#cfd6e6', 18);
          Sound.blip(260); Cam.kick(3);
          spawnParts(6, p.x + p.w / 2, p.y + p.h, { col: ['#cfd6e6', '#ffffff'], speed: 150, life: 0.3, size: 4 });
          // جهشِ کوتاه: روی باس می‌افتی و تاوانش را می‌دهی
          if (!p.slamHit) { p.slamHit = true; p.vy = -230; p.slam = false; p.atkT = 0.14; }
          continue;
        }
        if (p.slam && e.isBoss) e.slamCd = 0.85;
        damageEnemy(e, dmg, dir, { crit: p.combo === 2 || p.slam });
        if (p.slam && !p.slamHit) { p.slamHit = true; p.vy = -560; p.slam = false; p.atkT = 0.05; }
      }
      // بازتاب پرتابه‌ها با شمشیر
      for (let i = PROJ.length - 1; i >= 0; i--) {
        const pr = PROJ[i];
        if (pr.friendly) continue;
        if (!aabb(box, { x: pr.x - pr.r, y: pr.y - pr.r, w: pr.r * 2, h: pr.r * 2 })) continue;
        PROJ.splice(i, 1);
        Sound.blip(1400); Cam.kick(3);
        floatText(pr.x, pr.y - 10, 'دفع شد!', '#ffe88a', 18);
        spawnParts(10, pr.x, pr.y, { col: ['#ffe88a', '#fff'], speed: 200, life: 0.35, size: 4, grav: 0 });
        RUN.score += 15;
      }
    }
  }

  /* --- خطرها --- */
  const hz = inHazard(p);
  if (hz && p.iframes <= 0) {
    hurtPlayer(p, hz.dmg, p.x + p.w / 2 + (p.vx > 0 ? 30 : -30), { fire: true });
    p.vy = -480;
  }
  if (p.y > L.h + 200) {
    hurtPlayer(p, 20, undefined, { force: true });
    if (!p.dead) {
      p.x = p.safeX !== undefined ? p.safeX : L.spawn.x;
      p.y = (p.safeY !== undefined ? p.safeY : L.spawn.y) - 30;
      p.vy = 0; p.vx = 0; p.iframes = Math.max(p.iframes, 1.1);
      ring(p.x + p.w / 2, p.y + p.h / 2, '#cfefff', 10, 420, 0.4);
    }
  }

  /* --- مسیر دنباله‌ی جاخالی --- */
  for (let i = p.trail.length - 1; i >= 0; i--) {
    p.trail[i].t += dt;
    if (p.trail[i].t > 0.26) p.trail.splice(i, 1);
  }
}

/* ---------------- ترسیم بازیکن ---------------- */
function drawPlayer(c, p) {
  // دنباله‌ی جاخالی
  for (const t of p.trail) {
    c.save(); c.globalAlpha = 0.28 * (1 - t.t / 0.26);
    drawSpirit(c, t.x + p.w / 2, t.y + p.h, t.f, p, true);
    c.restore();
  }
  if (p.iframes > 0 && !p.dead && Math.floor(p.anim * 22) % 2 === 0 && p.dashT <= 0) {
    c.globalAlpha = 0.45;
  }
  c.save();
  if (p.dead) {
    c.globalAlpha = Math.max(0, 1 - p.deadT * 0.9);
    c.translate(p.x + p.w / 2, p.y + p.h);
    c.rotate(p.deadT * 3);
    drawSpirit(c, 0, 0, p.facing, p, false);
    c.restore(); c.globalAlpha = 1;
    return;
  }
  drawSpirit(c, p.x + p.w / 2, p.y + p.h, p.facing, p, false);
  c.restore();
  c.globalAlpha = 1;

  // سپر
  if (p.shield) {
    c.save();
    c.globalAlpha = 0.35 + Math.sin(timeNow * 4) * 0.12;
    c.strokeStyle = '#9fe3ff'; c.lineWidth = 3;
    c.beginPath(); c.ellipse(p.x + p.w / 2, p.y + p.h / 2 - 4, 30, 36, 0, 0, TAU); c.stroke();
    c.restore();
  }

  // قوس ضربه‌ی شمشیر
  if (p.atkT > 0 && !p.slam) {
    const prog = 1 - p.atkT / p.atkDur;
    if (prog < 0.75) {
      const cx = p.x + p.w / 2, cy = p.y + p.h / 2 - 2;
      const R = RUN.stats.sword ? 66 : 50;
      const dirSign = p.facing;
      const a0 = -1.25, a1 = 1.15;
      const a = lerp(a0, a1, Math.min(1, prog / 0.7)) * (p.combo === 1 ? -1 : 1);
      c.save();
      c.translate(cx, cy); c.scale(dirSign, 1);
      c.globalAlpha = 0.9 * (1 - prog / 0.78);
      const grad = c.createLinearGradient(0, 0, R, 0);
      grad.addColorStop(0, 'rgba(255,255,255,0)');
      grad.addColorStop(0.6, RUN.stats.sword ? 'rgba(255,225,140,.95)' : 'rgba(215,240,255,.95)');
      grad.addColorStop(1, 'rgba(255,255,255,.1)');
      c.strokeStyle = grad; c.lineWidth = 13; c.lineCap = 'round';
      const spread = 1.0;
      c.beginPath(); c.arc(0, 0, R, a - spread * 0.5, a + spread * 0.5); c.stroke();
      c.lineWidth = 4; c.strokeStyle = 'rgba(255,255,255,.9)';
      c.beginPath(); c.arc(0, 0, R + 6, a - spread * 0.35, a + spread * 0.35); c.stroke();
      c.restore();
    }
  }
  // ضربه‌ی کوبنده
  if (p.slam) {
    c.save();
    c.globalAlpha = 0.8;
    const grad = c.createLinearGradient(0, p.y + p.h - 10, 0, p.y + p.h + 34);
    grad.addColorStop(0, 'rgba(255,220,130,.9)'); grad.addColorStop(1, 'rgba(255,120,40,0)');
    c.fillStyle = grad;
    c.fillRect(p.x - 8, p.y + p.h - 10, p.w + 16, 44);
    c.restore();
  }
}

/* روح: بدن، سر، هاله، شمشیر */
function drawSpirit(c, cx, cy, facing, p, ghostOnly) {
  const sq = p.squash || 1;
  const bodyH = 34 * (2 - sq), bodyW = 26 * sq;
  const airborne = !p.onGround && p.dashT <= 0;
  const flash = p.flash > 0;
  const bodyCol = flash ? '#ffffff' : 'rgba(226,245,255,.95)';
  const edge = flash ? '#ffffff' : '#79b4e6';

  c.save();
  c.translate(cx, cy);
  c.scale(facing, 1);

  // سایه
  if (!ghostOnly) { c.globalAlpha = 0.18; ell(c, 0, 2, 16, 5, '#000'); c.globalAlpha = 1; }

  const bob = Math.sin(p.anim * 3) * 1.5;
  const legPhase = Math.sin(p.anim * 16);
  const moving = Math.abs(p.vx) > 30;

  // پاها یا دنباله‌ی روحی
  if (!airborne) {
    c.fillStyle = '#bfe2f7';
    const l1 = moving ? legPhase * 6 : 0, l2 = moving ? -legPhase * 6 : 0;
    fillRR(c, -9 + l1, -12, 8, 13, 4, '#bfe2f7');
    fillRR(c, 2 + l2, -12, 8, 13, 4, '#a9d4ef');
  } else {
    c.fillStyle = bodyCol;
    c.beginPath();
    c.moveTo(-bodyW / 2, -14);
    const wig = Math.sin(p.anim * 10) * 3;
    c.quadraticCurveTo(-10, 2 + wig, -4, -4);
    c.quadraticCurveTo(0, 4 - wig, 4, -4);
    c.quadraticCurveTo(10, 2 + wig, bodyW / 2, -14);
    c.closePath(); c.fill();
  }

  // بدن
  c.fillStyle = bodyCol;
  c.strokeStyle = edge; c.lineWidth = 2;
  rr(c, -bodyW / 2, -bodyH - 10 + bob, bodyW, bodyH + 2, 11);
  c.fill(); c.stroke();

  // شنل/لباس
  c.globalAlpha = 0.5;
  c.fillStyle = '#9ed0f0';
  rr(c, -bodyW / 2 + 2, -14 + bob, bodyW - 4, 8, 4); c.fill();
  c.globalAlpha = 1;

  // سر
  const headY = -bodyH - 20 + bob;
  c.fillStyle = bodyCol; c.strokeStyle = edge; c.lineWidth = 2;
  c.beginPath(); c.arc(0, headY, 13, 0, TAU); c.fill(); c.stroke();

  // چشم‌ها (گیج)
  const look = clamp(p.vx / 300, -1, 1) * 2;
  c.fillStyle = '#ffffff';
  c.beginPath(); c.ellipse(-4.5, headY - 1, 4.2, 5, 0, 0, TAU); c.fill();
  c.beginPath(); c.ellipse(5, headY - 1, 4.2, 5, 0, 0, TAU); c.fill();
  c.fillStyle = '#20384d';
  const blink = (Math.sin(p.anim * 1.7) > 0.985) ? 0.2 : 1;
  c.beginPath(); c.ellipse(-4.5 + look, headY - 0.5, 2.1, 2.6 * blink, 0, 0, TAU); c.fill();
  c.beginPath(); c.ellipse(5 + look, headY - 0.5, 2.1, 2.6 * blink, 0, 0, TAU); c.fill();
  // ابروی گیج
  c.strokeStyle = '#5e8ead'; c.lineWidth = 1.6; c.lineCap = 'round';
  c.beginPath(); c.moveTo(-8, headY - 7); c.lineTo(-2, headY - 9); c.stroke();
  c.beginPath(); c.moveTo(2, headY - 9.5); c.lineTo(8.5, headY - 6.5); c.stroke();
  // دهان
  c.beginPath();
  if (p.flash > 0) { c.ellipse(1, headY + 6, 3.4, 3.8, 0, 0, TAU); c.fillStyle = '#44607a'; c.fill(); }
  else { c.arc(1, headY + 5, 3, 0.15 * Math.PI, 0.85 * Math.PI); c.strokeStyle = '#5e8ead'; c.stroke(); }

  // هاله‌ی کج
  c.save();
  c.translate(0, headY - 19);
  c.rotate(-0.22 + Math.sin(p.anim * 2) * 0.05);
  c.strokeStyle = '#ffd95e'; c.lineWidth = 3.4;
  if (PERF.softGlow) { c.shadowColor = 'rgba(255,215,90,.9)'; c.shadowBlur = 10; }
  c.beginPath(); c.ellipse(0, 0, 11, 4, 0, 0, TAU); c.stroke();
  c.restore();
  c.shadowBlur = 0;

  // شمشیر
  if (!ghostOnly) {
    const atk = p.atkT > 0 && !p.slam;
    const prog = atk ? 1 - p.atkT / p.atkDur : 0;
    c.save();
    if (p.slam) { c.translate(4, -8); c.rotate(1.45); }
    else if (atk) { c.translate(11, -24 + bob); c.rotate(lerp(-1.3, 1.15, Math.min(1, prog / 0.7)) * (p.combo === 1 ? -1 : 1)); }
    else { c.translate(10, -18 + bob); c.rotate(0.55 + Math.sin(p.anim * 3) * 0.05); }
    const long = RUN.stats.sword;
    // دسته
    c.fillStyle = '#8c5a2b'; c.fillRect(-3, -4, 6, 11);
    c.fillStyle = '#ffd95e'; c.fillRect(-8, -6, 16, 4);
    // تیغه
    const bl = long ? 38 : 28;
    const g = c.createLinearGradient(0, -6, 0, -6 - bl);
    g.addColorStop(0, long ? '#fff0b8' : '#eaf6ff'); g.addColorStop(1, long ? '#ffd14d' : '#9fd0f5');
    c.fillStyle = g;
    c.beginPath();
    c.moveTo(-4, -6); c.lineTo(4, -6); c.lineTo(2.5, -bl); c.lineTo(0, -bl - 7); c.lineTo(-2.5, -bl);
    c.closePath(); c.fill();
    if (long && PERF.softGlow) { c.shadowColor = 'rgba(255,200,60,.8)'; c.shadowBlur = 8; c.fill(); c.shadowBlur = 0; }
    c.restore();
  }

  // زره (پاداش رئیس دوم)
  if (RUN.stats.armor && !ghostOnly) {
    c.fillStyle = 'rgba(255,255,255,.85)';
    rr(c, -bodyW / 2 - 1, -bodyH - 2 + bob, bodyW + 2, 14, 5); c.fill();
    c.strokeStyle = '#e06a3a'; c.lineWidth = 2; c.stroke();
    c.fillStyle = '#e06a3a';
    c.beginPath();
    c.moveTo(0, -bodyH + 10 + bob);
    c.quadraticCurveTo(4, -bodyH + 4 + bob, 0, -bodyH + 1 + bob);
    c.quadraticCurveTo(-4, -bodyH + 4 + bob, 0, -bodyH + 10 + bob);
    c.fill();
  }
  c.restore();

  // علامت سؤال وقتی بی‌حرکت است
  if (!ghostOnly && p.idleT > 2.4 && p.onGround) {
    const t = (p.idleT - 2.4);
    c.save(); c.globalAlpha = Math.min(1, t) * 0.9;
    faText(c, '؟', cx + 20, cy - 78 + Math.sin(timeNow * 3) * 4, 26, '#ffe9a8', 'center', 900, 'rgba(0,0,0,.4)');
    c.restore();
  }
}


/* ===== 04-enemies.js ===== */
/* ============================================================
   دشمنان: شیطانک، گاو دوزخی، جمجمه‌ی پرنده، پشه‌ی انفجاری، سپردار
   ============================================================ */

const ENEMY_DEF = {
  imp: { w: 24, h: 28, hp: 26, dmg: 9, score: 60, name: 'شیطانک' },
  charger: { w: 44, h: 46, hp: 62, dmg: 16, score: 120, name: 'گاوِ دوزخی' },
  flyer: { w: 32, h: 28, hp: 30, dmg: 11, score: 100, name: 'جمجمه‌ی پرنده' },
  bomber: { w: 28, h: 28, hp: 18, dmg: 20, score: 90, name: 'پشه‌ی انفجاری' },
  shielder: { w: 38, h: 46, hp: 78, dmg: 14, score: 150, name: 'دیوِ سینی‌به‌دست' },
  dummy: { w: 34, h: 54, hp: 40, dmg: 0, score: 10, name: 'کیسه‌بوکسِ ابری' },
  sniper: { w: 30, h: 44, hp: 54, dmg: 13, score: 170, name: 'کارمندِ تیرانداز' },
  brute: { w: 58, h: 62, hp: 150, dmg: 22, score: 260, name: 'نره‌غولِ انبار' },
  auditor: { w: 34, h: 50, hp: 95, dmg: 18, score: 300, name: 'حسابرسِ شبگرد' },
  safebox: { w: 46, h: 44, hp: 120, dmg: 20, score: 320, name: 'صندوقِ امانات' }
};

const DEATH_CRIES = ['آخ!', 'ناجوانمردانه بود!', 'به مدیرم می‌گم!', 'قرارداد داشتم!', 'اوخ!', 'بیمه‌ام!', 'همین؟', 'یاد بگیر!', 'من بی‌گناهم!'];

function makeEnemy(type, x, y, levelIndex) {
  const d = ENEMY_DEF[type];
  // منحنی برای ۶۹ سالن بازتنظیم شد: سالن ۶۹ کمی سخت‌تر از سالن ۳۳ قدیمی است،
  // نه هشت برابر. رشدِ قدرتِ بازیکن (۲۳ پاداشِ رئیس + فروشگاه) جبرانش می‌کند.
  const hpMul = 1 + 0.066 * Math.max(0, levelIndex - 1);
  const dmgMul = 1 + 0.035 * Math.max(0, levelIndex - 1);
  return {
    type, x: x - d.w / 2, y: y - d.h, w: d.w, h: d.h, vx: 0, vy: 0,
    hp: Math.round(d.hp * hpMul), maxHp: Math.round(d.hp * hpMul),
    dmg: Math.round(d.dmg * dmgMul), score: d.score, name: d.name,
    facing: -1, onGround: false, standingOn: null, state: 'idle', t: 0, t2: rand(2, 0),
    hitFlash: 0, dead: false, deadT: 0, stun: 0, anim: rand(6, 0),
    homeX: x, aggro: false, fuse: 0, kb: 0
  };
}

function spawnEnemiesFor(lv) {
  ENEMIES.length = 0;
  for (const s of lv.spawns) ENEMIES.push(makeEnemy(s.type, s.x, s.y, lv.index));
  for (const k of lv.pickups) PICKUPS.push({ x: k.x, y: k.y, w: 22, h: 22, vx: 0, vy: 0, kind: k.kind, t: 0 });
}

function damageEnemy(e, dmg, dir, opts = {}) {
  if (e.dead) return;
  dmg = Math.round(dmg * (e.stun > 0 ? 1.5 : 1));
  e.hp -= dmg;
  e.hitFlash = 0.12;
  e.aggro = true;
  const kb = e.isBoss ? 0 : (opts.light ? 90 : 230) / (e.type === 'charger' || e.type === 'shielder' ? 2.2 : 1);
  e.vx = dir * kb;
  if (!e.isBoss && !opts.light) e.vy = Math.min(e.vy, -130);
  hitstop = Math.max(hitstop, opts.crit ? 0.075 : 0.045);
  Cam.kick(opts.crit ? 7 : 4);
  Sound.hitEnemy();
  const cx = e.x + e.w / 2, cy = e.y + e.h / 2;
  floatText(cx + rand(10, -10), cy - 10, faNum(dmg), opts.crit ? '#ffd45e' : '#ffffff', opts.crit ? 26 : 20);
  spawnParts(opts.crit ? 14 : 8, cx, cy, {
    col: ['#ffd45e', '#ff8e3c', '#ffffff'], speed: 260, life: 0.4, size: 5,
    angle: dir > 0 ? 0 : Math.PI, spread: 1.8
  });
  if (e.hp <= 0) defeatEnemy(e, dir);
}

/* باس باید حتماً از مسیر bossDie برود وگرنه دیالوگ و پاداش اجرا نمی‌شود */
function defeatEnemy(e, dir) {
  if (e.dead) return;
  if (e.isBoss) bossDie(e);
  else killEnemy(e, dir);
}

function killEnemy(e, dir) {
  if (e.dead) return;
  e.dead = true; e.deadT = 0;
  const cx = e.x + e.w / 2, cy = e.y + e.h / 2;
  Sound.kill();
  Cam.kick(6);
  RUN.combo++;
  RUN.comboT = 3.2;
  RUN.kills++;
  RUN.levelKills = (RUN.levelKills || 0) + 1;
  if (RUN.combo > RUN.bestCombo) RUN.bestCombo = RUN.combo;
  const mult = 1 + Math.min(2, RUN.combo * 0.1);
  RUN.score += Math.round(e.score * mult);
  floatText(cx, cy - 26, pickAny(DEATH_CRIES), '#ffd0d0', 20);
  if (RUN.combo > 2) floatText(cx, cy - 48, '×' + faNum(RUN.combo) + ' زنجیره', '#ffe07a', 18);
  spawnParts(26, cx, cy, { col: ['#ff6b4a', '#ffd45e', '#ffffff', '#ff9ad5', '#9af0ff'], speed: 300, life: 0.8, size: 6, shape: 'confetti' });
  ring(cx, cy, '#ffd45e', 8, 460, 0.35);
  // هاله‌ی کوچک که بالا می‌رود (کمدی)
  parts.push({ x: cx, y: cy, vx: 0, vy: -70, life: 0, max: 1.2, size: 9, col: '#ffe07a', grav: -40, shape: 'ring', grow: 6, rot: 0, vr: 0, drag: 1 });

  if (RUN.stats.explode) {
    ring(cx, cy, '#ff8e3c', 10, 620, 0.3);
    for (const o of ENEMIES) {
      if (o === e || o.dead) continue;
      if (dist(cx, cy, o.x + o.w / 2, o.y + o.h / 2) < 110) damageEnemy(o, 14 * RUN.stats.dmgMul, sign(o.x - cx) || 1, { light: true });
    }
  }
  if (RUN.stats.lifesteal) {
    RUN.killsSinceHeal = (RUN.killsSinceHeal || 0) + 1;
    if (RUN.killsSinceHeal >= 4) { RUN.killsSinceHeal = 0; healPlayer(PLAYER, 8); floatText(PLAYER.x + 13, PLAYER.y - 16, '+۸', '#8cff9b', 18); }
  }
  // در نبردِ بی‌پایان سکه هم بیشتر می‌افتد (۵۴٪ در برابر ۳۰٪) و گاهی دوتایی
  const arena = inArena();
  const r = Math.random();
  if (r < 0.16) spawnPickup(cx, cy, 'heart');
  else if (r < (arena ? 0.70 : 0.46)) {
    spawnPickup(cx, cy, 'coin');
    if (arena && Math.random() < 0.35) spawnPickup(cx + rand(16, -16), cy - 10, 'coin');
  }

  // سنگ‌های قیمتی: هرچه دشمن ارزشمندتر و سالن بالاتر، شانس بیشتر
  const tier = (ENEMY_DEF[e.type] || {}).score || 100;
  const lvl = economyLevel();
  const gemChance = Math.min(0.20, 0.055 + tier / 7000 + lvl * 0.003);
  if (Math.random() < gemChance) spawnPickup(cx, cy, 'gem', rollGem(tier, lvl));

  // آیتم قیمتی: کمیاب
  if (Math.random() < Math.min(0.05, 0.012 + lvl * 0.0012)) {
    spawnPickup(cx, cy, 'loot', pickAny(LOOT).id);
  }
}

/* کدام سنگ بیفتد: دشمن قوی‌تر و سالن بالاتر ⇒ احتمال سنگ گران‌تر */
function rollGem(tier, lvl) {
  const r = Math.random() + tier / 6000 + lvl * 0.006;
  if (r > 1.30) return 'diamond';
  if (r > 1.06) return 'emerald';
  if (r > 0.78) return 'ruby';
  return 'shard';
}

/* رئیس‌ها یک مشت سنگ می‌پاشند — نقطه‌ی اصلیِ تأمینِ جواهر */
function spillBossGems(cx, cy, lvl) {
  const big = lvl >= 24 ? 'diamond' : lvl >= 15 ? 'emerald' : lvl >= 6 ? 'ruby' : 'shard';
  spawnPickup(cx, cy - 10, 'gem', big);
  spawnPickup(cx - 26, cy, 'gem', lvl >= 12 ? 'emerald' : 'ruby');
  spawnPickup(cx + 26, cy, 'gem', 'ruby');
  const extra = 1 + Math.floor(lvl / 9);
  for (let i = 0; i < extra; i++) {
    spawnPickup(cx + (i - extra / 2) * 34, cy - 24, 'gem', rollGem(900 + lvl * 40, lvl));
  }
  spawnPickup(cx + 52, cy, 'loot', pickAny(LOOT).id);
  /* سکه — ارزِ اصلیِ آهنگر و فروشگاه. تا پیش از این خزانه‌ی رئیس فقط
     جواهر داشت، یعنی بزرگ‌ترین لحظه‌ی بازی هیچ «پول»ی نمی‌داد. */
  const coins = 10 + Math.floor(lvl / 5);
  for (let i = 0; i < coins; i++) {
    const a = Math.PI * (0.15 + 0.7 * (i / Math.max(1, coins - 1)));
    spawnPickup(cx + Math.cos(a) * rand(96, 40) * (i % 2 ? 1 : -1),
                cy - Math.sin(a) * rand(54, 14), 'coin');
  }
}

/* ---------------- هوش مصنوعی ---------------- */
function updateEnemy(e, dt, p) {
  e.anim += dt;
  e.hitFlash = Math.max(0, e.hitFlash - dt);
  if (e.dead) {
    e.deadT += dt;
    return;
  }
  e.t += dt;
  e.stun = Math.max(0, e.stun - dt);
  const pcx = p.x + p.w / 2, pcy = p.y + p.h / 2;
  const cx = e.x + e.w / 2, cy = e.y + e.h / 2;
  const dx = pcx - cx, dy = pcy - cy, d = Math.hypot(dx, dy);
  const grav = 2000;

  switch (e.type) {
    case 'dummy': {
      e.vx = approach(e.vx, 0, 600 * dt);
      e.vy += grav * dt;
      moveEntity(e, dt);
      break;
    }
    case 'imp': {
      if (e.stun > 0) { e.vx = approach(e.vx, 0, 900 * dt); }
      else {
        if (d < 260 && Math.abs(dy) < 120) e.aggro = true;
        const spd = e.aggro ? 128 : 58;
        let dir = e.aggro ? sign(dx) : (e.facing || 1);
        if (!e.aggro && (!groundAhead(e, dir) && e.onGround)) { dir = -dir; }
        if (e.aggro && !groundAhead(e, dir) && e.onGround && Math.abs(dx) > 40) {
          if (Math.random() < 0.05) e.vy = -560;
        }
        e.facing = dir || e.facing;
        e.vx = approach(e.vx, dir * spd, 1200 * dt);
        if (e.aggro && e.onGround && dy < -40 && Math.random() < 0.03) e.vy = -600;
      }
      e.vy += grav * dt;
      moveEntity(e, dt);
      break;
    }
    case 'charger': {
      if (e.stun > 0) {
        e.vx = approach(e.vx, 0, 1400 * dt);
      } else if (e.state === 'idle') {
        e.vx = approach(e.vx, (e.facing || 1) * 42, 500 * dt);
        if (e.onGround && !groundAhead(e, e.facing)) e.facing *= -1;
        if (d < 330 && Math.abs(dy) < 90) { e.state = 'wind'; e.t = 0; e.facing = sign(dx) || 1; }
      } else if (e.state === 'wind') {
        e.vx = approach(e.vx, 0, 2000 * dt);
        if (e.t > 0.62) {
          e.state = 'charge'; e.t = 0;
          Sound.tone({ f: 160, f2: 300, t: 0.2, type: 'sawtooth', g: 0.12 });
          spawnParts(10, cx, e.y + e.h, { col: ['#ffb46a', '#fff'], speed: 160, life: 0.4, size: 5, angle: Math.PI / 2, spread: 2 });
        }
      } else if (e.state === 'charge') {
        e.vx = e.facing * 470;
        e.keepVelOnWall = false;
        if (e.t % 0.08 < dt) spawnParts(2, cx, e.y + e.h - 6, { col: ['#ff8e3c', '#ffd45e'], speed: 90, life: 0.35, size: 4 });
        if (e.t > 1.5 || (e.onGround && !groundAhead(e, e.facing))) { e.state = 'idle'; e.t = 0; }
        e.onWallHit = () => {
          if (e.state === 'charge') {
            e.state = 'idle'; e.stun = 1.4; e.t = 0;
            Cam.kick(9); Sound.noise({ t: 0.2, g: 0.2, hp: 100, lp: 2000 });
            spawnParts(16, cx + e.facing * 20, cy, { col: ['#ffd45e', '#fff', '#ff8e3c'], speed: 240, life: 0.5, size: 5 });
            floatText(cx, e.y - 10, 'گیج شد!', '#ffe07a', 18);
          }
        };
      }
      e.vy += grav * dt;
      moveEntity(e, dt);
      break;
    }
    case 'auditor': {
      // جابه‌جایی آنی پشت سر بازیکن و بعد یک ضربه‌ی سریع
      e.facing = sign(dx) || e.facing;
      e.t2 -= dt;
      if (e.state === 'idle') {
        e.vx = approach(e.vx, clamp(dx * 1.1, -70, 70), 500 * dt);
        if (e.aggro && d < 460 && e.t2 <= 0) { e.state = 'vanish'; e.t = 0; e.t2 = 3.1; }
      } else if (e.state === 'vanish') {
        e.t += dt;
        e.vx = approach(e.vx, 0, 1200 * dt);
        if (e.t > 0.3) {
          // پشت بازیکن ظاهر شو (اگر جا نبود، جلویش)
          const side = (p.facing >= 0 ? -1 : 1);
          let nx = pcx + side * 62 - e.w / 2;
          if (nx < 20 || nx > L.w - e.w - 20) nx = pcx - side * 62 - e.w / 2;
          spawnParts(12, cx, cy, { col: ['#b79cff', '#ffffff'], speed: 220, life: 0.4, size: 5 });
          e.x = nx; e.y = p.y + p.h - e.h; e.vx = 0; e.vy = 0;
          e.facing = sign(pcx - (e.x + e.w / 2)) || e.facing;
          spawnParts(12, e.x + e.w / 2, e.y + e.h / 2, { col: ['#b79cff', '#ffffff'], speed: 220, life: 0.4, size: 5 });
          Sound.tone({ f: 540, f2: 900, t: 0.16, type: 'triangle', g: 0.07 });
          e.state = 'slash'; e.t = 0;
        }
      } else if (e.state === 'slash') {
        e.t += dt;
        e.vx = approach(e.vx, 0, 800 * dt);
        if (e.t > 0.26 && !e.didHit) {
          e.didHit = true;
          if (Math.abs(pcx - cx) < 60 && Math.abs(pcy - cy) < 56) hurtPlayer(p, e.dmg, cx);
          spawnParts(8, cx + e.facing * 26, cy, { col: ['#e6dcff', '#ffffff'], speed: 240, life: 0.3, size: 4, angle: e.facing > 0 ? 0 : Math.PI, spread: 1.0 });
          Sound.tone({ f: 820, f2: 220, t: 0.13, type: 'sawtooth', g: 0.07 });
        }
        if (e.t > 0.5) { e.state = 'idle'; e.didHit = false; }
      }
      e.vy += grav * dt;
      moveEntity(e, dt);
      break;
    }
    case 'safebox': {
      // از پهلو ضدضربه است؛ فقط ضربه‌ی کوبنده از بالا کارش را می‌سازد
      e.facing = sign(dx) || e.facing;
      if (e.state === 'idle') {
        e.vx = approach(e.vx, (Math.abs(dx) > 60 ? sign(dx) : 0) * 58, 380 * dt);
        if (!groundAhead(e, sign(e.vx) || e.facing) && e.onGround) e.vx = 0;
        e.t2 -= dt;
        if (e.aggro && d < 240 && e.t2 <= 0 && e.onGround) { e.state = 'hop'; e.t = 0; e.t2 = 2.3; e.vy = -430; e.vx = sign(dx) * 150; }
      } else if (e.state === 'hop') {
        e.t += dt;
        if (e.onGround && e.t > 0.25) {
          e.state = 'idle';
          Cam.kick(7); Sound.noise({ t: 0.22, g: 0.17, hp: 60, lp: 1500 });
          ring(cx, e.y + e.h, '#cfd6e6', 8, 320, 0.3);
          if (Math.abs(pcx - cx) < 86 && Math.abs((p.y + p.h) - (e.y + e.h)) < 54) hurtPlayer(p, e.dmg, cx);
        }
      }
      e.vy += grav * dt;
      moveEntity(e, dt);
      break;
    }
    case 'sniper': {
      // فاصله می‌گیرد و پرتابه‌ی کاغذی شلیک می‌کند
      const want = d < 230 ? -1 : (d > 380 ? 1 : 0);
      e.facing = sign(dx) || e.facing;
      e.vx = approach(e.vx, want * e.facing * 95, 700 * dt);
      if (want === 0) e.vx = approach(e.vx, 0, 900 * dt);
      if (!groundAhead(e, sign(e.vx) || e.facing)) e.vx = 0;
      e.t2 -= dt;
      if (e.aggro && d < 520 && e.t2 <= 0) { e.t2 = 2.1; e.state = 'aim'; e.shootT = 0.5; }
      if (e.state === 'aim') {
        e.shootT -= dt;
        if (e.shootT <= 0) {
          e.state = 'idle';
          const a = Math.atan2(pcy - cy - 8, pcx - cx);
          shoot(cx + e.facing * 10, cy - 4, Math.cos(a) * 330, Math.sin(a) * 330, 8, e.dmg * 0.85, 'paper');
          Sound.tone({ f: 700, f2: 300, t: 0.14, type: 'square', g: 0.06 });
        }
      }
      e.vy += grav * dt;
      moveEntity(e, dt);
      break;
    }
    case 'brute': {
      // آهسته ولی سنگین؛ با مشتِ زمین‌کوب موج‌شوک می‌سازد
      e.facing = sign(dx) || e.facing;
      if (e.state === 'idle') {
        e.vx = approach(e.vx, (Math.abs(dx) > 70 ? sign(dx) : 0) * 72, 420 * dt);
        if (!groundAhead(e, sign(e.vx) || e.facing) && e.onGround) e.vx = 0;
        e.t2 -= dt;
        if (d < 150 && e.t2 <= 0) { e.state = 'wind'; e.t = 0; e.vx = 0; e.t2 = 2.6; }
      } else if (e.state === 'wind') {
        e.vx = approach(e.vx, 0, 900 * dt);
        e.t += dt;
        if (e.t > 0.55) {
          e.state = 'smash'; e.t = 0;
          Cam.kick(12); Sound.noise({ t: 0.3, g: 0.22, hp: 50, lp: 1800 });
          ring(cx, e.y + e.h, '#ff9a4a', 10, 540, 0.4);
          spawnParts(18, cx, e.y + e.h, { col: ['#ff9a4a', '#ffd27a', '#6a2a12'], speed: 300, life: 0.5, size: 6, angle: -Math.PI / 2, spread: 2.6 });
          if (Math.abs(pcx - cx) < 130 && Math.abs((p.y + p.h) - (e.y + e.h)) < 70) hurtPlayer(p, e.dmg, cx);
        }
      } else if (e.state === 'smash') {
        e.t += dt;
        if (e.t > 0.45) e.state = 'idle';
      }
      e.vy += grav * dt;
      moveEntity(e, dt);
      break;
    }
    case 'flyer': {
      const targetY = p.y - 70 + Math.sin(e.anim * 1.6) * 34;
      const targetX = pcx - sign(dx) * 170;
      e.vx = approach(e.vx, clamp((targetX - cx) * 2.2, -150, 150), 420 * dt);
      e.vy = approach(e.vy, clamp((targetY - cy) * 2.4, -170, 170), 420 * dt);
      e.facing = sign(dx) || e.facing;
      e.x += e.vx * dt; e.y += e.vy * dt;
      e.t2 -= dt;
      if (d < 420 && e.t2 <= 0) {
        e.t2 = 2.4;
        e.state = 'shoot'; e.shootT = 0.45;
      }
      if (e.state === 'shoot') {
        e.shootT -= dt;
        if (e.shootT <= 0) {
          e.state = 'idle';
          const a = Math.atan2(pcy - cy, pcx - cx);
          shoot(cx, cy, Math.cos(a) * 270, Math.sin(a) * 270, 9, e.dmg * 0.8, 'fire');
          Sound.tone({ f: 420, f2: 160, t: 0.18, type: 'sawtooth', g: 0.08 });
        }
      }
      break;
    }
    case 'bomber': {
      const a = Math.atan2(dy, dx);
      const spd = e.fuse > 0 ? 40 : 128;
      e.vx = approach(e.vx, Math.cos(a) * spd, 300 * dt);
      e.vy = approach(e.vy, Math.sin(a) * spd + Math.sin(e.anim * 5) * 26, 300 * dt);
      e.facing = sign(dx) || e.facing;
      e.x += e.vx * dt; e.y += e.vy * dt;
      if (d < 64 && e.fuse === 0) { e.fuse = 0.001; Sound.tone({ f: 900, t: 0.08, type: 'square', g: 0.08 }); }
      if (e.fuse > 0) {
        e.fuse += dt;
        if (e.fuse > 0.75) {
          // انفجار
          ring(cx, cy, '#ff8e3c', 10, 900, 0.35);
          spawnParts(30, cx, cy, { col: ['#ff6b2a', '#ffd45e', '#2a0a10'], speed: 340, life: 0.6, size: 6 });
          Cam.kick(12);
          Sound.noise({ t: 0.35, g: 0.28, hp: 60, lp: 2600 });
          if (dist(cx, cy, pcx, pcy) < 92) hurtPlayer(p, e.dmg, cx, { fire: true });
          e.hp = 0; e.dead = true; e.deadT = 0; e.exploded = true;
          RUN.score += 20;
        }
      }
      break;
    }
    case 'shielder': {
      if (e.stun > 0) { e.vx = approach(e.vx, 0, 900 * dt); }
      else {
        const dir = sign(dx) || e.facing;
        if (d > 70) { e.facing = dir; e.vx = approach(e.vx, dir * 74, 700 * dt); }
        else {
          e.vx = approach(e.vx, 0, 900 * dt);
          e.t2 -= dt;
          if (e.t2 <= 0) {
            e.t2 = 1.9; e.state = 'shove'; e.shoveT = 0.35;
          }
        }
        if (e.state === 'shove') {
          e.shoveT -= dt;
          if (e.shoveT <= 0) {
            e.state = 'idle';
            if (dist(cx, cy, pcx, pcy) < 86) hurtPlayer(p, e.dmg, cx);
            spawnParts(10, cx + e.facing * 26, cy, { col: ['#fff', '#cfd6e6'], speed: 200, life: 0.3, size: 4, angle: e.facing > 0 ? 0 : Math.PI, spread: 1.2 });
            Sound.noise({ t: 0.12, g: 0.14, hp: 300, lp: 4000 });
          }
        }
      }
      e.vy += grav * dt;
      moveEntity(e, dt);
      break;
    }
  }

  // سقوط در گودال گدازه
  if (e.y > L.h + 160 && !e.dead) {
    e.hp = 0; defeatEnemy(e, 1);
    return;
  }
  // آسیب تماسی
  if (e.type !== 'dummy' && e.type !== 'bomber' && !e.dead && e.stun <= 0) {
    if (aabb(rectOf(e), rectOf(p))) hurtPlayer(p, e.dmg, cx);
  }
  if (e.type === 'bomber' && !e.dead && aabb(rectOf(e), rectOf(p)) && e.fuse === 0) e.fuse = 0.4;
}

/* ---------------- پرتابه‌ها ---------------- */
function shoot(x, y, vx, vy, r, dmg, kind, friendly = false) {
  PROJ.push({ x, y, vx, vy, r, dmg, kind, friendly, life: 0, max: 4, grav: kind === 'skewer' ? 420 : (kind === 'paper' ? 120 : 0), spin: Math.random() * TAU });
}
function updateProjectiles(dt, p) {
  for (let i = PROJ.length - 1; i >= 0; i--) {
    const pr = PROJ[i];
    pr.life += dt;
    pr.vy += pr.grav * dt;
    pr.x += pr.vx * dt; pr.y += pr.vy * dt;
    pr.spin += dt * 10;
    if (pr.kind === 'orb' && pr.homing && pr.life < 1.6) {
      const a = Math.atan2(p.y + p.h / 2 - pr.y, p.x + p.w / 2 - pr.x);
      const sp = Math.hypot(pr.vx, pr.vy);
      pr.vx = lerp(pr.vx, Math.cos(a) * sp, 2.2 * dt);
      pr.vy = lerp(pr.vy, Math.sin(a) * sp, 2.2 * dt);
    }
    if (pr.life > pr.max || pr.x < -80 || pr.x > L.w + 80 || pr.y > L.h + 200 || pr.y < -300) { PROJ.splice(i, 1); continue; }
    // برخورد با زمین
    let blocked = false;
    forEachSolid(s => {
      if (pr.x > s.x && pr.x < s.x + s.w && pr.y > s.y && pr.y < s.y + s.h) blocked = true;
    });
    if (blocked) {
      spawnParts(8, pr.x, pr.y, { col: ['#ff8e3c', '#ffd45e'], speed: 140, life: 0.35, size: 4 });
      PROJ.splice(i, 1); continue;
    }
    if (!pr.friendly && aabb({ x: pr.x - pr.r, y: pr.y - pr.r, w: pr.r * 2, h: pr.r * 2 }, rectOf(p))) {
      hurtPlayer(p, pr.dmg, pr.x, { fire: pr.kind !== 'paper' });
      spawnParts(10, pr.x, pr.y, { col: ['#ff8e3c', '#fff'], speed: 180, life: 0.4, size: 4 });
      PROJ.splice(i, 1);
    }
  }
}
function drawProjectiles(c) {
  for (const pr of PROJ) {
    if (pr.kind === 'fire' || pr.kind === 'orb') {
      glow(c, pr.x, pr.y, pr.r * 3.4, pr.kind === 'orb' ? 'rgba(190,120,255,.8)' : 'rgba(255,140,50,.85)', 0.6);
      circle(c, pr.x, pr.y, pr.r, pr.kind === 'orb' ? '#e3c6ff' : '#ffe08a');
      circle(c, pr.x - pr.vx * 0.012, pr.y - pr.vy * 0.012, pr.r * 0.7, pr.kind === 'orb' ? '#b57aff' : '#ff8e3c');
    } else if (pr.kind === 'paper') {
      c.save(); c.translate(pr.x, pr.y); c.rotate(pr.spin);
      fillRR(c, -10, -13, 20, 26, 2, '#fdf6e3');
      c.fillStyle = '#9aa3b2';
      for (let i = 0; i < 4; i++) c.fillRect(-7, -9 + i * 6, 14, 2);
      c.fillStyle = '#d9534f'; c.beginPath(); c.arc(4, 8, 4, 0, TAU); c.fill();
      c.restore();
    } else if (pr.kind === 'skewer') {
      c.save(); c.translate(pr.x, pr.y); c.rotate(Math.atan2(pr.vy, pr.vx));
      c.fillStyle = '#c9c9d4'; c.fillRect(-22, -2, 44, 4);
      c.fillStyle = '#8a4b2a';
      for (let i = -1; i <= 1; i++) { c.beginPath(); c.arc(i * 12, 0, 7, 0, TAU); c.fill(); }
      glow(c, 0, 0, 24, 'rgba(255,120,40,.7)', 0.5);
      c.restore();
    } else if (pr.kind === 'wave') {
      c.save(); c.translate(pr.x, pr.y);
      c.scale(sign(pr.vx) || 1, 1);
      glow(c, 0, 0, 40, 'rgba(255,150,50,.8)', 0.6);
      const g = c.createLinearGradient(0, -26, 0, 14);
      g.addColorStop(0, 'rgba(255,230,140,.2)'); g.addColorStop(0.5, '#ffb347'); g.addColorStop(1, '#ff5e1f');
      c.fillStyle = g;
      c.beginPath();
      c.moveTo(-16, 14);
      c.quadraticCurveTo(-4, -10 + Math.sin(timeNow * 24) * 3, 4, -26);
      c.quadraticCurveTo(10, -8, 18, 14);
      c.closePath(); c.fill();
      c.restore();
    } else if (pr.kind === 'meteor') {
      c.save(); c.translate(pr.x, pr.y); c.rotate(pr.spin * 0.4);
      glow(c, 0, 0, 32, 'rgba(255,120,40,.85)', 0.7);
      c.fillStyle = '#ffb347';
      c.beginPath();
      c.moveTo(-pr.r * 0.8, -pr.r * 2.4); c.lineTo(pr.r * 0.8, -pr.r * 2.4); c.lineTo(0, 0);
      c.closePath(); c.fill();
      circle(c, 0, 0, pr.r, '#5a2a1a');
      circle(c, -3, -3, pr.r * 0.4, '#8a4b2a');
      c.restore();
    } else if (pr.kind === 'pepper') {
      c.save(); c.translate(pr.x, pr.y); c.rotate(Math.sin(pr.spin * 0.3) * 0.5 + 0.3);
      glow(c, 0, 0, 20, 'rgba(255,60,40,.6)', 0.5);
      c.fillStyle = '#d61f1f';
      c.beginPath();
      c.moveTo(0, -10); c.quadraticCurveTo(8, 0, 2, 14); c.quadraticCurveTo(-4, 2, 0, -10);
      c.fill();
      c.strokeStyle = '#3f8c3f'; c.lineWidth = 3; c.lineCap = 'round';
      c.beginPath(); c.moveTo(0, -10); c.lineTo(-5, -16); c.stroke();
      c.restore();
    }
  }
}

/* ---------------- ترسیم دشمنان ---------------- */
function drawEnemy(c, e) {
  if (e.dead) {
    if (e.isBoss) return;

    ell(c, 0, -17 + bob, 11, 12, C('#d0392f'));

    c.beginPath(); c.moveTo(9, -24 + bob); c.lineTo(12, -34 + bob); c.lineTo(4, -26 + bob); c.fill();

    c.beginPath(); c.ellipse(4, -19 + bob, 3, 3.6, 0, 0, TAU); c.fill();
    c.fillStyle = '#2a0a10';
    c.beginPath(); c.arc(-3.6, -19 + bob, 1.4, 0, TAU); c.fill();
    c.beginPath(); c.arc(4.4, -19 + bob, 1.4, 0, TAU); c.fill();
    c.strokeStyle = '#3a0d0d'; c.lineWidth = 1.6;
    c.beginPath(); c.arc(0, -13 + bob, 4.5, 0.1 * Math.PI, 0.9 * Math.PI); c.stroke();

    c.beginPath(); c.moveTo(10, -22 + bob); c.lineTo(15, -2); c.stroke();

  }

  else if (e.type === 'charger') {
    const wind = e.state === 'wind';
    const shake = wind ? (Math.random() - 0.5) * 4 : 0;
    c.translate(shake, 0);
    // پاها
    const legs = e.state === 'charge' ? Math.sin(e.anim * 30) * 6 : Math.sin(e.anim * 8) * 2;
    fillRR(c, -16 + legs, -12, 9, 13, 4, C('#5d1414'));
    fillRR(c, 8 - legs, -12, 9, 13, 4, C('#5d1414'));
    // بدن
    ell(c, 0, -26 + bob, 22, 17, C(wind ? '#e04b2a' : '#9e2a1e'));
    // شکم
    ell(c, 2, -21 + bob, 14, 10, C('#c0563c'));
    // سر
    ell(c, 15, -34 + bob, 12, 10, C('#8a2318'));
    c.fillStyle = C('#efe3c8');
    c.beginPath(); c.moveTo(16, -42 + bob); c.lineTo(26, -52 + bob); c.lineTo(28, -40 + bob); c.fill();
    c.beginPath(); c.moveTo(10, -42 + bob); c.lineTo(4, -54 + bob); c.lineTo(14, -44 + bob); c.fill();
    c.fillStyle = e.stun > 0 ? '#fff' : (wind ? '#fff3a0' : '#ffd45e');
    c.beginPath(); c.arc(20, -36 + bob, 2.6, 0, TAU); c.fill();
    if (e.stun > 0) {
      for (let i = 0; i < 3; i++) {
        const a = e.anim * 6 + i * 2.1;

      }

  else if (e.type === 'flyer') {

    // جمجمه
    ell(c, 0, -16, 14, 13, C('#efe6d2'));
    fillRR(c, -8, -8, 16, 7, 3, C('#efe6d2'));
    c.fillStyle = '#2a0a10';
    c.beginPath(); c.ellipse(-5, -18, 4, 4.6, 0, 0, TAU); c.fill();

    c.fillStyle = '#2a0a10';
    for (let i = -1; i <= 1; i++) c.fillRect(-2 + i * 4, -6, 2.6, 4);

    c.beginPath(); c.moveTo(6, -18); c.quadraticCurveTo(24, -26 + flap, 26, -12); c.quadraticCurveTo(16, -14, 6, -12); c.fill();
    circle(c, 0, -16, 12, C(blink));

    if (e.fuse > 0) { glow(c, 3, -39, 14, 'rgba(255,200,80,.9)', 0.8); circle(c, 3, -39, 3, '#fff3a0'); }

  else if (e.type === 'shielder') {

    ell(c, 0, -46 + bob, 11, 10, C('#7d4761'));
    c.fillStyle = '#ffd45e';
    c.beginPath(); c.arc(-4, -47 + bob, 2.4, 0, TAU); c.fill();
    c.beginPath(); c.arc(4, -47 + bob, 2.4, 0, TAU); c.fill();
    c.fillStyle = C('#5a2f43');
    c.beginPath(); c.moveTo(-10, -54 + bob); c.lineTo(-13, -62 + bob); c.lineTo(-5, -56 + bob); c.fill();
    c.beginPath(); c.moveTo(10, -54 + bob); c.lineTo(13, -62 + bob); c.lineTo(5, -56 + bob); c.fill();
    // سینی چای به‌عنوان سپر
    const push = e.state === 'shove' ? (0.35 - e.shoveT) * 60 : 0;
    c.save();
    c.translate(17 + push, -30 + bob);
    c.rotate(0.1);
    ell(c, 0, 0, 7, 26, C('#cfd6e6'));
    ell(c, -1, 0, 5, 22, C('#9aa3b2'));
    // استکان چای روی سینی

    c.fillStyle = '#f3f3f7';
    c.beginPath(); c.moveTo(-4, -6); c.lineTo(4, -6); c.lineTo(2.5, 6); c.lineTo(-2.5, 6); c.closePath(); c.fill();
    c.fillStyle = '#9b5a28'; c.fillRect(-3.2, -3, 6.4, 8);
    c.restore();
    c.restore();
  }

  else if (e.type === 'sniper') {
    // کارمند لاغر با زونکن و تفنگِ منگنه
    const aim = e.state === 'aim';
    const legs = Math.sin(e.anim * 9) * (Math.abs(e.vx) > 15 ? 3 : 0);

    ell(c, 1, -50 + bob, 10, 9, C('#c9a07a'));         // سر

    c.beginPath(); c.arc(-1, -51 + bob, 1.4, 0, TAU); c.fill();
    c.beginPath(); c.arc(5, -51 + bob, 1.4, 0, TAU); c.fill();
    // عینک
    c.strokeStyle = C('#2a2030'); c.lineWidth = 1.2;

    // تفنگِ منگنه

    c.restore();
  }
