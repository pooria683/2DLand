<script>
/* ===== پچ سایت: سیو در مرورگر + تمام‌صفحه + تطبیق خودکار با iframe ===== */
try { localStorage.setItem('behesht_filesave', 'false'); } catch (e) {}
(function () {
  /* --- ۱) تطبیق کامل با iframe/تمام‌صفحه --- */
  function fitFrame() {
    var g = document.getElementById('game');
    if (!g) return;
    var vw = window.innerWidth, vh = window.innerHeight;
    var portrait = vh > vw * 1.08;
    var w, h;
    if (portrait) {
      /* عمودی: بوم ۱۶:۹ کامل به بالا می‌چسبد، زیرش فضای کنترل */
      w = vw; h = Math.round(vw * 9 / 16);
    } else {
      /* افقی/دسکتاپ: بزرگ‌ترین مستطیلِ ۱۶:۹ که جا می‌شود */
      w = Math.min(vw, Math.round(vh * 16 / 9));
      h = Math.round(w * 9 / 16);
    }
    g.style.width = w + 'px';
    g.style.height = portrait ? vh + 'px' : h + 'px';
    g.style.fontSize = (w / 960 * 16) + 'px';
  }
  window.addEventListener('resize', fitFrame);
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', fitFrame);
  else fitFrame();

  /* --- ۲) دکمه‌ی تمام‌صفحه داخل بازی + کلید F --- */
  var css = document.createElement('style');
  css.textContent = '#fsBtn{position:absolute;bottom:.6em;right:.6em;z-index:60;width:2.4em;height:2.4em;border-radius:.6em;font-size:1em;line-height:1;background:rgba(14,7,24,.72);border:.1em solid rgba(255,212,94,.55);color:#ffe9b8;cursor:pointer;font-family:inherit;padding:0}#fsBtn:hover{background:rgba(255,212,94,.85);color:#2a1206}body.is-touch #fsBtn{display:none}';
  document.head.appendChild(css);
  function toggleFS() {
    try {
      if (document.fullscreenElement || document.webkitFullscreenElement) {
        (document.exitFullscreen || document.webkitExitFullscreen).call(document);
      } else {
        var el = document.documentElement;
        var req = el.requestFullscreen || el.webkitRequestFullscreen;
        if (req) req.call(el);
      }
    } catch (e) {}
  }
  function addBtn() {
    var g = document.getElementById('game');
    if (!g || document.getElementById('fsBtn')) return;
    var b = document.createElement('button');
    b.id = 'fsBtn'; b.type = 'button'; b.textContent = '⛶';
    b.title = 'تمام‌صفحه (کلید F)';
    b.addEventListener('click', function (e) { e.stopPropagation(); toggleFS(); });
    g.appendChild(b);
  }
  function onFSC() {
    var b = document.getElementById('fsBtn');
    if (b) b.textContent = (document.fullscreenElement || document.webkitFullscreenElement) ? '⤡' : '⛶';
    try { window.dispatchEvent(new Event('resize')); } catch (e) {}
  }
  document.addEventListener('fullscreenchange', onFSC);
  document.addEventListener('webkitfullscreenchange', onFSC);
  window.addEventListener('keydown', function (e) {
    if (e.code === 'KeyF' && !e.ctrlKey && !e.metaKey && !e.altKey) {
      var t = (e.target && e.target.tagName) || '';
      if (t !== 'INPUT' && t !== 'TEXTAREA') { e.preventDefault(); toggleFS(); }
    }
  });
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', addBtn);
  else addBtn();
})();
</script>
