        <b>جابه‌جایی:</b> دکمه‌ی زیر را بزن، بعد هر دسته‌ی دکمه را با انگشت (یا موس) بکش و هرجا خواستی بگذار.
        ${moved ? ' — الان جای دست‌سازِ خودت ذخیره شده است.' : ''}
      </div>
      <button class="btn ghost" data-action="tsetEdit">${touchEditOn() ? '✓ تمام شد' : '✥ جابه‌جایی دکمه‌ها'}</button>
      <button class="btn ghost small" data-action="tsetReset">بازگشت به چیدمان پیش‌فرض</button>
      <button class="btn" data-action="tsetDone">بازگشت</button>
    </div>`, 'touchset');
  wireTouchSettings();
}

/* اسلایدرها data-action ندارند، پس دستی وصل می‌شوند */
function wireTouchSettings() {
  const sc = document.getElementById('tsetScale'), al = document.getElementById('tsetAlpha');
  const pct = v => faNum(Math.round(v * 100)) + '٪';
  if (sc) sc.addEventListener('input', () => {
    TCFG.scale = +sc.value / 100;
    document.getElementById('tsetScaleV').textContent = pct(TCFG.scale);
    applyTouchCfg(); saveTouchCfg();
  });
  if (al) al.addEventListener('input', () => {
    TCFG.alpha = +al.value / 100;
    document.getElementById('tsetAlphaV').textContent = pct(TCFG.alpha);
    applyTouchCfg(); saveTouchCfg();
  });
}

function doAction(a, arg) {
  switch (a) {
    case 'start': hideOverlay(); startRun(); break;
    case 'help': showHelp('menu'); break;
    case 'levelSelect': showLevelSelect('menu'); break;
    case 'worldMap': showMap(Math.max(1, maxLevelReached() || 1)); break;
    case 'mapFrom': showMap(+arg); break;
    case 'levelSelect2': showLevelSelect('pause'); break;
    case 'playLevel': startLevelFromMenu(+arg); break;
    case 'help2': showHelp('pause'); break;
    case 'story': showStoryInfo(); break;
    case 'menu': hideOverlay(); showMenu(); break;
    case 'pause': if (GAMESTATE === 'play') pauseGame(); else showPauseMenu(); break;
    case 'resume': hideOverlay(); GAMESTATE = 'play'; break;
    case 'togglePixel':
      PIXEL_ART = !PIXEL_ART;
      Store.set('pixelart', PIXEL_ART ? '1' : '0');
      resize();
      toast('ظاهرِ پیکسلی ' + (PIXEL_ART ? 'روشن' : 'خاموش') + ' شد', 1.8);
      showPauseMenu();
      break;
    case 'restart': hideOverlay(); startLevel(RUN.level, false, false, true); break;
    case 'retry': hideOverlay(); startLevel(RUN.level, false, false, true); break;
    case 'afterLevelMap': {
      // روح از سالنِ تمام‌شده تا سالنِ بعدی روی نقشه راه می‌رود
      const from = RUN.level, to = Math.min(RUN.level + 1, FINAL_LEVEL);
      noteLevelReached(to);
      hideOverlay();
      fadeTo(() => showMap(to, from));
      break;
    }
    case 'afterLevel':
    case 'afterLevelTown': {
      RUN.wantTown = (a === 'afterLevelTown');
      hideOverlay();
      if (isBossLevel(RUN.level)) fadeTo(() => (RUN.wantTown ? enterTown() : startLevel(RUN.level + 1)));
      else { GAMESTATE = 'perk'; showPerkChoice(); }
      break;
    }
    case 'pickPerk': {
      const p = RUN.perkChoices[+arg];
      if (p) { applyPerk(p); toast('گرفتی: ' + p.name); saveGame(RUN.level + 1, carryHp(PLAYER.hp, PLAYER.maxHp)); }
      hideOverlay();
      // بارِ اول اجباری است تا بازیکن سیستمِ خرید و فروش را یاد بگیرد
      const firstTime = !RUN.townVisits && RUN.level >= 1;
      if (RUN.wantTown || firstTime) { RUN.wantTown = false; fadeTo(() => enterTown()); }
      else fadeTo(() => startLevel(RUN.level + 1));
      break;
    }
    case 'nextLevel': hideOverlay(); fadeTo(() => startLevel(RUN.level + 1)); break;
    case 'continue': loadGame(); break;
    case 'loadFile': pickSaveFile(); break;
    case 'saveFile': {
      const d = saveGame() || getSave();
      const name = exportSaveFile(d);
      if (name) toast('💾 ذخیره شد: ' + name, 3.5);
      break;
    }
    case 'touchSettings': showTouchSettings(GAMESTATE === 'pause' ? 'pause' : 'menu'); break;
    case 'tsetOn':
    case 'tsetOff': {
      const want = (a === 'tsetOn');
      Store.set('touchui', want ? 'on' : 'off');
      applyTouchUI(want);
      if (!want) setTouchEdit(false);
      showTouchSettings();
      break;
    }
    case 'tsetHandR':
    case 'tsetHandL':
      TCFG.hand = (a === 'tsetHandL') ? 'l' : 'r';
      saveTouchCfg(); applyTouchCfg(); showTouchSettings();
      break;
    case 'tsetVibeOn':
    case 'tsetVibeOff':
      TCFG.vibe = (a === 'tsetVibeOn');
      saveTouchCfg(); applyTouchCfg(); showTouchSettings();
      if (TCFG.vibe && navigator.vibrate) navigator.vibrate(18);
      break;
    case 'tsetEdit':
      if (!TOUCH.on) { Store.set('touchui', 'on'); applyTouchUI(true); }
      setTouchEdit(!touchEditOn());
      showTouchSettings();
      toast(touchEditOn() ? '✥ حالا هر دسته را بکش و جابه‌جا کن.' : 'چیدمان ذخیره شد.', 3);
      break;
    case 'tsetReset':
      setTouchEdit(false); resetTouchCfg(); showTouchSettings();
      toast('چیدمان به حالت اولیه برگشت.', 2.5);
      break;
    case 'tsetDone':
      setTouchEdit(false);
      if (touchSetBack === 'pause') showPauseMenu(); else showMenu();
      break;
    case 'toggleTouch': {
      const want = !TOUCH.on;
      Store.set('touchui', want ? 'on' : 'off');
      applyTouchUI(want);
      if (GAMESTATE === 'pause') showPauseMenu(); else if (GAMESTATE === 'menu') showMenu();
      toast(want ? '📱 دکمه‌های لمسی روی صفحه آمد.' : 'دکمه‌های لمسی برداشته شد — کیبورد سر جایش است.', 3);
      break;
    }
    case 'toggleFileSave':
      Store.set('filesave', !fileSaveOn());
      showMenu();
      toast(fileSaveOn() ? 'بعد از هر مرحله یک فایل سیو ساخته می‌شود.' : 'ساخت خودکار فایل خاموش شد.', 3);
      break;
    case 'closeShop': hideOverlay(); GAMESTATE = 'play'; break;
    case 'buySmith': {
      const it = SMITH[+arg]; if (!it) break;
      const price = smithPrice(it);
      if ((RUN.coins || 0) < price) { Sound.blip(220); toast('سکه کم داری — ' + faNum(price - RUN.coins) + ' تا کم است.', 2.4); break; }
      RUN.coins -= price;
      RUN.shopBuys[it.id] = (RUN.shopBuys[it.id] || 0) + 1;
      it.apply(RUN.stats);
      clampStats(RUN.stats);
      PLAYER.maxHp = RUN.stats.maxHp;
      if (it.id === 'hp') PLAYER.hp = Math.min(PLAYER.maxHp, PLAYER.hp + 25);
      Sound.win(); toast('خریدی: ' + it.name, 2.2);
      saveGame(RUN.level + 1, PLAYER.hp);
      reopenShop();
      break;
    }
    case 'buyTea': {
      const it = (RUN._teaItems || [])[+arg]; if (!it || it.off) break;
      if ((RUN.coins || 0) < it.price) { Sound.blip(220); toast('سکه کم داری.', 2); break; }
      RUN.coins -= it.price;
      if (it.k === 'heal') { PLAYER.hp = PLAYER.maxHp; toast('جانت پر شد!', 2); }
      else if (it.k === 'maxhp') { RUN.stats.maxHp += 40; PLAYER.maxHp = RUN.stats.maxHp; PLAYER.hp = PLAYER.maxHp; toast('حداکثر جان +۴۰', 2); }
      else { RUN.gems = (RUN.gems || 0) + 3; toast('۳ قیراط گرفتی.', 2); }
      Sound.win();
      saveGame(RUN.level + 1, PLAYER.hp);
      reopenShop();
      break;
    }
    case 'sellLoot': {
      const it = lootById(arg); if (!it) break;
      if (!RUN.loot[arg]) break;
      RUN.loot[arg]--;
      if (!RUN.loot[arg]) delete RUN.loot[arg];
      RUN.coins += it.price;
      Sound.pickup(); toast('فروختی: ' + it.name + ' (+' + faNum(it.price) + ' سکه)', 2.4);
      saveGame(RUN.level + 1, PLAYER.hp);
      reopenShop();
      break;
    }
    case 'sellAllLoot': {
      let total = 0;
      for (const [id, n] of Object.entries(RUN.loot || {})) {
        const it = lootById(id); if (!it) continue;
        total += it.price * n;
      }
      if (!total) break;
      RUN.loot = {}; RUN.coins += total;
      Sound.win(); toast('همه را فروختی: +' + faNum(total) + ' سکه', 3);
      saveGame(RUN.level + 1, PLAYER.hp);
      reopenShop();
      break;
    }
    case 'buyPower': {
      const pw = powerById(arg); if (!pw) break;
      if ((RUN.gems || 0) < pw.cost) { Sound.blip(220); toast('جواهر کم داری — ' + faNum(pw.cost - (RUN.gems || 0)) + ' قیراط کم است.', 2.6); break; }
      RUN.gems -= pw.cost;
      RUN.powers = RUN.powers || [];
      RUN.powers.push(pw.id);
      RUN.power = pw.id; RUN.powerCd = 0;
      Sound.boss(); toast('قدرت ویژه: ' + pw.name + ' — با کلید K بزن!', 4);
      saveGame(RUN.level + 1, PLAYER.hp);
      reopenShop();
      break;
    }
    case 'equipPower': {
      const pw = powerById(arg); if (!pw) break;
      RUN.power = pw.id; RUN.powerCd = 0;
      Sound.ui(); toast('فعال شد: ' + pw.name, 2);
      saveGame(RUN.level + 1, PLAYER.hp);
      reopenShop();
      break;
    }
    case 'tunePower': {
      const pw = RUN.power ? powerById(RUN.power) : null;
      if (!pw) { Sound.blip(220); toast('اول یک قدرت ویژه بخر و فعالش کن.', 2.4); break; }
      const n = RUN.powerTune[pw.id] || 0;
      const price = 9 + n * 5;
      if (n >= 6) { Sound.blip(220); toast('این یکی تا تهش تند شده. قانون است.', 2.4); break; }
      if ((RUN.gems || 0) < price) { Sound.blip(220); toast('جواهر کم داری — ' + faNum(price - (RUN.gems || 0)) + ' قیراط کم است.', 2.6); break; }
      RUN.gems -= price;
      RUN.powerTune[pw.id] = n + 1;
      Sound.win(); toast(pw.name + ': انتظار شد ' + faNum(Math.round(powerCdOf(pw))) + ' ثانیه.', 2.8);
      saveGame(RUN.level + 1, PLAYER.hp);
      reopenShop();
      break;
    }
    case 'gemToCoin': {
      if ((RUN.gems || 0) < 5) { Sound.blip(220); toast('دست‌کم ۵ قیراط لازم است.', 2); break; }
      RUN.gems -= 5; RUN.coins += 60;
      Sound.pickup(); toast('۵ قیراط شد ۶۰ سکه.', 2.2);
      saveGame(RUN.level + 1, PLAYER.hp);
      reopenShop();
      break;
    }
    case 'enterTown': hideOverlay(); fadeTo(() => enterTown()); break;
    case 'arena': hideOverlay(); fadeTo(() => startArena()); break;
    case 'arenaNext': hideOverlay(); GAMESTATE = 'play'; nextWave(); break;
    case 'arenaRestart': hideOverlay(); fadeTo(() => startArena()); break;
    case 'arenaTown':
      hideOverlay();
      RUN.fromArena = true;
      fadeTo(() => enterTown());
      break;
    case 'toggleSound': Sound.setMuted(!Sound.muted); showPauseMenu(); break;
    case 'toggleMusic': Sound.setMusic(!Sound.musicOn); showPauseMenu(); break;
  }
}

/* محو شدن بین مراحل */
function fadeTo(cb) {
  fadeDir = 1; fadeT = 0; fadeCb = cb;
}
function updateFade(dt) {
  if (fadeDir === 1) {
    fadeT += dt * 2.4;
    if (fadeT >= 1) { fadeT = 1; fadeDir = -1; if (fadeCb) { const f = fadeCb; fadeCb = null; f(); } }
  } else if (fadeDir === -1) {
    fadeT -= dt * 2;
    if (fadeT <= 0) { fadeT = 0; fadeDir = 0; }
  }
}

/* ---------------- حلقه‌ی بازی ---------------- */
function updatePlay(dt) {
  if (IN.pause) { pauseGame(); return; }
  RUN.levelTime += dt;
  RUN.comboT -= dt;
  if (RUN.comboT <= 0) RUN.combo = 0;

  // قدرت ویژه
  if (RUN.powerCd > 0) RUN.powerCd = Math.max(0, RUN.powerCd - dt);
  if (hit('KeyK') || hit('KeyE')) usePower();
  if (SLOWMO > 0) SLOWMO = Math.max(0, SLOWMO - dt);
  if (PLAYER.aegisT > 0) PLAYER.aegisT -= dt;
  // دشمنان و پرتابه‌ها در «وقتِ اداری» کُند می‌شوند؛ بازیکن نه
  const edt = SLOWMO > 0 ? dt * 0.35 : dt;

  const dmgBefore = RUN.damageTaken;
  updateWorld(edt);
  updateTempHazards(edt);
  updatePlayer(PLAYER, dt);

  if (L.town) { updateTown(dt); Cam.follow(PLAYER, dt, L); updateTutorial(); return; }

  for (let i = ENEMIES.length - 1; i >= 0; i--) {
    const e = ENEMIES[i];
    if (e.slamCd > 0) e.slamCd = Math.max(0, e.slamCd - dt);
    if (e.update) e.update(e, edt, PLAYER);
    else updateEnemy(e, edt, PLAYER);
    if (e.isBoss && !e.dead && e.hp <= 0) bossDie(e);
    if (e.dead && !e.isBoss) ENEMIES.splice(i, 1);
  }
  updateProjectiles(edt, PLAYER);
  updatePickups(dt, PLAYER);
  updateAngelSweep(dt);
  RUN.levelDamage = (RUN.levelDamage || 0) + (RUN.damageTaken - dmgBefore);

  if (ANGEL && ANGEL.visible) {
    ANGEL.t += dt;
    const tx = PLAYER.x + 110, ty = PLAYER.y - 70;
    ANGEL.x = lerp(ANGEL.x, tx, 1 - Math.pow(0.02, dt));
    ANGEL.y = lerp(ANGEL.y, ty, 1 - Math.pow(0.05, dt));
  }

  if (L.arena) { updateArena(dt); updateTutorial(); Cam.follow(PLAYER, dt, L); return; }

  // باز شدن در
  const remaining = ENEMIES.filter(e => !e.dead && !e.isBoss && e.type !== 'dummy').length;
  const dummies = ENEMIES.filter(e => !e.dead && e.type === 'dummy').length;
  if (!L.isBoss && !L.exit.open && remaining === 0 && dummies === 0) {
    L.exit.open = true;
    toast('در باز شد! برو سمت نور →', 3);
    Sound.tone({ f: 520, f2: 1040, t: 0.5, type: 'triangle', g: 0.14 });
  }
  if (L.exit.open && aabb(rectOf(PLAYER), L.exit)) completeLevel();

  updateTutorial();
  Cam.follow(PLAYER, dt, L);
}

function tick(dt) {
  timeNow += dt;
  updateToast(dt); updateTip(dt); updateFade(dt);
  if (hitstop > 0) { hitstop -= dt; updateParts(dt); return; }

  if (hit('KeyM')) { Sound.setMuted(!Sound.muted); toast(Sound.muted ? 'صدا خاموش شد' : 'صدا روشن شد', 1.2); }
  if (GAMESTATE === 'play') levelTitleT = Math.max(0, levelTitleT - dt);
  if (GAMESTATE === 'play') worldBannerT = Math.max(0, worldBannerT - dt);
  if (RUN && RUN.lootRushT > 0) RUN.lootRushT = Math.max(0, RUN.lootRushT - dt);
  $('game').classList.toggle('titlecard', levelTitleT > 0);
  $('game').classList.toggle('lootrush', !!(RUN && RUN.lootRushT > 0));

  switch (GAMESTATE) {
    case 'pause':
      overlayInput();
      if (IN.pause) {
        if (UI.overlay.classList.contains('ov-help')) showPauseMenu();
        else { hideOverlay(); GAMESTATE = 'play'; }
      }
      updateWorld(dt);
      break;
    case 'map':
      updateMap(dt);
      break;
    case 'menu':
      overlayInput(); updateWorld(dt);
      if (IN.pause && UI.overlay.classList.contains('ov-help')) showMenu();
      if (PLAYER) { PLAYER.anim += dt; PLAYER.idleT += dt; updatePlayerIdle(dt); }
      if (ANGEL) ANGEL.t += dt;
      break;
    case 'story':
      Dlg.update(dt);
      if (ANGEL) ANGEL.t += dt;
      updateWorld(dt);
      if (PLAYER) { PLAYER.anim += dt; PLAYER.vx = approach(PLAYER.vx, 0, 2000 * dt); updatePlayerIdle(dt); }
      break;
    case 'play': updatePlay(dt); break;
    case 'shop':
      overlayInput(); updateWorld(dt);
      if (IN.pause) { hideOverlay(); GAMESTATE = 'play'; }
      if (PLAYER) { PLAYER.anim += dt; PLAYER.vx = approach(PLAYER.vx, 0, 2000 * dt); updatePlayerIdle(dt); }
      break;
    default: overlayInput(); updateWorld(dt); break;
  }
  updateParts(dt);
  updateView(dt);
}

/* انتظارِ واقعیِ یک قدرت، بعد از ارتقاهای کارگاه (هر قدرت جداگانه) */
function powerCdOf(pw) {
  const n = (RUN.powerTune && RUN.powerTune[pw.id]) || 0;
  return pw.cd * Math.pow(0.9, n);
}

/* ================= نبردِ بی‌پایان ================= */
let ARENA = null;           // { wave, alive, restT, best, dead }

function arenaPool(wave) {
  if (wave <= 2) return ['imp', 'imp', 'charger', 'flyer'];
  if (wave <= 4) return ['imp', 'charger', 'flyer', 'bomber', 'shielder'];
  if (wave <= 7) return ['charger', 'flyer', 'shielder', 'bomber', 'sniper'];
  if (wave <= 11) return ['sniper', 'brute', 'flyer', 'shielder', 'charger', 'auditor'];
  if (wave <= 16) return ['brute', 'sniper', 'auditor', 'shielder', 'flyer', 'bomber', 'safebox'];
  return ['brute', 'sniper', 'auditor', 'safebox', 'shielder', 'charger', 'flyer', 'bomber'];
}

/* سختیِ موج: تعداد و «سالنِ معادل» که جان و آسیب از آن می‌آید */
function arenaTier(wave) {
  return Math.min(34, 2 + Math.floor(wave * 1.35));
}

/* آیا همین حالا داخل نبردِ بی‌پایانیم؟ */
function inArena() { return !!(L && L.arena && ARENA); }

/* «سالنِ معادل» برای اقتصاد. در آرنا RUN.level صفر است، پس اگر اقتصاد به آن
   نگاه کند سکه و جواهر در ارزان‌ترین حالتِ ممکن می‌مانند، در حالی که دشمن‌ها
   قدرتِ سالنِ ۳۴ دارند. موج جای سالن را می‌گیرد. */
function economyLevel() {
  if (inArena()) return arenaTier(ARENA.wave);
  return RUN ? RUN.level : 1;
}

/* نبردِ بی‌پایان فقط بعد از تمام‌کردنِ بازی باز می‌شود، پس بازیکن باید با همان
   توانی وارد شود که آخرِ بازی داشت — نه با شمشیرِ روزِ اول. اگر نسخه‌ی ذخیره‌شده‌ای
   از پایانِ بازی باشد همان، وگرنه معادلِ پاداش‌های یازده رئیس. */
const VETERAN_KIT = {
  maxHp: 190, dmgMul: 2.8, speedMul: 1.45, atkSpeedMul: 1.25,
  dashCdMul: 0.75, dmgTakenMul: 0.8, extraJumps: 1, sword: true, armor: true
};

function applyVeteranKit() {
  const saved = Store.get('veteran', null);
  const kit = (saved && typeof saved === 'object') ? saved : VETERAN_KIT;
  const st = RUN.stats;
  // هیچ‌وقت ضعیف‌ترش نکن: اگر بازیکن در شهر چیزی خریده، همان می‌ماند
  const up = (k, better) => { if (kit[k] !== undefined && better(kit[k], st[k])) st[k] = kit[k]; };
  up('maxHp', (a, b) => a > b);
  up('dmgMul', (a, b) => a > b);
  up('speedMul', (a, b) => a > b);
  up('atkSpeedMul', (a, b) => a > b);
  up('extraJumps', (a, b) => a > b);
  up('dashCdMul', (a, b) => a < b);
  up('dmgTakenMul', (a, b) => a < b);
  for (const k of ['sword', 'armor', 'tea', 'fireResist', 'lifesteal', 'magnet']) {
    if (kit[k]) st[k] = true;
  }
}

function startArena() {
  if (!RUN) newRun();
  ARENA = { wave: 0, restT: 0, best: Store.get('arenaBest', 0), over: false };
  RUN.level = 0;
  applyVeteranKit();
  RUN.stats.maxHp = Math.max(RUN.stats.maxHp, 140);
  PROJ.length = 0; PICKUPS.length = 0; parts.length = 0; texts.length = 0; EMBERS.length = 0;
  ENEMIES.length = 0; BOSS = null; hitstop = 0; ANGEL_SWEEP = null; SLOWMO = 0;
  L = buildArena();
  Sound.mode = 'hell';
  Dlg.active = false; Dlg.lines = []; Dlg.done = null;
  UI.dlg.classList.remove('show');
  UI.levelName.textContent = 'نبردِ بی‌پایان';
  PLAYER = makePlayer(L.spawn.x, L.spawn.y);
  PLAYER.maxHp = RUN.stats.maxHp; PLAYER.hp = PLAYER.maxHp;
  Cam.reset(0, 0);
  GAMESTATE = 'play';
  levelTitleT = 2.4;
  ANGEL.visible = false;
  hideOverlay();
  nextWave();
}

function nextWave() {
  ARENA.wave++;
  const w = ARENA.wave, tier = arenaTier(w);
  const pool = arenaPool(w);
  const count = Math.min(14, 3 + Math.floor(w * 0.8));
  const spots = ARENA_SPOTS.slice();
  for (let i = 0; i < count; i++) {
    // دوتای اول همیشه در نیمه‌ی چپ (جایی که بازیکن ظاهر می‌شود) تا موج بلافاصله دیده شود
    const pick = i < 2 ? spots.filter(q => q.x < 700) : spots;
    const sp = pick[Math.floor(Math.random() * pick.length)];
    const type = pool[Math.floor(Math.random() * pool.length)];
    const e = makeEnemy(type, sp.x + rand(60, -60), sp.y, tier);
    ENEMIES.push(e);
    // ورودِ نمایشی
    ring(e.x + e.w / 2, e.y + e.h / 2, '#ff7a4a', 14, 420, 0.4);
    spawnParts(14, e.x + e.w / 2, e.y + e.h / 2, { col: ['#ff6b4a', '#ffd45e'], speed: 220, life: 0.5, size: 5 });
  }
  ARENA.restT = 0;
  Sound.boss();
  toast('موجِ ' + faNum(w) + '! (' + faNum(count) + ' دشمن)', 2.6);
  if (w % 5 === 0) toast('موجِ ' + faNum(w) + ' — بعد از این موج می‌توانی به شهر بروی.', 3.4);
}

/* برگشت از شهر به همان آرنا، با موجِ بعدی */
function resumeArena(keepHp) {
  PROJ.length = 0; PICKUPS.length = 0; parts.length = 0; texts.length = 0; EMBERS.length = 0;
  ENEMIES.length = 0; BOSS = null; hitstop = 0; ANGEL_SWEEP = null; SLOWMO = 0;
  L = buildArena();
  Sound.mode = 'hell';
  UI.levelName.textContent = 'نبردِ بی‌پایان';
  PLAYER = makePlayer(L.spawn.x, L.spawn.y);
  PLAYER.maxHp = RUN.stats.maxHp;
  PLAYER.hp = clamp(keepHp === undefined ? PLAYER.maxHp : keepHp, 1, PLAYER.maxHp);
  Cam.reset(0, 0);
  GAMESTATE = 'play';
  levelTitleT = 2;
  ANGEL.visible = false;
  nextWave();
}

function updateArena(dt) {
  const alive = ENEMIES.filter(e => !e.dead).length;
  if (alive > 0) { ARENA.restT = 0; return; }
  ARENA.restT += dt;
  if (ARENA.restT > 1.6) {
    // پاداشِ پایانِ موج
    RUN.score += 300 + ARENA.wave * 60;
    healPlayer(PLAYER, Math.round(PLAYER.maxHp * 0.12));
    if (ARENA.wave > (ARENA.best || 0)) { ARENA.best = ARENA.wave; Store.set('arenaBest', ARENA.wave); }
    if (ARENA.wave % 5 === 0) { showArenaBreak(); return; }
    nextWave();
  }
}

/* ---------------- فروشگاه‌های شهر ---------------- */
/* ارتقاهای آهنگری: قیمت با هر خرید بالا می‌رود */
const SMITH = [
  { id: 'dmg',   icon: '⚔️', name: 'تیزکردنِ شمشیر', base: 90,  desc: 'آسیب +۱۵٪', apply: s => s.dmgMul += 0.15 },
  { id: 'hp',    icon: '🛡️', name: 'زرهِ ضخیم‌تر',    base: 110, desc: 'حداکثر جان +۲۵', apply: s => s.maxHp += 25 },
  { id: 'spd',   icon: '👢', name: 'روغن‌کاریِ چکمه', base: 80,  desc: 'سرعت +۸٪', apply: s => s.speedMul += 0.08 },
  { id: 'atk',   icon: '🌀', name: 'تعادلِ تیغه',     base: 100, desc: 'سرعت حمله +۱۰٪', apply: s => s.atkSpeedMul += 0.1 },
  { id: 'dash',  icon: '💨', name: 'تنظیمِ جاخالی',   base: 120, desc: 'انتظار جاخالی ۱۰٪ کمتر', apply: s => s.dashCdMul *= 0.9 }
];
function smithPrice(it) {
  const n = (RUN.shopBuys && RUN.shopBuys[it.id]) || 0;
  return Math.round(it.base * Math.pow(1.45, n));
}

function walletBar() {
  return `<div class="wallet">
    <span class="w-coin">🪙 ${faNum(RUN.coins || 0)}</span>
    <span class="w-gem">💎 ${faNum(RUN.gems || 0)} قیراط</span>
  </div>`;
}

function openShop(id) {
  GAMESTATE = 'shop';
  RUN._openShop = id;
  if (id === 'smith') shopSmith();
  else if (id === 'tea') shopTea();
  else shopJewel();
}

function shopSmith() {
  const rows = SMITH.map((it, i) => {
    const price = smithPrice(it);
    const can = (RUN.coins || 0) >= price;
    const owned = (RUN.shopBuys && RUN.shopBuys[it.id]) || 0;
    return `<button class="shop-row${can ? '' : ' off'}" data-action="buySmith" data-arg="${i}">
      <span class="s-icon">${it.icon}</span>
      <span class="s-body"><b>${it.name}</b><i>${it.desc}${owned ? ' · تا حالا ' + faNum(owned) + ' بار' : ''}</i></span>
      <span class="s-price">🪙 ${faNum(price)}</span>
    </button>`;
  }).join('');
  showOverlay(`
    <div class="panel wide shop">
      <div class="panel-title">⚒️ آهنگریِ هوشنگ</div>
      <div class="panel-sub">«قطعاتش را از انبار برداشتم. کسی نپرسید.»</div>
      ${walletBar()}
      <div class="shop-list">${rows}</div>
      <button class="btn" data-action="closeShop">بیرون ▸</button>
    </div>`, 'shop');
}

function shopTea() {
  const hpMissing = PLAYER.maxHp - PLAYER.hp;
  const healPrice = Math.max(20, Math.round(hpMissing * 1.4));
  const items = [
    { k: 'heal',  icon: '🍵', name: 'چایِ پررنگ', desc: hpMissing > 0 ? 'جانت را کامل پر می‌کند (' + faNum(hpMissing) + ' جان)' : 'جانت که پر است!', price: hpMissing > 0 ? healPrice : 0, off: hpMissing <= 0 },
    { k: 'maxhp', icon: '🥛', name: 'شیرِ بهشتی', desc: 'حداکثر جان +۴۰ و پرشدن کامل', price: 220 },
    { k: 'gem',   icon: '🔹', name: 'خرده‌بلورِ دست‌دوم', desc: '۳ قیراط جواهر (گران است، می‌دانیم)', price: 260 }
  ];
  const rows = items.map((it, i) => {
    const can = !it.off && (RUN.coins || 0) >= it.price;
    return `<button class="shop-row${can ? '' : ' off'}" data-action="buyTea" data-arg="${i}">
      <span class="s-icon">${it.icon}</span>
      <span class="s-body"><b>${it.name}</b><i>${it.desc}</i></span>
      <span class="s-price">${it.off ? '—' : '🪙 ' + faNum(it.price)}</span>
    </button>`;
  }).join('');
  RUN._teaItems = items;
  showOverlay(`
    <div class="panel wide shop">
      <div class="panel-title">🫖 چای‌خانه‌ی بهشت</div>
      <div class="panel-sub">«قندش جداست. نبات نداریم.»</div>
      ${walletBar()}
      <div class="shop-list">${rows}</div>
      <button class="btn" data-action="closeShop">بیرون ▸</button>
    </div>`, 'shop');
}

function shopJewel() {
  // فروش غنیمت
  const have = Object.entries(RUN.loot || {}).filter(([, n]) => n > 0);
  const sellRows = have.length ? have.map(([id, n]) => {
    const it = lootById(id); if (!it) return '';
    return `<button class="shop-row sell" data-action="sellLoot" data-arg="${id}">
      <span class="s-icon">${it.icon}</span>
      <span class="s-body"><b>${it.name} ×${faNum(n)}</b><i>${it.desc}</i></span>
      <span class="s-price">+🪙 ${faNum(it.price)}</span>
    </button>`;
  }).join('') : '<div class="shop-empty">چیزی برای فروش نداری. از هیولاها غنیمت بگیر!</div>';

  const sellAll = have.length > 1 ? '<button class="btn small" data-action="sellAllLoot">همه را بفروش</button>' : '';

  // خرید قدرت ویژه
  const powRows = POWERS.map(pw => {
    const owned = (RUN.powers || []).includes(pw.id);
    const eq = RUN.power === pw.id;
    const can = owned || (RUN.gems || 0) >= pw.cost;
    return `<button class="shop-row${can ? '' : ' off'}${eq ? ' equipped' : ''}" data-action="${owned ? 'equipPower' : 'buyPower'}" data-arg="${pw.id}">
      <span class="s-icon">${pw.icon}</span>
      <span class="s-body"><b>${pw.name}</b><i>${pw.desc} · انتظار ${faNum(Math.round(powerCdOf(pw)))} ثانیه${(RUN.powerTune && RUN.powerTune[pw.id]) ? ' (' + faNum(RUN.powerTune[pw.id]) + ' بار تند شده)' : ''}</i></span>
      <span class="s-price">${eq ? '✓ فعال' : owned ? 'انتخاب' : '💎 ' + faNum(pw.cost)}</span>
    </button>`;
  }).join('');

  // مصرفِ دائمیِ جواهر: تندکردنِ قدرت و تبدیل به سکه
  const act = RUN.power ? powerById(RUN.power) : null;
  const tn = (act && RUN.powerTune[act.id]) || 0;
  const tunePrice = 9 + tn * 5;
  const canTune = !!act && (RUN.gems || 0) >= tunePrice && tn < 6;
  const exchange = (RUN.gems || 0) >= 5;
  const extra = `
    <div class="shop-sec">کارگاهِ قدرت — هر قدرت جداگانه تند می‌شود</div>
    <div class="shop-list">
      <button class="shop-row${canTune ? '' : ' off'}" data-action="tunePower">
        <span class="s-icon">⏱️</span>
        <span class="s-body"><b>تندکردنِ ${act ? act.name : 'قدرت'}</b><i>${!act ? 'اول یک قدرت بخر و فعالش کن' : tn >= 6 ? 'تا تهش تند شده — بیشتر نمی‌شود' : 'انتظارش ۱۰٪ کمتر می‌شود · تا حالا ' + faNum(tn) + ' بار از ۶'}</i></span>
        <span class="s-price">${act && tn < 6 ? '💎 ' + faNum(tunePrice) : '—'}</span>
      </button>
      <button class="shop-row${exchange ? '' : ' off'}" data-action="gemToCoin">
        <span class="s-icon">⚖️</span>
        <span class="s-body"><b>تبدیلِ قیراط به سکه</b><i>۵ قیراط ← ۶۰ سکه. «نرخِ امروز همین است. فردا هم همین است.»</i></span>
        <span class="s-price">+🪙 ۶۰</span>
      </button>
    </div>`;

  showOverlay(`
    <div class="panel wide shop">
      <div class="panel-title">💎 جواهرفروشیِ یاقوت</div>
      <div class="panel-sub">«سنگ می‌خرم، قدرت می‌فروشم. رسید هم می‌دهم.»</div>
      ${walletBar()}
      <div class="shop-sec">فروشِ غنیمت</div>
      <div class="shop-list">${sellRows}</div>
      ${sellAll}
      <div class="shop-sec">قدرتِ ویژه — با جواهر (کلید <b>K</b> یا دکمه‌ی ⚡)</div>
      <div class="shop-list">${powRows}</div>
      ${extra}
      <button class="btn" data-action="closeShop">بیرون ▸</button>
    </div>`, 'shop');
}

function reopenShop() {
  const id = RUN._openShop;
  if (id === 'smith') shopSmith(); else if (id === 'tea') shopTea(); else shopJewel();
}

/* ---------------- شهرِ امن ---------------- */
function updateTown(dt) {
  const p = PLAYER, pcx = p.x + p.w / 2;
  let active = null;
  for (const sh of L.shops) {
    sh.near = pcx > sh.x - 30 && pcx < sh.x + sh.w + 30 && Math.abs((p.y + p.h) - sh.y) < 120;
    if (sh.near) active = sh;
  }
  if (active && (hit('ArrowUp') || hit('KeyW'))) {
    openShop(active.id);
    return;
  }
  if (aabb(rectOf(p), L.exit)) {
    GAMESTATE = 'levelend';
    if (RUN.fromArena) {
      RUN.fromArena = false;
      const hp = PLAYER.hp;
      fadeTo(() => { resumeArena(hp); });
    } else {
      const next = RUN.level + 1;
      fadeTo(() => startLevel(next));
    }
  }
}

function enterTown() {
  RUN.townVisits = (RUN.townVisits || 0) + 1;
  PROJ.length = 0; PICKUPS.length = 0; parts.length = 0; texts.length = 0; EMBERS.length = 0;
  ENEMIES.length = 0; BOSS = null; hitstop = 0; ANGEL_SWEEP = null; SLOWMO = 0;
  L = buildTown();
  Sound.mode = 'heaven';
  Dlg.active = false; Dlg.lines = []; Dlg.done = null;
  UI.dlg.classList.remove('show');
  UI.levelName.textContent = 'میدانِ ابری — شهرِ امن';
  const keepHp = PLAYER ? PLAYER.hp : RUN.stats.maxHp;
  PLAYER = makePlayer(L.spawn.x, L.spawn.y);
  PLAYER.maxHp = RUN.stats.maxHp;
  PLAYER.hp = clamp(keepHp, 1, PLAYER.maxHp);
  Cam.reset(clamp(L.spawn.x - VW / 2, 0, Math.max(0, L.w - VW)), 0);
  GAMESTATE = 'play';
  levelTitleT = 2.4;
  ANGEL.visible = false;
  if (RUN.townVisits === 1) {
    RUN.coins += 120;
    toast('هوشنگ ۱۲۰ سکه کفِ دستت گذاشت: «از تنخواهِ واحد برداشتم. ننویسش جایی.»', 5);
  } else {
    toast('شهرِ امن! اینجا کسی کاری‌ات ندارد. برو سراغ دکه‌ها ↑', 4);
  }
  if (RUN.townVisits === 1) {
    setTimeout(() => {
      if (L && L.town) showTip('جلوی هر دکه بایست و <b>↑</b> را بزن. سکه برای ارتقا، جواهر برای قدرتِ ویژه، غنیمت برای فروش.', 7);
    }, 3800);
  }
  Sound.win();
}

function updatePlayerIdle(dt) {
  PLAYER.vy = Math.min(PHYS.maxFall, PLAYER.vy + PHYS.grav * dt);
  moveEntity(PLAYER, dt);
}

/* ---------------- دوربین نمایش (زوم میان‌پرده) ---------------- */
let viewZoom = 1, viewAnchor = 0.4, viewFocus = { x: 0, y: 0 }, viewReady = false;

function updateView(dt) {
  const menu = GAMESTATE === 'menu' && PLAYER && L;
  const story = ((GAMESTATE === 'story') || menu) && PLAYER && L;
  const tz = menu ? 1.3 : (story ? 1.45 : 1);
  const ta = menu ? 0.52 : (story ? 0.44 : 0.4);
  let fx, fy;
  if (story) {
    const ax = (ANGEL && ANGEL.visible) ? ANGEL.x + 10 : PLAYER.x + PLAYER.w / 2;
    fx = (PLAYER.x + PLAYER.w / 2 + ax) / 2 + (menu ? 230 : 0);
    fy = PLAYER.y + 2;
    const halfW = VW / (2 * tz);
    fx = clamp(fx, halfW, Math.max(halfW, L.w - halfW));
    Cam.x = lerp(Cam.x, clamp(fx - VW / 2, 0, Math.max(0, L.w - VW)), 1 - Math.pow(0.02, dt));
    const kk = viewReady ? 1 - Math.pow(0.005, dt) : 1;
    viewFocus.x = lerp(viewFocus.x, fx, kk);
    viewFocus.y = lerp(viewFocus.y, fy, kk);
  } else {
    viewFocus.x = Cam.x + VW / 2;
    viewFocus.y = Cam.y + VH * 0.4;
  }
  const k = viewReady ? 1 - Math.pow(0.004, dt) : 1;
  viewZoom = lerp(viewZoom, tz, k);
  viewAnchor = lerp(viewAnchor, ta, k);
  viewReady = true;
}

/* ---------------- ترسیم ---------------- */
function render() {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.clearRect(0, 0, VW, VH);
  if (GAMESTATE === 'map') { drawMap(ctx); return; }
  if (!L) return;

  drawBackground(ctx);

  ctx.save();
  let shX = Cam.ox - Cam.x, shY = Cam.oy - Cam.y;
  let fx = viewFocus.x, fy = viewFocus.y;
  /* در حالتِ پیکسلی دوربین را به شبکه‌ی پیکسلِ بوم چفت می‌کنیم؛ وگرنه
     جابه‌جاییِ کسری باعث می‌شود لبه‌ها هر فریم جور دیگری رُند شوند و
     کلِ تصویر موقعِ اسکرول بلرزد. */
  if (PIXEL_ART && viewZoom === 1) {
    const q = PIXEL_SCALE;
    shX = Math.round(shX / q) * q; shY = Math.round(shY / q) * q;
    fx = Math.round(fx / q) * q;   fy = Math.round(fy / q) * q;
  }
  ctx.translate(VW / 2 + shX, VH * viewAnchor + shY);
  ctx.scale(viewZoom, viewZoom);
  ctx.translate(-fx, -fy);
  drawDecor(ctx);
  drawTerrain(ctx);
  drawHazards(ctx);
  drawExit(ctx);
  drawPickups(ctx);
  for (const e of ENEMIES) {
    if (e.dead) continue;
    if (e.draw) e.draw(ctx, e); else drawEnemy(ctx, e);
  }
  if (ANGEL && ANGEL.visible) drawAngel(ctx, ANGEL.x, ANGEL.y + 60, 0.85, ANGEL.t, ANGEL.mood);
  if (PLAYER) drawPlayer(ctx, PLAYER);
  drawProjectiles(ctx);
  drawAngelSweep(ctx);
  drawParts(ctx);
  // هاله‌ی سپرِ بوروکراتیک
  if (PLAYER && PLAYER.aegisT > 0) {
    const r = 42 + Math.sin(timeNow * 8) * 3;
    ctx.save();
    ctx.globalAlpha = 0.35 + Math.sin(timeNow * 6) * 0.12;
    ctx.strokeStyle = '#ffd45e'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(PLAYER.x + PLAYER.w / 2, PLAYER.y + PLAYER.h / 2, r, 0, TAU); ctx.stroke();
    ctx.globalAlpha = 0.14; ctx.fillStyle = '#ffd45e';
    ctx.beginPath(); ctx.arc(PLAYER.x + PLAYER.w / 2, PLAYER.y + PLAYER.h / 2, r, 0, TAU); ctx.fill();
    ctx.restore();
  }
  ctx.restore();

  // پرده‌ی «وقتِ اداری»
  if (SLOWMO > 0) {
    ctx.save();
    ctx.globalAlpha = Math.min(0.22, SLOWMO * 0.12);
    ctx.fillStyle = '#7a5cc4'; ctx.fillRect(0, 0, VW, VH);
    ctx.restore();
  }

  // نشانگر دشمنان بیرون از کادر (تا دنبالِ آخرین دشمن نگردی)
  if (GAMESTATE === 'play' && L) drawOffscreenMarkers(ctx);

  // جلوه‌های تمام‌صفحه: سایه‌روشنِ گوشه‌ها، با رنگِ همان دنیا
  if (L.theme !== 'town' && L.theme !== 'heaven') {
    const v = ctx.createRadialGradient(VW / 2, VH / 2, VH * 0.35, VW / 2, VH / 2, VH * 0.95);
    v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, worldOf(L.theme).vignette || 'rgba(20,0,5,.55)');
    ctx.fillStyle = v; ctx.fillRect(0, 0, VW, VH);
  }
  if (PLAYER && !PLAYER.dead && PLAYER.hp / PLAYER.maxHp < 0.3) {
    const a = 0.18 + Math.sin(timeNow * 5) * 0.07;
    const v = ctx.createRadialGradient(VW / 2, VH / 2, VH * 0.25, VW / 2, VH / 2, VH * 0.8);
    v.addColorStop(0, 'rgba(255,0,0,0)'); v.addColorStop(1, `rgba(190,0,0,${a})`);
    ctx.fillStyle = v; ctx.fillRect(0, 0, VW, VH);
  }

  // کارت عنوان مرحله
  if (levelTitleT > 0 && GAMESTATE === 'play' && RUN) {
    const k = Math.min(1, levelTitleT / 0.6);
    const info = (L && L.town) ? { name: 'میدانِ ابری', sub: 'شهرِ امن — اینجا کسی کاری‌ات ندارد' }
      : (L && L.arena) ? { name: 'نبردِ بی‌پایان', sub: ARENA && ARENA.wave > 1 ? 'موجِ ' + faNum(ARENA.wave) + ' — تا کجا دوام می‌آوری؟' : 'سالنِ اجاره‌ای، شیفتِ بی‌پایان' }
      : LEVELS[Math.min(RUN.level, LEVELS.length - 1)];
    ctx.save();
    ctx.globalAlpha = k;
    ctx.font = '900 32px Vazirmatn, Tahoma, sans-serif';
    const w1 = ctx.measureText(info.name).width;
    ctx.font = '500 18px Vazirmatn, Tahoma, sans-serif';
    const w2 = ctx.measureText(info.sub).width;
    const w = Math.max(w1, w2) + 90, x = VW / 2 - w / 2, y = 74;
    fillRR(ctx, x, y, w, 86, 16, 'rgba(12,5,16,.82)');
    ctx.strokeStyle = 'rgba(255,214,130,.65)'; ctx.lineWidth = 2;
    rr(ctx, x, y, w, 86, 16); ctx.stroke();
    ctx.fillStyle = 'rgba(255,214,130,.8)';
    ctx.fillRect(x + 28, y + 70, w - 56, 2);
    faText(ctx, info.name, VW / 2, y + 32, 32, '#ffe9a8', 'center', 900);
    faText(ctx, info.sub, VW / 2, y + 60, 18, '#ffc9a0', 'center', 500);
    ctx.restore();
  }

  // نوارِ «به بخشِ تازه خوش آمدی» — فقط در اولین سالنِ هر دنیا
  // نوارِ مهلتِ جمع‌کردنِ خزانه‌ی رئیس
  if (RUN && RUN.lootRushT > 0 && (GAMESTATE === 'play' || GAMESTATE === 'story')) {
    const k = RUN.lootRushT / BOSS_LOOT_RUSH;
    const bw = 230, bx = VW / 2 - bw / 2, by = 152;   // زیرِ ناحیه‌ی توست (۵٫۲em ≈ ۸۳px)
    ctx.save();
    ctx.globalAlpha = Math.min(1, RUN.lootRushT * 2.5);
    fillRR(ctx, bx - 10, by - 24, bw + 20, 46, 12, 'rgba(8,4,14,.72)');
    ctx.font = '800 14px Vazirmatn, sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillStyle = '#ffd45e';
    ctx.fillText('خزانه‌ی رئیس — جمعش کن!', VW / 2, by - 9);
    fillRR(ctx, bx, by + 6, bw, 8, 4, 'rgba(255,255,255,.14)');
    fillRR(ctx, bx, by + 6, bw * k, 8, 4, k > 0.33 ? '#8cff9b' : '#ff8e3c');
    ctx.restore();
  }

  if (worldBannerT > 0 && GAMESTATE === 'play' && worldBannerName) {
    const k = Math.min(1, worldBannerT / 0.5) * Math.min(1, (3.4 - worldBannerT) / 0.35);
    ctx.save();
    ctx.globalAlpha = Math.max(0, k);
    ctx.font = '900 26px Vazirmatn, Tahoma, sans-serif';
    const tw = ctx.measureText(worldBannerName).width + 120;
    const bx = VW / 2 - tw / 2, by = 176;
    const g = ctx.createLinearGradient(bx, 0, bx + tw, 0);
    g.addColorStop(0, 'rgba(255,214,130,0)');
    g.addColorStop(0.5, 'rgba(255,214,130,.22)');
    g.addColorStop(1, 'rgba(255,214,130,0)');
    ctx.fillStyle = g; ctx.fillRect(bx, by, tw, 52);
    ctx.fillStyle = 'rgba(255,214,130,.7)';
    ctx.fillRect(bx + 20, by, tw - 40, 2);
    ctx.fillRect(bx + 20, by + 50, tw - 40, 2);
    faText(ctx, 'بخشِ تازه', VW / 2, by + 16, 13, 'rgba(255,230,180,.85)', 'center', 700);
    faText(ctx, worldBannerName, VW / 2, by + 42, 26, '#fff4d0', 'center', 900);
    ctx.restore();
  }

  if (fadeT > 0) {
    ctx.fillStyle = `rgba(6,2,10,${fadeT})`;
    ctx.fillRect(0, 0, VW, VH);
  }

  if (GAMESTATE === 'play' || GAMESTATE === 'story') {
    UI.hud.classList.add('show');
    if (PLAYER) updateHUD(PLAYER);
  } else UI.hud.classList.remove('show');
}

function worldToScreen(wx, wy) {
  return {
    x: (wx - viewFocus.x) * viewZoom + VW / 2,
    y: (wy - viewFocus.y) * viewZoom + VH * viewAnchor
  };
}

function drawOffscreenMarkers(c) {
  for (const e of ENEMIES) {
    if (e.dead) continue;
    const s = worldToScreen(e.x + e.w / 2, e.y + e.h / 2);
    if (s.x > -10 && s.x < VW + 10 && s.y > -10 && s.y < VH + 10) continue;
    const mx = clamp(s.x, 30, VW - 30), my = clamp(s.y, 96, VH - 46);
    const a = Math.atan2(s.y - my, s.x - mx);
    c.save();
    c.translate(mx, my);
    c.globalAlpha = 0.55 + Math.sin(timeNow * 5) * 0.18;
    c.rotate(a);
    c.fillStyle = '#ff6b4a';
    c.beginPath(); c.moveTo(14, 0); c.lineTo(-8, -9); c.lineTo(-8, 9); c.closePath(); c.fill();
    c.restore();
    c.save();
    c.globalAlpha = 0.5;
    circle(c, mx, my, 4, '#ffd0c4');
    c.restore();
  }
  c.globalAlpha = 1;
}

/* ---------------- راه‌اندازی ---------------- */
let DPR = 1, lastT = 0, acc = 0;
/* ظاهرِ پیکسلی — PIXEL_SCALE = چند پیکسلِ صفحه به ازای هر پیکسلِ بازی */
let PIXEL_ART = Store.get('pixelart', '1') !== '0';
const PIXEL_SCALE = 3;                 // ۹۶۰×۵۴۰ ⇒ بومِ ۳۲۰×۱۸۰

function resize() {
  const vw = window.innerWidth, vh = window.innerHeight;
  // روی گوشیِ عمودی: بوم به بالا می‌چسبد و فضای زیرش عرشه‌ی دکمه‌ها می‌شود
  const deck = TOUCH.on && vh > vw * 1.08;
  document.body.classList.toggle('portrait-play', deck);

  const maxW = deck ? vw : Math.min(vw, vh * (VW / VH));
  const w = Math.floor(maxW), h = Math.floor(w * VH / VW);
  const wrap = $('game');
  wrap.style.width = w + 'px';
  wrap.style.height = (deck ? vh : h) + 'px';
  wrap.style.fontSize = (w / VW * 16) + 'px';
  wrap.style.setProperty('--cvh', h + 'px');
  /* حالتِ پیکسلی: بوم را عمداً کم‌رزولوشن می‌سازیم (۹۶۰×۵۴۰ ÷ PIXEL) و
     مرورگر با نزدیک‌ترین‌همسایه بزرگش می‌کند. چون همه‌ی کدِ نقاشی در
     مختصاتِ ۹۶۰×۵۴۰ می‌ماند، هیچ تابعِ رسمی لازم نیست عوض شود. */
  if (PIXEL_ART) {
    DPR = 1 / PIXEL_SCALE;
    canvas.width = Math.round(VW / PIXEL_SCALE);
    canvas.height = Math.round(VH / PIXEL_SCALE);
  } else {
    DPR = Math.min(PERF.dprCap, window.devicePixelRatio || 1);
    canvas.width = Math.floor(VW * DPR);
    canvas.height = Math.floor(VH * DPR);
  }
  canvas.style.width = w + 'px';
  canvas.style.height = h + 'px';
  canvas.style.imageRendering = PIXEL_ART ? 'pixelated' : 'auto';
  ctx.imageSmoothingEnabled = !PIXEL_ART;
}

function frame(ts) {
  if (!lastT) lastT = ts;
  let dt = (ts - lastT) / 1000;
  lastT = ts;
  if (dt > 0.1) dt = 0.1;
  acc += dt;
  let guard = 0, stepped = false;
  while (acc >= STEP && guard++ < 5) {
    tick(STEP);
    if (hitstop <= 0) clearJust();
    acc -= STEP;
    stepped = true;
  }
  /* اگر این فریم هیچ گامِ فیزیکی نداشت (مثلاً نمایشگر ۱۲۰ هرتزی، یا jitter روی ۶۰ هرتز)
     کلیدهای «تازه‌فشرده» را پاک نکن؛ وگرنه ضربه‌ای که همین حالا زده شده بی‌صدا گم می‌شود.
     گامِ بعدی خودش بعد از دیدنشان پاکشان می‌کند. */
  if (!stepped && hitstop <= 0 && !keyJustFresh()) clearJust();
  render();
  requestAnimationFrame(frame);
}

function boot() {
  canvas = $('cv');
  ctx = canvas.getContext('2d');
  initUI();
  bindInput();
  setupSaveDrop();
  resize();
  window.addEventListener('resize', resize);
  newRun();
  showMenu();
  requestAnimationFrame(frame);

  // قلّاب کوچک برای تست و کنجکاوی (بدون تأثیر بر بازی)
  window.__BEHESHT = {
    get state() { return GAMESTATE; },
    get run() { return RUN; },
    get player() { return PLAYER; },
    get boss() { return BOSS; },
    get enemies() { return ENEMIES; },
    get level() { return L; },
    goto(n) { hideOverlay(); if (!RUN) newRun(); startLevel(n, false, false, true); },
    get died() { return diedSinceStart; },
    skipDialogue() { while (Dlg.active) Dlg.advance(); },
    act(a, arg) { doAction(a, arg); },
    getSave, saveGame, clearSave, loadGame, exportSaveFile,
    buildLevel, makeBossFor, FINAL_LEVEL, LEVELS, PERKS,
    WORLDS, WORLD_PLAN, worldIdOf, worldNameOf, BOSS_SLOTS, BOSS_REWARDS,
    showLevelSelect, startLevelFromMenu, maxLevelReached, noteLevelReached,
    showMap, buildMap, mapMove, get map() { return MAP; },
    applyProgressFor, clampStats, isBossLevel,
    get practice() { return !!(RUN && RUN.practice); },
    buildTown, enterTown, openShop, POWERS, SMITH, GEMS, LOOT,
    startArena, nextWave, buildArena, get arena() { return ARENA; },
    coinValue, economyLevel, inArena, arenaTier, applyVeteranKit, VETERAN_KIT,
    hitEnemy(e, d) { damageEnemy(e, d, 1, {}); },
    finishGame() { showVictory(); },
    readSaveText(txt) {
      const f = new Blob([txt], { type: 'application/json' });
      f.name = 'test.json';
      return readSaveFile(f);
    },
    hurt(d) { if (PLAYER) { PLAYER.iframes = 0; hurtPlayer(PLAYER, d, PLAYER.x + 200); } },
    get fileSaveOn() { return fileSaveOn(); },
    get IN() { return IN; },
    get touchOn() { return TOUCH.on; },
    get touchCfg() { return TCFG; },
    get touchEdit() { return touchEditOn(); },
    applyTouchCfg, resetTouchCfg, setTouchEdit,
    get touchPref() { return touchPref(); },
    applyTouchUI,
    get perf() { return PERF; },
    get pickups() { return PICKUPS; },
    get partCount() { return parts.length; },
    renderOnce() { render(); },
    get pixelArt() { return PIXEL_ART; },
    setPixelArt(v) { PIXEL_ART = !!v; Store.set('pixelart', v ? '1' : '0'); resize(); },
    boom(x, y) { spawnParts(40, x, y, { col: ['#ffd45e', '#ff6b4a', '#fff'], speed: 320, life: 1.0, size: 6 }); },
    spawnDrop(x, y, kind, data) { spawnPickup(x, y, kind, data); },
    get lastFileName() { return lastFileName; }
  };
}

if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
else boot();

})();
</script>
</body>
</html>
