.emoji, .card-icon, .reward-icon, .perk, .grade {
  font-family: 'Segoe UI Emoji', 'Apple Color Emoji', 'Noto Color Emoji', 'Twemoji Mozilla', Vazirmatn, sans-serif;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body {
  margin: 0; padding: 0; height: 100%; overflow: hidden;
  background: #07040c;
  background-image: radial-gradient(circle at 50% 0%, #2a1030 0%, #0d0614 45%, #05030a 100%);
  font-family: Vazirmatn, Tahoma, 'Segoe UI', sans-serif;
  direction: rtl; color: #fff;
  display: flex; align-items: center; justify-content: center;
  user-select: none; -webkit-user-select: none;
}

#game {
  position: relative; width: 960px; height: 540px;
  font-size: 16px;
  border-radius: 1em; overflow: hidden;
  box-shadow: 0 0 0 0.12em rgba(255, 210, 120, .25), 0 1.6em 4em rgba(0, 0, 0, .75);
  background: #120812;
}
#cv { display: block; width: 100%; height: 100%; }

/* ---------------- HUD ---------------- */
#hud {
  position: absolute; inset: 0; pointer-events: none;
  opacity: 0; transition: opacity .25s;
}
#hud.show { opacity: 1; }

.hud-hp {
  position: absolute; top: 0.9em; right: 1em; width: 17em;
}
.hp-bar {
  position: relative; height: 1.5em; border-radius: 1em;
  background: rgba(10, 4, 14, .72); border: 0.12em solid rgba(255, 220, 150, .45);
  overflow: hidden; box-shadow: 0 0.2em 0.8em rgba(0, 0, 0, .5);
}
/* وقتی بعد از باخت جان پر می‌شود، نوار یک بار برق می‌زند */
@keyframes hpRefill {
  0%   { filter: brightness(2.4); box-shadow: 0 0 1.4em rgba(140, 255, 155, .95); }
  60%  { filter: brightness(1.5); box-shadow: 0 0 .9em rgba(140, 255, 155, .6); }
  100% { filter: none; box-shadow: none; }
}
#hpFill.refill { animation: hpRefill 1.1s ease-out; }
@media (prefers-reduced-motion: reduce) { #hpFill.refill { animation: none; } }

#hpFill {
  position: absolute; inset: 0.12em; width: 100%;
  border-radius: 1em; background: linear-gradient(90deg, #49d67a, #9bf0a8);
  transition: width .18s ease-out;
}
#hpText {
  position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
  font-size: 0.78em; font-weight: 700; text-shadow: 0 0.1em 0.2em rgba(0, 0, 0, .9);
  letter-spacing: .02em;
}
.hp-label {
  font-size: 0.75em; opacity: .85; margin-bottom: .25em; font-weight: 700;
  text-shadow: 0 0.1em 0.3em #000;
}
#perkRow {
  display: flex; gap: .3em; flex-wrap: wrap; margin-top: .45em; justify-content: flex-start;
}
.perk {
  width: 1.9em; height: 1.9em; display: flex; align-items: center; justify-content: center;
  font-size: 0.95em; border-radius: .5em;
  background: rgba(20, 10, 26, .8); border: 0.1em solid rgba(255, 215, 120, .4);
  box-shadow: 0 0.15em 0.4em rgba(0, 0, 0, .5);
}

.hud-left { position: absolute; top: 0.9em; left: 1em; text-align: left; }
#levelName { font-size: 0.95em; font-weight: 900; text-shadow: 0 0.12em 0.35em #000; }
#objective {
  font-size: 0.8em; margin-top: .2em; color: #ffd9a1; font-weight: 700;
  text-shadow: 0 0.1em 0.3em #000;
}
.score-wrap { margin-top: .35em; font-size: 0.8em; color: #fff3cf; text-shadow: 0 0.1em 0.3em #000; }
#scoreVal { font-weight: 900; color: #ffd45e; }
#comboBox {
  margin-top: .3em; font-size: 0.95em; font-weight: 900; color: #ffd45e;
  opacity: 0; transition: opacity .2s, transform .12s; transform-origin: left center;
  text-shadow: 0 0 0.6em rgba(255, 180, 60, .9), 0 0.1em 0.3em #000;
}

/* نوار رئیس */
#bossBar {
  position: absolute; top: 0.8em; left: 50%; transform: translateX(-50%) translateY(-2em);
  width: 32em; opacity: 0; transition: opacity .3s, transform .3s; text-align: center;
}
#bossBar.show { opacity: 1; transform: translateX(-50%) translateY(0); }
#bossName { font-size: 1.05em; font-weight: 900; color: #ffb4a1; text-shadow: 0 0.12em 0.4em #000; }
#bossTitle { font-size: 0.72em; color: #ffd9c2; opacity: .9; margin-bottom: .25em; text-shadow: 0 0.1em 0.3em #000; }
.boss-bar-outer {
  height: 1.1em; border-radius: 1em; background: rgba(12, 2, 6, .8);
  border: 0.12em solid rgba(255, 130, 90, .6); overflow: hidden;
}
#bossFill {
  height: 100%; width: 100%; border-radius: 1em;
  background: linear-gradient(90deg, #7a1010, #e0402a 45%, #ffb347);
  transition: width .2s ease-out;
}

/* ---------------- گفت‌وگو ---------------- */
#dialogue {
  position: absolute; left: 1.2em; right: 1.2em; bottom: 1em;
  display: none; gap: .9em; align-items: stretch;
  background: linear-gradient(180deg, rgba(22, 12, 30, .97), rgba(12, 6, 18, .97));
  border: 0.14em solid rgba(255, 214, 130, .55);
  border-radius: 1em; padding: .8em; backdrop-filter: blur(4px);
  box-shadow: 0 1em 2.4em rgba(0, 0, 0, .7);
}
#dialogue.show { display: flex; }
#portrait {
  width: 7em; height: 7em; border-radius: .7em; flex: none;
  border: 0.12em solid rgba(255, 214, 130, .45); background: #1a1026;
}
.dlg-body { flex: 1; display: flex; flex-direction: column; min-width: 0; }
.dlg-name { font-size: 0.95em; font-weight: 900; color: #ffd45e; margin-bottom: .25em; }
.dlg-name.hero { color: #9fd8ff; }
.dlg-name.boss { color: #ff8e7a; }
.dlg-name.narrator { color: #d9c6ff; }
#dlgText {
  flex: 1; font-size: 1em; line-height: 1.75; color: #f6f1ff;
  min-height: 3.2em;
}
#dlgHint { font-size: 0.72em; color: #bda9d6; text-align: left; opacity: .85; }

/* ---------------- پیام‌ها ---------------- */
#toast {
  position: absolute; top: 5.2em; left: 50%; transform: translateX(-50%) translateY(-1em);
  background: rgba(14, 6, 20, .92); border: 0.1em solid rgba(255, 215, 120, .5);
  color: #ffe9b8; padding: .45em 1.1em; border-radius: 2em; font-size: 0.92em; font-weight: 700;
  opacity: 0; transition: opacity .25s, transform .25s; pointer-events: none; white-space: nowrap;
}
#toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
/* وقتی کارت عنوانِ مرحله روی صفحه است، تُست پایین‌تر می‌نشیند */
#game.titlecard #toast { top: 13.5em; }
/* نوارِ خزانه‌ی رئیس در y≈۱۵۲ کشیده می‌شود؛ تُست نباید رویش بیفتد */
#game.lootrush #toast { top: 11.8em; }
#game.lootrush.titlecard #toast { top: 13.5em; }

#tutorialTip {
  position: absolute; bottom: 1.4em; left: 50%; transform: translateX(-50%) translateY(1em);
  background: rgba(10, 16, 30, .92); border: 0.1em solid rgba(150, 215, 255, .55);
  color: #e8f6ff; padding: .55em 1.2em; border-radius: .8em; font-size: 0.92em;
  opacity: 0; transition: opacity .3s, transform .3s; pointer-events: none; text-align: center;
  max-width: 80%;
}
#tutorialTip.show { opacity: 1; transform: translateX(-50%) translateY(0); }
#tutorialTip b { color: #ffd45e; }

/* ---------------- اورلی/منو ---------------- */
#overlay {
  position: absolute; inset: 0; display: none;
  align-items: center; justify-content: center;
  background: radial-gradient(circle at 50% 40%, rgba(30, 10, 40, .8), rgba(4, 2, 8, .94));
  backdrop-filter: blur(3px); padding: 1em; overflow: auto;
}
#overlay.show { display: flex; }
/* با margin:auto وسط‌چین می‌شود ولی هنگام بلند شدن، بالا/پایین بریده نمی‌شود */
#overlay > * { margin: auto; }
#overlay.ov-menu {
  background: radial-gradient(ellipse 46% 68% at 50% 42%, rgba(10, 4, 18, .88), rgba(8, 4, 14, .35));
}

/* منو هم مثل پنل‌ها سقفِ ارتفاع دارد: اگر باز هم بلند شد، خودش می‌پیماید
   به‌جای اینکه دکمه‌های پایینی زیرِ لبه‌ی صفحه گم شوند. */
.menu {
  text-align: center; max-width: 34em;
  max-height: 100%; overflow-y: auto; overflow-x: hidden;
  scrollbar-width: thin; scrollbar-color: rgba(255, 214, 130, .4) transparent;
}
.menu::-webkit-scrollbar { width: .45em; }
.menu::-webkit-scrollbar-thumb { background: rgba(255, 214, 130, .4); border-radius: .5em; }
.logo {
  font-size: 3.4em; font-weight: 900; line-height: 1.1;
  background: linear-gradient(180deg, #fff6d8 0%, #ffd45e 45%, #ff8e3c 100%);
  -webkit-background-clip: text; background-clip: text; color: transparent;
  filter: drop-shadow(0 0.08em 0.1em rgba(0, 0, 0, .6));
  margin-bottom: .1em;
}
.tagline { font-size: 0.95em; color: #d9c9f0; line-height: 1.8; margin: .5em auto 1.1em; max-width: 30em; }
/* دو دکمه‌ی کوچک کنار هم */
.btn-row { display: flex; gap: .45em; max-width: 24em; margin: .4em auto; flex-wrap: wrap; }
.btn-row .btn { margin: 0; flex: 1 1 8em; max-width: none; }
.btn.small { font-size: .82em; padding: .5em .7em; }
.best { margin-top: .7em; color: #ffd45e; font-weight: 700; font-size: .9em; }
.save-info {
  margin: -.1em auto .7em; font-size: .78em; color: #9bf0a8;
  background: rgba(80, 220, 130, .1); border: 0.08em solid rgba(120, 230, 160, .3);
  border-radius: .5em; padding: .3em .8em; display: inline-block;
}
.saved-note {
  margin-top: .8em; font-size: .78em; color: #9bf0a8; line-height: 1.7;
  background: rgba(80, 220, 130, .1); border-radius: .5em; padding: .4em .7em;
}
.credits { margin-top: 1em; font-size: .72em; color: #8d7fa6; line-height: 1.8; }
.credits .ver { opacity: .75; font-variant-numeric: tabular-nums; }

.btn {
  display: block; width: 100%; max-width: 22em; margin: .45em auto;
  font-family: inherit; font-size: 1.05em; font-weight: 800; color: #2a1206;
  background: linear-gradient(180deg, #ffe9a8, #ffc14d);
  border: 0.14em solid #fff3cf; border-radius: .7em; padding: .6em 1.2em;
  cursor: pointer; transition: transform .1s, box-shadow .15s, filter .15s;
  box-shadow: 0 .35em 0 #a9711d, 0 .8em 1.6em rgba(0, 0, 0, .5);
}
.btn:hover, .btn.sel { transform: translateY(-0.12em); filter: brightness(1.08); }
.btn.sel { box-shadow: 0 .35em 0 #a9711d, 0 0 0 .22em rgba(255, 255, 255, .85), 0 .8em 1.6em rgba(0, 0, 0, .5); }
.btn:active { transform: translateY(.18em); box-shadow: 0 .14em 0 #a9711d; }
.btn.big { font-size: 1.3em; }
.btn.ghost {
  background: linear-gradient(180deg, rgba(60, 40, 80, .9), rgba(35, 20, 50, .95));
  color: #ffe9b8; border-color: rgba(255, 215, 120, .45);
  box-shadow: 0 .3em 0 rgba(0, 0, 0, .5), 0 .6em 1.4em rgba(0, 0, 0, .45);
}

.panel {
  background: linear-gradient(180deg, rgba(30, 16, 42, .97), rgba(16, 8, 26, .98));
  border: 0.14em solid rgba(255, 214, 130, .5); border-radius: 1.1em;
  padding: 1.4em 1.6em; max-width: 30em; width: 100%; text-align: center;
  box-shadow: 0 1.4em 3em rgba(0, 0, 0, .7);
}
.panel.wide { max-width: 46em; }
.panel-title {
  font-size: 1.7em; font-weight: 900; color: #ffd45e; margin-bottom: .2em;
  text-shadow: 0 0.1em 0.3em rgba(0, 0, 0, .6);
}
.panel-sub { font-size: .85em; color: #cbb9e6; line-height: 1.8; margin-bottom: .9em; }
.grade {
  font-size: 1.5em; font-weight: 900; color: #9bf0a8; margin: .3em 0 .7em;
  text-shadow: 0 0 .8em rgba(120, 255, 160, .5);
}
.stats {
  display: grid; grid-template-columns: 1fr 1fr; gap: .4em .9em;
  margin: .8em 0 1em; font-size: .9em;
}
.stats > div {
  display: flex; justify-content: space-between; gap: .6em;
  background: rgba(255, 255, 255, .05); padding: .35em .7em; border-radius: .5em;
}
.stats span { color: #bda9d6; }
.stats b { color: #fff3cf; }
.quote {
  font-size: .85em; color: #e7d6ff; line-height: 1.9; font-style: italic;
  background: rgba(255, 255, 255, .05); border-right: .2em solid #ffd45e;
  padding: .6em .9em; border-radius: .5em; margin-bottom: 1em;
}
.quote.big { font-size: 1em; }

.cards { display: flex; gap: .8em; margin: 1em 0; flex-wrap: wrap; justify-content: center; }
.card {
  flex: 1 1 12em; min-width: 11em; max-width: 14em;
  font-family: inherit; cursor: pointer; text-align: center;
  background: linear-gradient(180deg, rgba(48, 28, 68, .95), rgba(26, 12, 40, .98));
  border: 0.14em solid rgba(255, 214, 130, .4); border-radius: .9em; padding: 1em .8em;
  transition: transform .12s, box-shadow .15s, border-color .15s; color: #fff;
}
.card:hover, .card.sel {
  transform: translateY(-.35em); border-color: #ffd45e;
  box-shadow: 0 .7em 1.6em rgba(255, 180, 60, .3), 0 0 0 .14em rgba(255, 212, 94, .6);
}
.card-icon { font-size: 2.4em; line-height: 1.2; }
.card-name { font-size: 1.02em; font-weight: 900; color: #ffd45e; margin: .25em 0; }
.card-desc { font-size: .8em; color: #d9c9f0; line-height: 1.7; }

.reward-icon { font-size: 4em; line-height: 1.3; filter: drop-shadow(0 0 .3em rgba(255, 200, 80, .8)); }
.reward-name { font-size: 1.3em; font-weight: 900; color: #ffd45e; margin-bottom: .3em; }
.reward-desc { font-size: .92em; color: #e4d6ff; line-height: 1.9; margin-bottom: 1em; }

.keys { display: grid; grid-template-columns: 1fr 1fr; gap: .5em; margin-bottom: 1em; font-size: .88em; }
.keys > div {
  display: flex; align-items: center; gap: .6em; justify-content: space-between;
  background: rgba(255, 255, 255, .05); padding: .45em .8em; border-radius: .5em;
}
.keys b {
  background: rgba(255, 212, 94, .18); border: 0.1em solid rgba(255, 212, 94, .5);
  border-radius: .35em; padding: .1em .45em; color: #ffd45e; white-space: nowrap; font-size: .95em;
}
.keys span { color: #cbb9e6; text-align: left; }
.story-text { font-size: .95em; line-height: 2.1; color: #e7dcff; text-align: justify; margin-bottom: 1.2em; }
.story-text b { color: #ffd45e; }

/* ---------------- کنترل لمسی ---------------- */
/* بدون backdrop-filter: روی گوشی گران است و فریم می‌خورد */
#touch {
  position: absolute; inset: 0; display: none; pointer-events: none; touch-action: none;
  --tscale: 1; --talpha: 1;
  font-size: calc(1em * var(--tscale));
}
#touch.show { display: block; }
/* direction: ltr لازم است، وگرنه در صفحه‌ی راست‌به‌چپ دکمه‌ی «چپ» سمت راست می‌افتد */
#touch .tpad, #touch .tact, #touch .tex {
  position: absolute; display: flex; align-items: flex-end; gap: .5em;
  pointer-events: auto; direction: ltr;
}
#touch .tpad { left: .7em; bottom: .7em; }
#touch .tact { right: .7em; bottom: .7em; }
#touch .tex { right: .7em; bottom: 5.6em; gap: .5em; }
#touch button {
  opacity: var(--talpha);
  width: 3.2em; height: 3.2em; border-radius: 50%; font-size: 1.05em; line-height: 1;
  display: flex; align-items: center; justify-content: center;
  background: rgba(14, 7, 24, .5); border: 0.13em solid rgba(255, 255, 255, .75);
  color: #fff; font-family: inherit; padding: 0;
  box-shadow: 0 .15em .5em rgba(0, 0, 0, .55), inset 0 0 1.2em rgba(255, 255, 255, .1);
  text-shadow: 0 .1em .25em rgba(0, 0, 0, .9);
  -webkit-tap-highlight-color: transparent; user-select: none; touch-action: none;
}
#touch button.t-big { width: 4.1em; height: 4.1em; font-size: 1.3em; }
#touch button.t-sm { width: 3em; height: 3em; margin-bottom: .5em; }
#touch button.press { background: rgba(255, 212, 94, .8); border-color: #fff; color: #2a1206; text-shadow: none; transform: scale(.93); }
#touch .tex button { width: 2.9em; height: 2.9em; font-size: 1em; }
#touch #tPower { position: relative; border-color: rgba(255, 212, 94, .5); }
#touch #tPower.ready { background: rgba(255, 212, 94, .3); border-color: #ffd45e; }
#touch #tPower.empty { opacity: .3; }
#touch #tPower i {
  position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
  font-style: normal; font-weight: 900; font-size: .95em; color: #fff;
  background: rgba(10, 4, 16, .6); border-radius: 50%;
}
#touch #tPower i:empty { display: none; }
#touch #tPause {
  position: absolute; top: .5em; left: .6em; transform: none;
  width: 2.3em; height: 2.3em; font-size: .8em; opacity: .8; pointer-events: auto;
}
/* روی لمسی، بلوکِ اطلاعاتِ چپ جا باز می‌کند تا دکمه‌ی مکث رویش نیفتد */
body.is-touch .hud-left { padding-left: 2.6em; }


/* ---- دکمه‌ی همیشه‌حاضر برای روشن‌کردن کنترل لمسی ----
   وقتی دکمه‌های لمسی خاموش‌اند این پیدا است تا کسی دنبالشان نگردد. */
#touchChip {
  position: absolute; left: .7em; bottom: .7em; z-index: 40;
  display: none; align-items: center; gap: .4em;
  font-family: inherit; font-size: .8em; font-weight: 700; cursor: pointer;
  padding: .5em .9em; border-radius: 2em; color: #ffe9b8;
  background: rgba(14, 7, 24, .72); border: 0.1em solid rgba(255, 212, 94, .5);
  box-shadow: 0 .2em .7em rgba(0, 0, 0, .55);
  -webkit-tap-highlight-color: transparent; white-space: nowrap;
}
#touchChip.show { display: flex; animation: chipPulse 2.4s ease-in-out 3; }
@keyframes chipPulse {
  0%, 100% { box-shadow: 0 .2em .7em rgba(0, 0, 0, .55); border-color: rgba(255, 212, 94, .5); }
  50%      { box-shadow: 0 .2em .7em rgba(0, 0, 0, .55), 0 0 1.2em rgba(255, 212, 94, .75); border-color: rgba(255, 212, 94, 1); }
}
@media (prefers-reduced-motion: reduce) { #touchChip.show { animation: none; } }
#touchChip:active { background: rgba(255, 212, 94, .8); color: #2a1206; }
body.is-touch #touchChip { display: none; }

/* ---- چپ‌دست: جای پد حرکت و دکمه‌های اکشن عوض می‌شود ---- */
body.lefty #touch .tpad { left: auto; right: .7em; }
body.lefty #touch .tact { right: auto; left: .7em; }
body.lefty #touch .tex  { right: auto; left: .7em; }
body.lefty.portrait-play #touch { grid-template-areas: "ex  .  ." "act .  pad"; }
body.lefty.portrait-play #touch .tex { justify-self: start; }
body.lefty.portrait-play #touch .tact { justify-content: flex-start; }

/* ---- حالت چیدمان: دسته‌ها کشیدنی می‌شوند ---- */
body.tedit #touch { pointer-events: none; }
body.tedit #touch .tpad, body.tedit #touch .tact, body.tedit #touch .tex {
  pointer-events: auto; cursor: grab; touch-action: none;
  outline: 0.14em dashed rgba(255, 212, 94, .85); outline-offset: .3em; border-radius: 1em;
  background: rgba(255, 212, 94, .09);
}
body.tedit #touch .dragging { cursor: grabbing; outline-color: #fff; background: rgba(255, 212, 94, .2); }
body.tedit #tPause { display: none; }

/* ---- پنل تنظیم دکمه‌ها ---- */
.tset { max-width: 30em; width: 100%; }
.tset-row {
  display: flex; align-items: center; gap: .8em; direction: rtl;
  background: rgba(255, 255, 255, .05); border-radius: .7em;
  padding: .6em .9em; margin-bottom: .5em;
}
.tset-row > b { flex: none; min-width: 6.2em; font-size: .9em; color: #ffd45e; }
.tset-row input[type=range] {
  flex: 1; direction: ltr; accent-color: #ffd45e; height: 1.6em; background: transparent;
}
.tset-row .tset-val { flex: none; min-width: 3.2em; text-align: left; font-size: .85em; opacity: .85; direction: ltr; }
.tset-seg { display: flex; gap: .4em; flex: 1; direction: rtl; }
.tset-seg button {
  flex: 1; font-family: inherit; font-size: .85em; font-weight: 700; cursor: pointer;
  padding: .45em .6em; border-radius: .5em; color: #e9dcff;
  background: rgba(255, 255, 255, .07); border: 0.1em solid rgba(255, 255, 255, .18);
}
.tset-seg button.on { background: rgba(255, 212, 94, .28); border-color: #ffd45e; color: #fff; }
.tset-note { font-size: .78em; line-height: 1.9; color: #cdbbe8; opacity: .9; margin: .2em 0 .7em; }
.tset-note b { color: #ffd45e; }
.tset-mini { max-width: 24em; padding: .9em 1.1em; }
.tset-mini .panel-title { font-size: 1.15em; margin-bottom: .2em; }
.tset-mini .tset-note { margin-bottom: .6em; }
.tset-minirow { display: flex; gap: .5em; align-items: center; direction: rtl; }
.tset-minirow .btn { margin: 0; flex: 1; }
/* وقتی پنل باز است، نیمه‌شفاف می‌شود تا دکمه‌ها زیرش دیده شوند */
#overlay.ov-touchset { background: linear-gradient(180deg, rgba(6, 3, 12, .97) 0%, rgba(6, 3, 12, .92) 46%, rgba(6, 3, 12, 0) 100%); backdrop-filter: none; }
#overlay.ov-touchset > * { margin: 0 auto auto; }
body.tedit #overlay.ov-touchset { background: linear-gradient(180deg, rgba(6, 3, 12, .96) 0%, rgba(6, 3, 12, .6) 30%, rgba(6, 3, 12, 0) 55%); pointer-events: none; }
body.tedit #overlay.ov-touchset .tset { pointer-events: auto; }

/* ---------------- کیف‌پول در HUD ---------------- */
#walletRow {
  display: flex; gap: .55em; font-size: .8em; font-weight: 700;
  margin-top: .15em; color: #ffe6a8; text-shadow: 0 1px 3px rgba(0, 0, 0, .8);
}
#walletRow span:empty { display: none; }
#gemVal { color: #9df0ff; }
#lootVal { color: #ffc9e8; }

/* ---------------- فروشگاه‌ها ---------------- */
.panel.wide { max-width: 32em; width: 94%; }
.panel.shop { padding: 1.1em 1.2em; }
.panel.shop .panel-title { font-size: 1.45em; }
.panel.shop .panel-sub { color: #cdbbe8; font-size: .85em; margin-bottom: .5em; opacity: .9; }
.wallet {
  display: flex; gap: .8em; justify-content: center; font-weight: 800; font-size: .95em;
  background: rgba(0, 0, 0, .3); border-radius: .6em; padding: .4em .6em; margin-bottom: .7em;
}
.wallet .w-coin { color: #ffd45e; }

.shop-sec {
  text-align: right; font-size: .82em; font-weight: 800; color: #ffd45e;

}
.shop-list { display: flex; flex-direction: column; gap: .4em; }
.shop-row {

  background: rgba(255, 255, 255, .07); border: 1px solid rgba(255, 255, 255, .13);
  border-radius: .6em; padding: .5em .7em; color: #efe6ff; font-family: inherit;
  cursor: pointer; transition: background .12s, border-color .12s;
}
.shop-row:hover, .shop-row.sel { background: rgba(255, 212, 94, .16); border-color: #ffd45e; }
.shop-row.off { opacity: .42; }
.shop-row.equipped { border-color: #7ef0a0; background: rgba(126, 240, 160, .12); }
.shop-row.sell:hover { background: rgba(126, 240, 160, .14); border-color: #7ef0a0; }
.shop-row .s-icon { font-size: 1.5em; flex: 0 0 1.4em; text-align: center; }
.shop-row .s-body { flex: 1; display: flex; flex-direction: column; gap: .12em; min-width: 0; }
.shop-row .s-body b { font-size: .95em; font-weight: 800; }
.shop-row .s-body i { font-size: .76em; font-style: normal; color: #c3b4de; line-height: 1.5; }
.shop-row .s-price { font-weight: 900; font-size: .85em; color: #ffd45e; white-space: nowrap; }
.shop-empty { font-size: .82em; color: #a89cc0; padding: .7em; }
.btn.small { display: inline-block; width: auto; font-size: .82em; padding: .45em 1.3em; margin-top: .5em; box-shadow: 0 .25em 0 #a9711d; }
.swept-note {
  font-size: .85em; font-weight: 800; color: #bff0c6; margin: .4em 0;
  background: rgba(40, 110, 60, .28); border: 1px solid rgba(126, 240, 160, .3);
  border-radius: .5em; padding: .35em .8em; display: inline-block;
}
.loot-note {
  font-size: .85em; font-weight: 700; color: #ffe6a8; margin: .4em 0;
  background: rgba(0, 0, 0, .28); border-radius: .5em; padding: .35em .7em; display: inline-block;
}

/* دستگاه لمسی: اورلی‌ها باید اسکرول‌پذیر و جمع‌وجور باشند */
body.is-touch #overlay { overflow-y: auto; -webkit-overflow-scrolling: touch; }
body.is-touch .panel.shop { font-size: .92em; }
body.is-touch .shop-row { padding: .6em .7em; }

/* راهنمای کلید Enter زیر دکمه‌ی ادامه */
.enter-hint { font-size: .78em; color: #cdbbe8; opacity: .85; margin: -.2em 0 .5em; }
.enter-hint b { color: #ffd45e; }
/* هشدار قفل بودن حافظه‌ی مرورگر */
.warn-note {
  font-size: .78em; line-height: 1.8; color: #ffd9a8;
  background: rgba(120, 70, 20, .35); border: 1px solid rgba(255, 190, 110, .35);
  border-radius: .7em; padding: .5em .9em; margin: .2em 0 .4em; max-width: 34em;
}
.btn.small { font-size: .82em; padding: .5em 1em; }
.saved-note b { color: #bff0c6; }

/* فروشگاه روی صفحه‌ی کوتاه: دو ستونه تا اسکرول کم شود */
/* blur تمام‌صفحه روی GPU موبایل گران است — روی دستگاه لمسی خاموش و با رنگِ تیره‌تر جبران می‌شود */
body.is-touch #overlay { backdrop-filter: none; background: radial-gradient(circle at 50% 40%, rgba(26, 9, 36, .9), rgba(3, 1, 6, .97)); }
body.is-touch #dialogue { backdrop-filter: none; }

/* ---------------- چیدمان عمودیِ گوشی (عرشه‌ی کنترل) ----------------
   در حالت عمودی بازیِ ۱۶:۹ فقط یک نوارِ باریک می‌شود و font-size پایه به
   ۶-۷ پیکسل می‌افتد؛ یعنی هم دکمه‌ها ریز می‌شوند هم منوها ناخوانا. پس:
   بوم به بالای صفحه می‌چسبد، HUD به زیرِ بوم منتقل می‌شود و فضای خالیِ
   پایین می‌شود عرشه‌ی دکمه‌ها — با font-size مستقل بر حسب vw تا به اندازه‌ی
   انگشت باشد. چیدمانِ عرشه grid است تا دو دسته دکمه هرگز روی هم نیفتند. */
body.portrait-play #game { border-radius: 0; box-shadow: none; }
body.portrait-play #cv {
  position: absolute; top: 0; left: 0;
  border-bottom: 0.1em solid rgba(255, 210, 120, .22);
}
body.portrait-play #game::after {
  content: ''; position: absolute; inset: 0; z-index: 0; pointer-events: none;
  background: radial-gradient(ellipse 90% 55% at 50% 100%, rgba(44, 17, 50, .8), rgba(7, 4, 12, 0) 72%);
}
body.portrait-play #cv, body.portrait-play #hud, body.portrait-play #touch,
body.portrait-play #overlay, body.portrait-play #dialogue,
body.portrait-play #toast, body.portrait-play #rotateHint { z-index: 1; }

/* HUD از روی بومِ کوچک برداشته و به بالای عرشه منتقل می‌شود */
body.portrait-play #hud {
  top: var(--cvh, 0px); bottom: auto; height: auto;
  font-size: min(4vw, 19px); padding-top: .7em;
}
body.portrait-play .hud-left { position: static; padding: 0 .9em; text-align: right; }
body.portrait-play .hud-hp { position: static; width: auto; margin: .7em .9em 0; }
body.portrait-play #walletRow { position: static; margin: .6em .9em 0; justify-content: flex-start; }

/* عرشه‌ی دکمه‌ها: فقط نوارِ پایین، چیدمان grid (بدون امکان همپوشانی) */
body.portrait-play #touch {
  /* direction: ltr وگرنه در صفحه‌ی راست‌به‌چپ ستون‌های grid وارونه می‌شوند */
  inset: auto 0 0 0; display: grid; direction: ltr;
  font-size: calc(min(4.9vw, 23px) * var(--tscale));
  grid-template-columns: auto 1fr auto;
  grid-template-areas: ".   .  ex" "pad .  act";
  align-items: end; row-gap: .55em; padding: 0 .7em 1.4em;
}
body.portrait-play #touch .tpad { position: static; grid-area: pad; gap: .35em; }
body.portrait-play #touch .tact {
  position: static; grid-area: act; gap: .35em;
  flex-wrap: wrap; max-width: 9.2em; justify-content: flex-end;
}
body.portrait-play #touch .tex { position: static; grid-area: ex; justify-self: end; gap: .35em; }
body.portrait-play #touch button { min-width: 44px; min-height: 44px; }
body.portrait-play #touch .tpad button { width: 2.7em; height: 2.7em; }
body.portrait-play #touch #tDash { margin-bottom: 0; }
/* دکمه‌ی مکث از عرشه بیرون می‌آید و به گوشه‌ی صفحه می‌چسبد.
   دو شناسه لازم است وگرنه قاعده‌ی پایه‌ی «#touch #tPause» برنده می‌شود. */
body.portrait-play #touch #tPause {
  position: fixed; top: .45em; left: .5em; opacity: .9;
  font-size: min(4vw, 19px); width: 2.5em; height: 2.5em;
  min-width: 44px; min-height: 44px;   /* کفِ اندازه‌ی لمس */
}

/* بقیه‌ی رابط هم نباید با بومِ کوچک، کوچک شود */
body.portrait-play #overlay { font-size: min(4.3vw, 20px); padding: 1.2em .8em; }
body.portrait-play #dialogue { font-size: min(4vw, 19px); }
body.portrait-play #toast { font-size: min(3.6vw, 17px); }
body.portrait-play #tutorialTip { font-size: min(3.4vw, 16px); bottom: auto; top: 11em; }
body.portrait-play .menu { max-width: 26em; }
body.portrait-play .logo { font-size: 2.5em; }

/* یادآوریِ چرخاندن: نوارِ باریکِ خودمحوشونده در فضای خالیِ عرشه، نه پرده‌ی تمام‌صفحه */
#rotateHint {
  position: absolute; left: 50%; top: calc(var(--cvh, 0px) + 12.5em); bottom: auto;
  transform: translate(-50%, .8em);
  display: none; align-items: center; justify-content: center;
  background: rgba(10, 5, 18, .92); border: 0.09em solid rgba(255, 212, 94, .45);
  border-radius: 2em; padding: .5em 1.1em; pointer-events: none;
  opacity: 0; transition: opacity .35s, transform .35s;
  font-size: min(3.4vw, 16px); max-width: 88vw; text-align: center;
}
#rotateHint.show { display: flex; opacity: 1; transform: translate(-50%, 0); }


/* ---------------- منوی انتخاب مرحله ---------------- */
.panel.levelsel {
  max-width: 52em; padding: 1.1em 1.2em;
  /* ستونِ فلکس با سقفِ ارتفاع: هرچه فونت بزرگ شود، ناحیه‌ی پیمایش جمع می‌شود
     و پنل هرگز از کادر بیرون نمی‌زند. */
  display: flex; flex-direction: column; max-height: 100%;
}
.panel.levelsel .panel-title { margin-bottom: .35em; }
.lv-note {
  font-size: .78em; color: #cbb9e6; line-height: 1.8; margin: 0 auto .7em;

  border-radius: .55em; padding: .4em .8em; max-width: 34em;
}
.lv-note b { color: #9bf0a8; }
/* ارتفاع بر حسب vh بسته می‌شود تا پنل هیچ‌وقت از صفحه بیرون نزند */
.lv-scroll {
  flex: 1 1 auto; min-height: 0; max-height: 50vh;
  overflow-y: auto; overflow-x: hidden;
  /* روی صفحه‌ی پهن دو ستون، روی باریک یک ستون */
  display: grid; grid-template-columns: repeat(auto-fit, minmax(23.5em, 1fr));
  gap: 0 1.4em; align-content: start;
  padding: .1em .5em .1em .2em; margin-bottom: .7em;

}
.lv-scroll::-webkit-scrollbar { width: .5em; }
.lv-scroll::-webkit-scrollbar-thumb { background: rgba(255, 214, 130, .4); border-radius: .5em; }
.lv-world { margin-bottom: .6em; text-align: right; }
.lv-world.dim { opacity: .45; }
.lv-wh { display: flex; align-items: center; gap: .5em; margin-bottom: .35em; }
.lv-dot { width: .75em; height: .75em; border-radius: 50%; flex: 0 0 auto; box-shadow: 0 0 .5em rgba(255, 255, 255, .25); }
.lv-wn { font-size: .92em; font-weight: 800; color: #ffe9a8; }
.lv-wr { font-size: .72em; color: #a594c4; font-variant-numeric: tabular-nums; }
.lv-bar { flex: 0 1 7em; height: .25em; background: rgba(255, 255, 255, .1); border-radius: .3em; overflow: hidden; min-width: 2em; opacity: .7; }
.lv-bar i { display: block; height: 100%; border-radius: .3em; }
/* فلکسِ wrap به‌جای گرید: در هر عرضی بدونِ سرریز می‌پیچد */
.lv-grid { display: flex; flex-wrap: wrap; gap: .3em; }
.lv-chip {
  position: relative; font-family: inherit; font-weight: 800;
  display: flex; align-items: center; justify-content: center;
  width: 2.5em; height: 2.5em; flex: 0 0 auto;
  border-radius: .45em; cursor: pointer; padding: 0;
  color: #ffe9b8; background: linear-gradient(180deg, rgba(70, 48, 96, .95), rgba(38, 22, 56, .98));
  border: 0.1em solid rgba(255, 215, 120, .35);
  box-shadow: 0 .18em 0 rgba(0, 0, 0, .45);
  transition: transform .1s, filter .15s, box-shadow .15s;
}
.lv-chip .lv-n { font-size: .82em; font-variant-numeric: tabular-nums; }
.lv-chip.tut { width: auto; padding: 0 .9em; }
.lv-chip.tut .lv-n { font-size: .74em; }
.lv-chip:hover, .lv-chip.sel { transform: translateY(-.1em); filter: brightness(1.15); }
.lv-chip.sel { box-shadow: 0 .18em 0 rgba(0, 0, 0, .45), 0 0 0 .16em rgba(255, 255, 255, .85); }
.lv-chip:active { transform: translateY(.08em); }
.lv-chip.boss {
  color: #2a1206; background: linear-gradient(180deg, #ffe9a8, #ffb648);
  border-color: #fff3cf; box-shadow: 0 .18em 0 #a9711d;
}
.lv-chip.boss .lv-b { position: absolute; top: -.4em; left: -.2em; font-size: .62em; filter: drop-shadow(0 .1em .1em rgba(0,0,0,.5)); }
/* نشانه‌ی دومِ رئیس، برای وقتی ایموجی رندر نمی‌شود */
.lv-chip.boss::after {
  content: ''; position: absolute; inset: auto .25em .2em .25em; height: .14em;
  border-radius: .14em; background: rgba(90, 40, 6, .6);
}
.lv-chip.here { outline: .14em solid #8cff9b; outline-offset: .1em; }
.lv-chip.locked {
  cursor: default; color: #6b5f84; background: rgba(255, 255, 255, .04);
  border-color: rgba(255, 255, 255, .09); box-shadow: none;
}
.lv-chip.locked .lv-n { opacity: .55; }
.lv-legend { display: flex; gap: 1.1em; justify-content: center; font-size: .72em; color: #a594c4; margin-bottom: .6em; }
.lv-legend span { display: flex; align-items: center; gap: .35em; }
.lv-legend .k-b { font-style: normal; }
.lv-legend .k-l { width: .85em; height: .85em; border-radius: .25em; background: rgba(255, 255, 255, .06); border: 0.08em solid rgba(255, 255, 255, .12); }
@media (max-width: 620px) {
  .lv-chip { width: 2.3em; height: 2.3em; }
}

/* صفحه‌ی کوتاه (مثلاً ۱۲۸۰×۷۲۰ یا پنجره‌ی نیمه): منو را جمع کن تا کامل جا شود */
/* ---------------- تراشه‌ی مرحله در HUD ---------------- */
#stageChip {
  display: none; align-items: center; gap: .4em; margin-bottom: .22em;
  font-size: .72em; font-weight: 800; line-height: 1;
  background: rgba(10, 5, 18, .5); border: 0.09em solid var(--wc, rgba(255, 214, 130, .5));
  border-radius: 2em; padding: .3em .7em; width: max-content;
  text-shadow: 0 .08em .2em rgba(0, 0, 0, .8);
}
#stageChip.show { display: flex; }
#stageNum { color: #fff; font-variant-numeric: tabular-nums; }
#stageWorld { color: var(--wc, #ffd45e); opacity: .95; }
#stageWorld:not(:empty)::before { content: '·'; margin-left: .4em; opacity: .5; color: #fff; }
#stageChip.boss {
  background: linear-gradient(180deg, rgba(255, 180, 72, .92), rgba(220, 120, 30, .92));
  border-color: #fff3cf;
}
#stageChip.boss #stageNum, #stageChip.boss #stageWorld { color: #2a1206; text-shadow: none; }

@media (max-height: 820px) {
  .logo { font-size: 2.7em; }
  .tagline { font-size: .85em; line-height: 1.7; margin: .35em auto .7em; }
  .btn { margin: .35em auto; padding: .5em 1.1em; }
  .btn.big { font-size: 1.15em; }
  .btn-row { margin: .32em auto; }
  .save-info { font-size: .74em; margin-bottom: .5em; padding: .25em .7em; }
  .best { margin-top: .5em; font-size: .85em; }

}
@media (max-height: 640px) {
  .logo { font-size: 2.1em; }

@media (max-height: 470px) {
  .panel.shop { padding: .8em 1em; max-width: 46em; }
  .panel.shop .panel-title { font-size: 1.2em; }
  .panel.shop .panel-sub { font-size: .78em; margin-bottom: .35em; }
  .shop-list { display: grid; grid-template-columns: 1fr 1fr; gap: .35em; }
  .shop-row { padding: .4em .55em; }
  .shop-row .s-icon { font-size: 1.2em; flex-basis: 1.2em; }
  .shop-row .s-body b { font-size: .88em; }
  .shop-row .s-body i { font-size: .7em; line-height: 1.4; }
  .wallet { padding: .3em .5em; margin-bottom: .45em; font-size: .88em; }
  .shop-sec { margin: .45em 0 .25em; font-size: .76em; }

  /* پنل تنظیم دکمه‌ها روی صفحه‌ی کوتاه (گوشیِ افقی) */
  .tset { max-width: 42em; padding: .8em 1em; }
  .tset .panel-title { font-size: 1.15em; margin-bottom: .1em; }
  .tset-rows { display: grid; grid-template-columns: 1fr 1fr; gap: .4em; align-items: start; }
  .tset-row { padding: .4em .7em; margin-bottom: 0; }
  .tset-row > b { min-width: 4.6em; font-size: .82em; }
  .tset-seg button { font-size: .78em; padding: .35em .4em; }
  .tset-note { font-size: .72em; line-height: 1.7; margin: .15em 0 .5em; }
  .tset .btn { padding: .45em 1em; font-size: .88em; margin-bottom: .35em; }

  /* انتخاب مرحله روی صفحه‌ی کوتاه */
  .panel.levelsel { max-width: 52em; padding: .7em .9em; }
  .panel.levelsel .panel-title { font-size: 1.2em; margin-bottom: .15em; }
  .lv-note { font-size: .7em; line-height: 1.6; padding: .3em .6em; margin-bottom: .4em; }
  .lv-scroll { max-height: 46vh; margin-bottom: .45em; }
  .lv-world { margin-bottom: .4em; }
  .lv-chip { width: 2.1em; height: 2.1em; }
  .lv-legend { font-size: .66em; margin-bottom: .4em; }
  .panel.levelsel .btn { padding: .4em 1em; font-size: .85em; }
}

<div id="game">
  <canvas id="cv" width="960" height="540"></canvas>

<script>
(function () {
/* ===== 01-core.js ===== */
/* ============================================================
   بهشت، ظاهراً!  —  هسته‌ی بازی (ابزارها، ورودی، صدا، ذرات، دوربین)
   ============================================================ */

const VW = 960, VH = 540;      // رزولوشن داخلی بازی

/* ---------------- بودجه‌ی گرافیکی (موبایل در برابر دسکتاپ) ---------------- */
const PERF = (() => {
  const coarse = typeof matchMedia === 'function' && matchMedia('(pointer: coarse)').matches;
  const cores = (navigator.hardwareConcurrency || 4);
  const smallRam = (navigator.deviceMemory || 4) <= 4;
  const weak = coarse && (cores <= 6 || smallRam);
  return {
    mobile: coarse,
    low: weak,                 // گوشی‌های معمولی: گرافیک سبک‌تر
    parts: weak ? 0.45 : (coarse ? 0.7 : 1),   // ضریب تعداد ذرات
    maxParts: weak ? 130 : (coarse ? 220 : 420),
    dprCap: weak ? 1.1 : (coarse ? 1.4 : 2),
    softGlow: !weak            // درخششِ گرادیانی فقط وقتی توان هست
  };
})();
const BUILD_TAG = '۲۰۲۶/۱۰/۰۸ ساعت ۰۹:۵۹';   // build.py پرش می‌کند — برای تشخیصِ نسخه‌ی کش‌شده
const STEP = 1 / 60;           // گام ثابت فیزیک

let canvas = null, ctx = null;
let hitstop = 0;               // توقف کوتاه هنگام ضربه‌های سنگین (حس‌خوبِ مبارزه)
let timeNow = 0;               // زمان بازی (ثانیه)

/* ---------------- ابزارهای عمومی ---------------- */
const clamp = (v, a, b) => v < a ? a : (v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const sign = v => v < 0 ? -1 : (v > 0 ? 1 : 0);
const dist = (ax, ay, bx, by) => Math.hypot(ax - bx, ay - by);
const TAU = Math.PI * 2;

function approach(v, target, delta) {
  if (v < target) return Math.min(v + delta, target);
  if (v > target) return Math.max(v - delta, target);
  return target;
}
function aabb(a, b) {
  return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
}
function rectOf(e) { return { x: e.x, y: e.y, w: e.w, h: e.h }; }

/* مولد عدد شبه‌تصادفی با بذر ثابت (هر مرحله همیشه یک‌شکل ساخته می‌شود) */
function mulberry32(seed) {
  let a = seed >>> 0;
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
let RNG = Math.random;
const rand = (a = 1, b = 0) => b + RNG() * (a - b);
const randInt = (a, b) => Math.floor(b + RNG() * (a - b + 1));
const pick = arr => arr[Math.floor(RNG() * arr.length)];

/* ارقام فارسی */
const FA_DIGITS = ['۰', '۱', '۲', '۳', '۴', '۵', '۶', '۷', '۸', '۹'];
function faNum(n) {
  return String(Math.round(n)).replace(/[0-9]/g, d => FA_DIGITS[+d]);
}

/* ---------------- ذخیره‌سازی امن (داخل iframe ممکن است مسدود باشد) -------------- */
const Store = {
  mem: {},
  // آیا حافظه‌ی مرورگر واقعاً در دسترس است؟ (در iframe سندباکس نیست)
  ok: (() => {
    try { localStorage.setItem('behesht__t', '1'); localStorage.removeItem('behesht__t'); return true; }
    catch (e) { return false; }
  })(),
  get(k, def) {
    if (this.ok) {
      try { const v = localStorage.getItem('behesht_' + k); if (v !== null) return JSON.parse(v); }
      catch (e) { this.ok = false; }
    }
    return (k in this.mem) ? this.mem[k] : def;
  },
  set(k, v) {
    this.mem[k] = v;
    if (this.ok) {
      try { localStorage.setItem('behesht_' + k, JSON.stringify(v)); }
      catch (e) { this.ok = false; }
    }
  }
};

/* ---------------- ورودی ---------------- */
const keyState = new Set();
const keyJust = new Set();
const PREVENT = new Set(['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Tab',
  'KeyW', 'KeyA', 'KeyS', 'KeyD', 'KeyJ', 'KeyK', 'ShiftLeft', 'ShiftRight', 'Enter']);

function bindInput() {
  window.addEventListener('keydown', e => {
    if (PREVENT.has(e.code)) e.preventDefault();
    if (!e.repeat) keyJust.add(e.code);
    keyState.add(e.code);
    Sound.unlock();
  }, { passive: false });
  window.addEventListener('keyup', e => keyState.delete(e.code));
  window.addEventListener('blur', () => { keyState.clear(); });
  canvas.addEventListener('pointerdown', e => {
    // مختصاتِ کلیک در فضای ۹۶۰×۵۴۰ — نقشه‌ی مرحله‌ها از آن استفاده می‌کند
    const r = canvas.getBoundingClientRect();
    POINTER.x = (e.clientX - r.left) / r.width * VW;
    POINTER.y = (e.clientY - r.top) / r.height * VH;
    POINTER.hit = true;
  });
  canvas.addEventListener('mousedown', e => {
    Sound.unlock();
    const code = e.button === 0 ? 'MouseL' : 'MouseR';
    if (!keyState.has(code)) keyJust.add(code);
    keyState.add(code);
    e.preventDefault();
  });
  window.addEventListener('mouseup', e => keyState.delete(e.button === 0 ? 'MouseL' : 'MouseR'));
  canvas.addEventListener('contextmenu', e => e.preventDefault());
}
const POINTER = { x: 0, y: 0, hit: false };
function takePointer() { if (!POINTER.hit) return null; POINTER.hit = false; return { x: POINTER.x, y: POINTER.y }; }

function vkey(code, on) { // کلیدهای مجازی برای لمس
  if (on) { if (!keyState.has(code)) keyJust.add(code); keyState.add(code); }
  else keyState.delete(code);
}
const down = (...c) => c.some(k => keyState.has(k));
const hit = (...c) => c.some(k => keyJust.has(k));
function clearJust() { keyJust.clear(); }
// آیا کلیدِ تازه‌ای هست که هنوز هیچ گامِ فیزیکی ندیده باشدش؟
function keyJustFresh() { return keyJust.size > 0; }

const IN = {
  get left() { return down('ArrowLeft', 'KeyA'); },
  get right() { return down('ArrowRight', 'KeyD'); },
  get up() { return down('ArrowUp', 'KeyW'); },
  get down() { return down('ArrowDown', 'KeyS'); },
  get jumpHeld() { return down('Space', 'ArrowUp', 'KeyW'); },
  get jump() { return hit('Space', 'ArrowUp', 'KeyW'); },
  get dash() { return hit('ShiftLeft', 'ShiftRight', 'KeyL', 'MouseR'); },
  get attack() { return hit('KeyJ', 'KeyX', 'MouseL'); },
  get confirm() { return hit('Space', 'Enter', 'NumpadEnter', 'KeyJ', 'MouseL'); },
  get pause() { return hit('Escape', 'KeyP'); }
};

/* ---------------- صدا (کاملاً سنتز شده، بدون فایل خارجی) ---------------- */
const Sound = {
  ac: null, master: null, musicGain: null, muted: Store.get('muted', false),
  musicOn: Store.get('music', true), started: false, nextNote: 0, step: 0, timer: null,
  unlock() {
    if (this.ac) { if (this.ac.state === 'suspended') this.ac.resume(); return; }
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      this.ac = new AC();
      this.master = this.ac.createGain();
      this.master.gain.value = this.muted ? 0 : 0.5;
      this.master.connect(this.ac.destination);
      this.musicGain = this.ac.createGain();
      this.musicGain.gain.value = this.musicOn ? 0.16 : 0;
      this.musicGain.connect(this.master);
      this.startMusic();
    } catch (e) { this.ac = null; }
  },
  setMuted(m) {
    this.muted = m; Store.set('muted', m);
    if (this.master) this.master.gain.value = m ? 0 : 0.5;
  },
  setMusic(on) {
    this.musicOn = on; Store.set('music', on);
    if (this.musicGain) this.musicGain.gain.setTargetAtTime(on ? 0.16 : 0, this.ac.currentTime, 0.1);
  },
  tone({ f = 440, f2 = null, t = 0.12, type = 'square', g = 0.25, delay = 0, slideT = null }) {
    if (!this.ac || this.muted) return;
    const ac = this.ac, now = ac.currentTime + delay;
    const o = ac.createOscillator(), gn = ac.createGain();
    o.type = type; o.frequency.setValueAtTime(f, now);
    if (f2) o.frequency.exponentialRampToValueAtTime(Math.max(20, f2), now + (slideT || t));
    gn.gain.setValueAtTime(0.0001, now);
    gn.gain.exponentialRampToValueAtTime(g, now + 0.008);
    gn.gain.exponentialRampToValueAtTime(0.0001, now + t);
    o.connect(gn); gn.connect(this.master);
    o.start(now); o.stop(now + t + 0.03);
  },
  noise({ t = 0.14, g = 0.2, hp = 400, lp = 6000, delay = 0, sweep = true }) {
    if (!this.ac || this.muted) return;
    const ac = this.ac, now = ac.currentTime + delay;
    const len = Math.floor(ac.sampleRate * t);
    const buf = ac.createBuffer(1, len, ac.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
    const src = ac.createBufferSource(); src.buffer = buf;
    const f1 = ac.createBiquadFilter(); f1.type = 'highpass'; f1.frequency.value = hp;
    const f2 = ac.createBiquadFilter(); f2.type = 'lowpass'; f2.frequency.value = lp;
    if (sweep) f2.frequency.exponentialRampToValueAtTime(Math.max(300, lp * 0.15), now + t);
    const gn = ac.createGain(); gn.gain.value = g;
    gn.gain.exponentialRampToValueAtTime(0.0001, now + t);
    src.connect(f1); f1.connect(f2); f2.connect(gn); gn.connect(this.master);
    src.start(now); src.stop(now + t);
  },
  jump() { this.tone({ f: 330, f2: 740, t: 0.14, type: 'square', g: 0.12 }); },
  dash() { this.noise({ t: 0.18, g: 0.14, hp: 700, lp: 7000 }); this.tone({ f: 800, f2: 200, t: 0.14, type: 'sawtooth', g: 0.05 }); },
  swing() { this.noise({ t: 0.1, g: 0.1, hp: 1200, lp: 9000 }); },
  hitEnemy() { this.noise({ t: 0.09, g: 0.22, hp: 200, lp: 3500 }); this.tone({ f: 180, f2: 90, t: 0.08, type: 'square', g: 0.12 }); },
  kill() { this.tone({ f: 600, f2: 1200, t: 0.1, type: 'triangle', g: 0.14 }); this.tone({ f: 900, f2: 1600, t: 0.12, type: 'triangle', g: 0.1, delay: 0.06 }); },
  hurt() { this.tone({ f: 300, f2: 70, t: 0.3, type: 'sawtooth', g: 0.18 }); },
  pickup() { this.tone({ f: 880, t: 0.07, type: 'square', g: 0.12 }); this.tone({ f: 1320, t: 0.09, type: 'square', g: 0.12, delay: 0.07 }); },
  ui() { this.tone({ f: 520, t: 0.05, type: 'square', g: 0.08 }); },
  boss() { this.tone({ f: 110, f2: 55, t: 0.9, type: 'sawtooth', g: 0.2 }); this.noise({ t: 0.8, g: 0.12, hp: 60, lp: 900 }); },
  win() { [523, 659, 784, 1046].forEach((f, i) => this.tone({ f, t: 0.3, type: 'triangle', g: 0.14, delay: i * 0.12 })); },
  lose() { [392, 330, 262, 196].forEach((f, i) => this.tone({ f, t: 0.35, type: 'sawtooth', g: 0.12, delay: i * 0.16 })); },
  blip(f) { this.tone({ f, t: 0.06, type: 'square', g: 0.07 }); },

  /* موسیقی تولیدی ساده */
  mode: 'heaven',
  startMusic() {
    if (!this.ac || this.timer) return;
    this.nextNote = this.ac.currentTime + 0.1;
    this.timer = setInterval(() => this.scheduler(), 60);
  },
  scheduler() {
    if (!this.ac) return;
    const spb = 0.26;
    while (this.nextNote < this.ac.currentTime + 0.3) {
      this.playStep(this.step, this.nextNote);
      this.step = (this.step + 1) % 32;
      this.nextNote += spb;
    }
  },
  playStep(s, t) {
    const heaven = [0, 4, 7, 11, 12, 11, 7, 4];
    const hell = [0, 3, 7, 10, 12, 10, 7, 3];
    const base = this.mode === 'heaven' ? 261.63 : 196.00;
    const scale = this.mode === 'heaven' ? heaven : hell;
    const ac = this.ac, g = this.musicGain;
    const note = (f, dur, type, vol) => {
      const o = ac.createOscillator(), gn = ac.createGain();
      o.type = type; o.frequency.value = f;
      gn.gain.setValueAtTime(0.0001, t);
      gn.gain.exponentialRampToValueAtTime(vol, t + 0.02);
      gn.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(gn); gn.connect(g); o.start(t); o.stop(t + dur + 0.02);
    };
    const semi = n => base * Math.pow(2, n / 12);
    if (s % 8 === 0) note(semi(scale[0] - 12), 0.5, 'triangle', 0.5);
    if (s % 8 === 4) note(semi(scale[2] - 12), 0.4, 'triangle', 0.38);
    const arp = scale[s % 8];
    note(semi(arp), 0.2, this.mode === 'heaven' ? 'sine' : 'sawtooth', this.mode === 'heaven' ? 0.22 : 0.14);
    if (this.mode === 'hell' && s % 4 === 2) {
      const o = ac.createOscillator(), gn = ac.createGain();
      o.type = 'sine'; o.frequency.setValueAtTime(140, t); o.frequency.exponentialRampToValueAtTime(45, t + 0.12);
      gn.gain.setValueAtTime(0.5, t); gn.gain.exponentialRampToValueAtTime(0.0001, t + 0.14);
      o.connect(gn); gn.connect(g); o.start(t); o.stop(t + 0.16);
    }
  }
};

/* ---------------- دوربین ---------------- */
const Cam = {
  x: 0, y: 0, shake: 0, tx: 0, ty: 0,
  reset(x, y) { this.x = this.tx = x; this.y = this.ty = y; this.shake = 0; },
  follow(p, dt, level) {
    const lookAhead = clamp(p.vx * 0.22, -90, 90);
    this.tx = p.x + p.w / 2 + lookAhead - VW / 2;
    this.ty = p.y + p.h / 2 - VH / 2 - 20;
    this.tx = clamp(this.tx, 0, Math.max(0, level.w - VW));
    this.ty = clamp(this.ty, 0, Math.max(0, level.h - VH));
    this.x = lerp(this.x, this.tx, 1 - Math.pow(0.0015, dt));
    this.y = lerp(this.y, this.ty, 1 - Math.pow(0.004, dt));
    this.shake = Math.max(0, this.shake - dt * 28);
  },
  kick(v) { this.shake = Math.min(26, this.shake + v); },
  get ox() { return Math.round(this.x + (this.shake ? (Math.random() - 0.5) * this.shake : 0)); },
  get oy() { return Math.round(this.y + (this.shake ? (Math.random() - 0.5) * this.shake : 0)); }
};

/* ---------------- ذرات و افکت‌ها ---------------- */
let parts = [];
let texts = [];

function spawnParts(n, x, y, opt = {}) {
  n = Math.max(1, Math.round(n * PERF.parts));
  if (parts.length > PERF.maxParts) n = Math.min(n, 2);
  if (parts.length > PERF.maxParts * 1.5) return;
  for (let i = 0; i < n; i++) {
    const a = opt.angle !== undefined ? opt.angle + (Math.random() - 0.5) * (opt.spread || 1) : Math.random() * TAU;
    const sp = (opt.speed || 180) * (0.4 + Math.random() * 0.8);
    parts.push({
      x: x + (Math.random() - 0.5) * (opt.jitter || 8),
      y: y + (Math.random() - 0.5) * (opt.jitter || 8),
      vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
      life: 0, max: (opt.life || 0.5) * (0.6 + Math.random() * 0.8),
      size: (opt.size || 4) * (0.5 + Math.random()),
      col: Array.isArray(opt.col) ? pickAny(opt.col) : (opt.col || '#fff'),
      grav: opt.grav === undefined ? 900 : opt.grav,
      shape: opt.shape || 'square',
      rot: Math.random() * TAU, vr: (Math.random() - 0.5) * 14,
      drag: opt.drag === undefined ? 0.92 : opt.drag
    });
  }
}
function pickAny(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

function ring(x, y, col = '#fff', r = 10, grow = 260, life = 0.3) {
  parts.push({ x, y, vx: 0, vy: 0, life: 0, max: life, size: r, col, grav: 0, shape: 'ring', grow, rot: 0, vr: 0, drag: 1 });
}
function floatText(x, y, str, col = '#fff', size = 20, vy = -70) {
  texts.push({ x, y, str, col, size, vy, life: 0, max: 0.85 });
}
function updateParts(dt) {
  for (let i = parts.length - 1; i >= 0; i--) {
    const p = parts[i];
    p.life += dt;
    if (p.life >= p.max) { parts.splice(i, 1); continue; }
    if (p.shape === 'ring') { p.size += p.grow * dt; continue; }
    p.vy += p.grav * dt;
    p.vx *= Math.pow(p.drag, dt * 60);
    p.x += p.vx * dt; p.y += p.vy * dt; p.rot += p.vr * dt;
  }
  for (let i = texts.length - 1; i >= 0; i--) {
    const t = texts[i]; t.life += dt;
    t.y += t.vy * dt; t.vy *= 0.94;
    if (t.life >= t.max) texts.splice(i, 1);
  }
}
function drawParts(c) {
  for (const p of parts) {
    const k = 1 - p.life / p.max;
    c.globalAlpha = Math.max(0, k);
    c.fillStyle = p.col; c.strokeStyle = p.col;
    if (p.shape === 'ring') {
      c.lineWidth = Math.max(1, 5 * k);
      c.beginPath(); c.arc(p.x, p.y, p.size, 0, TAU); c.stroke();
    } else if (p.shape === 'circle') {
      c.beginPath(); c.arc(p.x, p.y, p.size * k, 0, TAU); c.fill();
    } else {
      c.save(); c.translate(p.x, p.y); c.rotate(p.rot);
      const s = p.size * (0.4 + k * 0.6);
      c.fillRect(-s / 2, -s / 2, s, s * (p.shape === 'confetti' ? 0.55 : 1));
      c.restore();
    }
  }
  c.globalAlpha = 1;
  c.textAlign = 'center'; c.direction = 'rtl';
  for (const t of texts) {
    const k = 1 - t.life / t.max;
    c.globalAlpha = Math.max(0, Math.min(1, k * 1.6));
    c.font = `900 ${t.size}px Vazirmatn, Tahoma, sans-serif`;
    c.lineWidth = 4; c.strokeStyle = 'rgba(0,0,0,.65)';
    c.strokeText(t.str, t.x, t.y); c.fillStyle = t.col; c.fillText(t.str, t.x, t.y);
  }
  c.globalAlpha = 1;
}

/* ---------------- کمک‌های ترسیم ---------------- */
function rr(c, x, y, w, h, r) {
  r = Math.min(r, Math.abs(w) / 2, Math.abs(h) / 2);
  c.beginPath();
  c.moveTo(x + r, y);
  c.arcTo(x + w, y, x + w, y + h, r);
  c.arcTo(x + w, y + h, x, y + h, r);
  c.arcTo(x, y + h, x, y, r);
  c.arcTo(x, y, x + w, y, r);
  c.closePath();
}
function fillRR(c, x, y, w, h, r, col) { c.fillStyle = col; rr(c, x, y, w, h, r); c.fill(); }
function ell(c, x, y, rx, ry, col) { c.fillStyle = col; c.beginPath(); c.ellipse(x, y, rx, ry, 0, 0, TAU); c.fill(); }
function circle(c, x, y, r, col) { c.fillStyle = col; c.beginPath(); c.arc(x, y, r, 0, TAU); c.fill(); }
/* گرادیانِ عمودیِ کش‌شده — ساختِ گرادیان در هر فریم روی موبایل گران است */
const _gradCache = new Map();
function vGrad(c, y0, y1, stops) {
  const key = y0 + '|' + y1 + '|' + stops.join(',');
  let g = _gradCache.get(key);
  if (!g) {
    g = c.createLinearGradient(0, y0, 0, y1);
    for (let i = 0; i < stops.length; i += 2) g.addColorStop(+stops[i], stops[i + 1]);
    if (_gradCache.size > 60) _gradCache.clear();
    _gradCache.set(key, g);
  }
  return g;
}

/* '#aabbcc' + آلفا → 'rgba(r,g,b,a)' */
function hexA(hex, a) {
  const n = parseInt(hex.slice(1), 16);
  return 'rgba(' + ((n >> 16) & 255) + ',' + ((n >> 8) & 255) + ',' + (n & 255) + ',' + a + ')';
}

function glow(c, x, y, r, col, a = 0.5) {
  // روی گوشی‌های کم‌توان گرادیانِ شعاعی گران است؛ دایره‌ی ساده جایش را می‌گیرد
  if (!PERF.softGlow) {
    c.globalAlpha = a * 0.5; c.fillStyle = col;
    c.beginPath(); c.arc(x, y, r * 0.62, 0, TAU); c.fill(); c.globalAlpha = 1;
    return;
  }
  const g = c.createRadialGradient(x, y, 0, x, y, r);
  g.addColorStop(0, col); g.addColorStop(1, 'rgba(0,0,0,0)');
  c.globalAlpha = a; c.fillStyle = g;
  c.beginPath(); c.arc(x, y, r, 0, TAU); c.fill(); c.globalAlpha = 1;
}
function faText(c, str, x, y, size, col, align = 'center', weight = 700, stroke = null) {
  c.save();
  c.direction = 'rtl'; c.textAlign = align; c.textBaseline = 'middle';
  c.font = `${weight} ${size}px Vazirmatn, Tahoma, sans-serif`;
  if (stroke) { c.lineWidth = Math.max(3, size / 6); c.strokeStyle = stroke; c.lineJoin = 'round'; c.strokeText(str, x, y); }
  c.fillStyle = col; c.fillText(str, x, y);
  c.restore();
}

/* ============================================================
   جهان بازی: ساخت مرحله، برخورد، خطرها و پس‌زمینه‌ها
   ============================================================ */

let L = null;                 // مرحله‌ی فعلی
let ENEMIES = [];
let PROJ = [];                // پرتابه‌ها (دشمن و بازیکن)
let PICKUPS = [];
let EMBERS = [];              // ذرات پس‌زمینه

const GROUND_Y = 430;

/* ---------------- برخورد ---------------- */
function forEachSolid(cb) {
  for (let i = 0; i < L.solids.length; i++) cb(L.solids[i], false);
  for (let i = 0; i < L.movers.length; i++) cb(L.movers[i], true);
}

function moveEntity(e, dt) {
  // سوارِ سکوی متحرک: همراه سکو جابه‌جا شو (وگرنه سکو از زیر پا در می‌رود)
  if (e.standingOn) {
    e.x += e.standingOn.dx || 0;
    e.y += e.standingOn.dy || 0;
  }

  // --- محور X (فقط جامدهای ثابت؛ سکوی متحرک از پهلو جامد نیست تا کسی پرت نشود) ---
  e.x += e.vx * dt;
  const box = rectOf(e);
  for (let i = 0; i < L.solids.length; i++) {
    const s = L.solids[i];
    box.x = e.x; box.y = e.y;
    if (!aabb(box, s)) continue;
    if (e.vx > 0) { e.x = s.x - e.w; if (e.onWallHit) e.onWallHit(1); }
    else if (e.vx < 0) { e.x = s.x + s.w; if (e.onWallHit) e.onWallHit(-1); }
    if (!e.keepVelOnWall) e.vx = 0;
  }

  // --- محور Y ---
  const prevBottom = e.y + e.h;
  e.y += e.vy * dt;
  e.onGround = false;
  e.standingOn = null;
  for (let i = 0; i < L.solids.length; i++) {
    const s = L.solids[i];
    box.x = e.x; box.y = e.y;
    if (!aabb(box, s)) continue;
    if (e.vy >= 0) { e.y = s.y - e.h; e.vy = 0; e.onGround = true; }
    else { e.y = s.y + s.h; e.vy = 40; }
  }
  // سکوهای متحرک: فقط از بالا جامدند (مثل سکوی یک‌طرفه) و سوارشان می‌شوی
  for (let i = 0; i < L.movers.length; i++) {
    const s = L.movers[i];
    box.x = e.x; box.y = e.y;
    if (!aabb(box, s)) continue;
    if (e.vy >= 0 && prevBottom <= s.y + 14 + Math.max(0, s.dy || 0) && !(e.dropThrough > 0)) {
      e.y = s.y - e.h; e.vy = 0; e.onGround = true; e.standingOn = s;
    }
  }

  // --- سکوهای یک‌طرفه ---
  if (!e.ignoreOneWay) {
    for (const p of L.oneways) {
      box.x = e.x; box.y = e.y;
      if (!aabb(box, p)) continue;
      if (e.vy >= 0 && prevBottom <= p.y + 8 && !(e.dropThrough > 0)) {
        e.y = p.y - e.h; e.vy = 0; e.onGround = true;
      }
    }
  }

  // --- محدوده‌ی مرحله ---
  if (e.x < 0) { e.x = 0; e.vx = Math.max(0, e.vx); }
  if (e.x + e.w > L.w) { e.x = L.w - e.w; e.vx = Math.min(0, e.vx); }
}

function groundAhead(e, dir) { // آیا جلوی پای دشمن زمین هست؟
  const px = dir > 0 ? e.x + e.w + 6 : e.x - 6;
  const py = e.y + e.h + 6;
  let found = false;
  forEachSolid(s => { if (px > s.x && px < s.x + s.w && py > s.y && py < s.y + s.h + 10) found = true; });
  for (const p of L.oneways) if (px > p.x && px < p.x + p.w && py > p.y && py < p.y + p.h + 10) found = true;
  return found;
}

function inHazard(e) {
  for (const hz of L.hazards) {
    if (hz.kind === 'geyser' && !hz.active) continue;
    const r = hz.kind === 'geyser' ? { x: hz.x, y: hz.y - hz.hCur, w: hz.w, h: hz.hCur } : hz;
    if (aabb(rectOf(e), r)) return hz;
  }
  return null;
}

function addGround(lv, x, y, w) {
  lv.solids.push({ x, y, w, h: 620 - y, kind: 'ground' });

function addPlat(lv, x, y, w) { lv.oneways.push({ x, y, w, h: 16, kind: 'plat' }); }
function addBlock(lv, x, y, w, h) { lv.solids.push({ x, y, w, h, kind: 'rock' }); }
function addLava(lv, x, y, w, h) { lv.hazards.push({ x, y, w, h, kind: 'lava', dmg: 18 }); }
function addSpikes(lv, x, y, w) { lv.hazards.push({ x, y: y - 14, w, h: 16, kind: 'spike', dmg: 14 }); }
function addGeyser(lv, x, y, w, phase) {
  lv.hazards.push({ x, y, w, h: 0, kind: 'geyser', dmg: 16, t: phase || 0, active: false, hCur: 0 });
}
function addMover(lv, x, y, w, h, ax, ay, speed) {
  lv.movers.push({ x, y, w, h, x0: x, y0: y, ax, ay, speed, t: Math.random() * 6, dx: 0, dy: 0, kind: 'mover' });
}
function addEnemy(lv, type, x, y) { lv.spawns.push({ type, x, y }); }

/* مراحل عادی جهنمی */
function buildLevel(index) {
  RNG = mulberry32(1337 + index * 7919);
  const lv = emptyLevel(index, worldIdOf(index), false);
  const diff = index;
  // طول سالن رشد می‌کند ولی از ~۵۳۰۰ بیشتر نمی‌شود تا نیمه‌ی دوم خسته‌کننده نشود
  lv.w = 2700 + Math.min(index * 110, 2600);
  lv.h = 540;

  let x = -40;
  let y = GROUND_Y;
  addGround(lv, x, y, 420);
  x += 420;

  const pool = enemyPoolFor(index);
  // سقف آرام‌آرام بالا می‌رود تا سالن‌های پایانی شلوغ‌تر حس شوند، نه غیرقابل‌خواندن
  let enemyBudget = Math.min(14 + Math.floor(index / 14), 4 + Math.floor(index * 0.7));

  while (x < lv.w - 520) {
    const roll = RNG();
    if (roll < 0.3 && index > 1) {
      /* گودال گدازه */
      const gap = 110 + randInt(60, 0) + Math.min(50, diff * 6);
      addLava(lv, x, 468, gap, 110);
      if (RNG() < 0.5) addPlat(lv, x + gap / 2 - 45, y - 95, 90);
      x += gap;
      const segW = 280 + randInt(180, 0);
      addGround(lv, x, y, segW);
      if (enemyBudget > 0 && RNG() < 0.8) { addEnemy(lv, pick(pool), x + segW * 0.5, y - 60); enemyBudget--; }
      x += segW;
    } else if (roll < 0.52) {
      /* پله و ارتفاع */
      const up = RNG() < 0.5 ? -90 : 90;
      const ny = clamp(y + up, 250, GROUND_Y);
      const segW = 260 + randInt(200, 0);
      addGround(lv, x, ny, segW);
      if (RNG() < 0.55) addPlat(lv, x + randInt(segW - 120, 20), ny - 105, 100);
      if (enemyBudget > 0 && RNG() < 0.85) { addEnemy(lv, pick(pool), x + segW * 0.5, ny - 60); enemyBudget--; }
      if (enemyBudget > 0 && segW > 360 && RNG() < 0.5) { addEnemy(lv, pick(pool), x + segW * 0.8, ny - 160); enemyBudget--; }
      y = ny; x += segW;
    } else if (roll < 0.68 && index > 2) {
      /* سکوی متحرک روی گدازه */
      const gap = 230 + randInt(80, 0);
      addLava(lv, x, 468, gap, 110);
      addMover(lv, x + 40, y - 40, 110, 18, RNG() < 0.5 ? gap - 150 : 0, RNG() < 0.5 ? 90 : 0, 60 + diff * 4);
      x += gap;
      const segW = 300 + randInt(150, 0);
      addGround(lv, x, y, segW);
      if (enemyBudget > 0) { addEnemy(lv, pick(pool), x + segW * 0.6, y - 60); enemyBudget--; }
      x += segW;
    } else if (roll < 0.82) {
      /* میدان نبرد کوچک با چند سکو */
      const segW = 420 + randInt(180, 0);
      addGround(lv, x, y, segW);
      addPlat(lv, x + 60, y - 110, 110);
      addPlat(lv, x + segW - 170, y - 110, 110);
      addPlat(lv, x + segW / 2 - 55, y - 210, 110);
      let n = Math.min(enemyBudget, 2 + (index > 4 ? 1 : 0));
      for (let i = 0; i < n; i++) {
        addEnemy(lv, pick(pool), x + 100 + i * 150, y - 70 - (i === 1 ? 140 : 0));
        enemyBudget--;
      }
      if (RNG() < 0.4) lv.pickups.push({ x: x + segW / 2, y: y - 250, kind: 'heart' });
      x += segW;
    } else if (roll < 0.91 && index >= 10) {
      /* دالانِ آبفشان‌های آتشین (فقط نیمه‌ی دوم) */
      const segW = 440 + randInt(160, 0);
      addGround(lv, x, y, segW);
      const n = 2 + (index > 15 ? 1 : 0);
      for (let i = 0; i < n; i++) addGeyser(lv, x + 90 + i * 140, y, 54, i * 1.1 + RNG());
      addPlat(lv, x + segW / 2 - 60, y - 150, 120);
      if (enemyBudget > 0 && RNG() < 0.8) { addEnemy(lv, pick(pool), x + segW - 70, y - 60); enemyBudget--; }
      if (RNG() < 0.45) lv.pickups.push({ x: x + segW / 2, y: y - 195, kind: 'coin' });
      x += segW;
    } else if (roll < 0.935 && index >= 22) {
      /* زنجیره‌ی سکوهای متحرک روی دریاچه‌ی گدازه (سه پرش پشت‌سرهم) */
      const gap = 520 + randInt(140, 0);
      addLava(lv, x, 468, gap, 110);
      for (let i = 0; i < 3; i++) {
        addMover(lv, x + 50 + i * 155, y - 40 - (i % 2) * 30, 100, 18,
          0, 70 + (i % 2) * 30, 55 + diff * 3);
      }
      x += gap;
      const segW = 300 + randInt(140, 0);
      addGround(lv, x, y, segW);
      if (enemyBudget > 0) { addEnemy(lv, pick(pool), x + segW * 0.6, y - 60); enemyBudget--; }
      lv.pickups.push({ x: x + segW / 2, y: y - 150, kind: RNG() < 0.4 ? 'heart' : 'coin' });
      x += segW;
    } else if (roll < 0.95 && index >= 22) {
      /* دالانِ تنگ: میخ، آبفشان و یک صندوقِ زره‌پوش پشت‌سرهم */
      const segW = 470 + randInt(140, 0);
      addGround(lv, x, y, segW);
      addSpikes(lv, x + 90, y, 80);
      addGeyser(lv, x + 230, y, 54, RNG() * 3);
      addSpikes(lv, x + 330, y, 80);
      addPlat(lv, x + 170, y - 135, 110);
      addPlat(lv, x + 300, y - 215, 110);
      if (enemyBudget > 0) { addEnemy(lv, 'safebox', x + segW - 90, y - 60); enemyBudget--; }
      if (enemyBudget > 0 && RNG() < 0.6) { addEnemy(lv, 'auditor', x + segW - 170, y - 240); enemyBudget--; }
      x += segW;
    } else if (roll < 0.95 && index >= 10) {
      /* برجِ بالارو: سکوهای پلکانی و یک تیرانداز در قله */
      const segW = 380 + randInt(120, 0);
      addGround(lv, x, y, segW);
      for (let i = 0; i < 3; i++) addPlat(lv, x + 70 + i * 105, y - 95 - i * 85, 100);
      addPlat(lv, x + segW - 130, y - 300, 120);
      if (enemyBudget > 0) { addEnemy(lv, index >= 10 ? 'sniper' : pick(pool), x + segW - 90, y - 330); enemyBudget--; }
      if (enemyBudget > 0 && RNG() < 0.6) { addEnemy(lv, pick(pool), x + 120, y - 60); enemyBudget--; }
      lv.pickups.push({ x: x + segW - 80, y: y - 350, kind: RNG() < 0.45 ? 'heart' : 'coin' });
      x += segW;
    } else {
      /* میخ‌ها و پرش دقیق */
      const segW = 340 + randInt(140, 0);
      addGround(lv, x, y, segW);
      addSpikes(lv, x + 120, y, 90 + Math.min(70, diff * 8));
      addPlat(lv, x + 100, y - 115, 130);
      if (index >= 13 && RNG() < 0.5) addGeyser(lv, x + segW - 110, y, 54, RNG() * 3);
      if (enemyBudget > 0 && RNG() < 0.7) { addEnemy(lv, pick(pool), x + segW - 60, y - 60); enemyBudget--; }
      x += segW;
    }
    if (RNG() < 0.25) lv.pickups.push({ x: x - 100, y: y - 150, kind: 'coin' });
  }

  /* بخش پایانی */
  const endW = lv.w - x + 60;
  addGround(lv, x, y, endW);
  while (enemyBudget > 0) { addEnemy(lv, pick(pool), x + 80 + randInt(endW - 200, 0), y - 60); enemyBudget--; }
  lv.exit = { x: lv.w - 140, y: y - 96, w: 60, h: 96, open: false };
  lv.spawn = { x: 60, y: GROUND_Y - 80 };

  /* تزئینات جهنمی */
  for (let i = 0; i < 26; i++) {
    lv.decor.push({ kind: pick(worldOf(lv.theme).props), x: rand(lv.w - 200, 150), y: 0, s: rand(1.2, 0.7), txt: null });
  }
  placeDecor(lv);
  // عرضِ نهایی را با آخرین قطعه‌ی زمین هم‌تراز کن، بعد هر چیزی را داخلِ نقشه نگه دار
  for (const sl of lv.solids) lv.w = Math.max(lv.w, sl.x + sl.w);
  for (const sp of lv.spawns) sp.x = clamp(sp.x, 70, lv.w - 70);
  for (const k of lv.pickups) k.x = clamp(k.x, 40, lv.w - 40);
  RNG = Math.random;
  return lv;
}

/* ارتفاع سطح زمین در یک مختصات افقی */
function groundTopAt(lv, x) {
  let best = null;
  for (const s of lv.solids) {
    if (x >= s.x && x <= s.x + s.w) { if (best === null || s.y < best) best = s.y; }
  }
  return best === null ? GROUND_Y : best;
}
function placeDecor(lv) {
  for (const d of lv.decor) d.gy = groundTopAt(lv, d.x);
}

function enemyPoolFor(index) {
  if (index <= 1) return ['imp', 'imp', 'bomber'];
  if (index === 2) return ['imp', 'imp', 'flyer', 'charger'];
  if (index === 4) return ['imp', 'charger', 'flyer', 'bomber'];
  if (index === 5) return ['charger', 'flyer', 'shielder', 'imp'];
  if (index === 7) return ['shielder', 'flyer', 'charger', 'bomber'];
  if (index <= 9) return ['imp', 'charger', 'flyer', 'shielder', 'bomber'];
  // نیمه‌ی دوم بازی: تیرانداز و نره‌غول وارد می‌شوند
  if (index <= 11) return ['imp', 'flyer', 'sniper', 'charger', 'shielder'];
  if (index <= 14) return ['sniper', 'charger', 'flyer', 'brute', 'shielder'];
  if (index <= 17) return ['sniper', 'brute', 'flyer', 'bomber', 'charger', 'shielder'];
  if (index <= 21) return ['brute', 'sniper', 'shielder', 'flyer', 'charger', 'bomber'];
  // یک‌سوم پایانی: حسابرسِ جهنده و صندوقِ زره‌پوش
  if (index <= 24) return ['auditor', 'sniper', 'brute', 'flyer', 'shielder', 'charger'];
  if (index <= 27) return ['auditor', 'safebox', 'sniper', 'brute', 'flyer', 'charger'];
  if (index <= 30) return ['safebox', 'auditor', 'brute', 'sniper', 'shielder', 'bomber', 'flyer'];
  if (index <= 36) return ['auditor', 'safebox', 'brute', 'sniper', 'shielder', 'flyer', 'charger', 'bomber'];
  // فاضلاب: انبوهِ سبک‌ها و بمب‌انداز — شلوغ و پرهرج‌ومرج
  if (index <= 45) return ['bomber', 'charger', 'auditor', 'flyer', 'imp', 'brute', 'sniper', 'safebox'];
  // آشپزخانه: نره‌غول و شارژر، فضای تنگ و داغ
  if (index <= 51) return ['brute', 'charger', 'safebox', 'bomber', 'auditor', 'shielder', 'flyer'];
  // بامِ ابرها: نبردِ هوایی — پرنده و تیرانداز حرف اول را می‌زنند
  if (index <= 60) return ['flyer', 'sniper', 'flyer', 'auditor', 'charger', 'shielder', 'brute', 'bomber'];
  // طبقه‌ی مدیریت: هر چه داشتیم، یک‌جا
  return ['auditor', 'safebox', 'brute', 'sniper', 'shielder', 'flyer', 'charger', 'bomber'];
}

/* ---------------- به‌روزرسانی جهان ---------------- */
function updateWorld(dt) {
  for (const m of L.movers) {
    const prevX = m.x, prevY = m.y;
    m.t += dt * (m.speed / 100);
    const k = (Math.sin(m.t) + 1) / 2;
    m.x = m.x0 + m.ax * k;
    // فقط رو به بالا نوسان می‌کند تا هرگز داخل گدازه فرو نرود
    m.y = m.y0 - m.ay * (1 - Math.cos(m.t * 1.3)) / 2;
    m.dx = m.x - prevX; m.dy = m.y - prevY;
  }
  for (const hz of L.hazards) {
    if (hz.kind === 'geyser') {
      hz.t = (hz.t || 0) + dt;
      hz.active = (hz.t % 3) > 1.8;
      hz.hCur = hz.active ? Math.min(150, (hz.t % 3 - 1.8) * 500) : 0;
    }
  }
  /* ذرات پس‌زمینه — جرقه بالا می‌رود، برف و گرد و غبار پایین می‌آید */
  const drift = (L.theme === 'town' || L.theme === 'heaven') ? 'up' : (worldOf(L.theme).drift || 'up');
  const down = drift === 'down';
  if (EMBERS.length < (PERF.low ? 26 : PERF.mobile ? 44 : 70)) {
    EMBERS.push({
      x: Cam.x + rand(VW + 200, -100), y: down ? -20 : VH + 20,
      vy: down ? rand(52, 14) : -rand(60, 18), vx: rand(22, -22),
      r: rand(3, 1), a: rand(0.8, 0.25), t: 0
    });
  }
  for (let i = EMBERS.length - 1; i >= 0; i--) {
    const e = EMBERS[i];
    e.t += dt; e.y += e.vy * dt; e.x += Math.sin(e.t * 2) * 14 * dt + e.vx * dt;
    if (e.y < -30 || e.y > VH + 40) EMBERS.splice(i, 1);
  }
}

/* ---------------- ترسیم پس‌زمینه ---------------- */
function drawBackground(c) {
  if (L.theme === 'town') drawTownBG(c);
  else if (L.theme === 'heaven') drawHeavenBG(c);
  else drawWorldBG(c, worldOf(L.theme));
}

/* آسمانِ شهرِ امن: غروبِ آرامِ بهشتی */
function drawTownBG(c) {
  c.fillStyle = vGrad(c, 0, VH, [0, '#2b1f56', 0.4, '#6a4b8f', 0.72, '#d98a7a', 1, '#ffd9a0']);
  c.fillRect(0, 0, VW, VH);

  // ماه
  const mx = VW * 0.78 - Cam.x * 0.03, my = 96;
  glow(c, mx, my, 150, 'rgba(255,240,200,.75)', 0.6);
  circle(c, mx, my, 42, 'rgba(255,250,232,.97)');
  circle(c, mx - 13, my - 7, 7, 'rgba(228,216,190,.8)');
  circle(c, mx + 11, my + 10, 5, 'rgba(228,216,190,.7)');

  // ستاره‌ها
  for (let i = 0, N = PERF.low ? 22 : 46; i < N; i++) {
    const sx = (i * 173 % VW) - (Cam.x * 0.02 % VW), sy = (i * 61) % 240;
    const tw = 0.3 + ((Math.sin(timeNow * 1.6 + i) + 1) / 2) * 0.6;
    c.globalAlpha = tw * 0.8;
    circle(c, sx < 0 ? sx + VW : sx, sy + 18, i % 5 === 0 ? 1.9 : 1.1, '#fff8e0');
  }
  c.globalAlpha = 1;

  // خط آسمانِ شهر (سه لایه برج‌های ابری)
  const sky = [
    { p: 0.12, h: 150, col: 'rgba(60,44,96,.75)' },
    { p: 0.26, h: 108, col: 'rgba(86,62,122,.8)' },
    { p: 0.45, h: 74, col: 'rgba(120,88,150,.85)' }
  ];
  for (const layer of sky) {
    const off = -Cam.x * layer.p;
    c.fillStyle = layer.col;
    for (let i = -1; i < 16; i++) {
      const bx = off % 220 + i * 220;
      const bh = layer.h * (0.6 + ((i * 37) % 10) / 14);
      const bw = 90 + ((i * 53) % 60);
      c.fillRect(bx, GROUND_Y - bh, bw, bh);
      // گنبد
      c.beginPath(); c.ellipse(bx + bw / 2, GROUND_Y - bh, bw / 2, 20, 0, Math.PI, 0); c.fill();
      // پنجره‌های روشن
      c.save(); c.fillStyle = 'rgba(255,220,140,.5)';
      for (let w = 0; w < 3; w++) for (let h2 = 0; h2 < Math.floor(bh / 34); h2++) {
        if ((i + w + h2) % 3 === 0) c.fillRect(bx + 14 + w * 26, GROUND_Y - bh + 24 + h2 * 32, 11, 15);
      }
      c.restore();
    }
  }

  // ابرهای پایین
  drawCloudLayer(c, 0.5, 372, 'rgba(255,220,195,.45)', 0.8, 380);
}

function drawHeavenBG(c) {
  c.fillStyle = vGrad(c, 0, VH, [0, '#8fd4ff', 0.45, '#cdeeff', 1, '#fdf6e3']);
  c.fillRect(0, 0, VW, VH);

  // خورشید و پرتوها
  const sx = VW * 0.72 - Cam.x * 0.04, sy = 110;
  c.save();
  glow(c, sx, sy, 230, 'rgba(255,245,200,.9)', 0.8);
  c.translate(sx, sy); c.rotate(timeNow * 0.06);
  c.fillStyle = 'rgba(255,255,220,.16)';
  for (let i = 0; i < 12; i++) {
    c.rotate(TAU / 12);
    c.beginPath(); c.moveTo(0, 0); c.lineTo(600, -40); c.lineTo(600, 40); c.fill();
  }
  c.restore();
  circle(c, sx, sy, 56, 'rgba(255,253,235,.95)');

  // ابرهای لایه‌ای
  drawCloudLayer(c, 0.15, 170, 'rgba(255,255,255,.55)', 1.5, 520);
  drawCloudLayer(c, 0.3, 250, 'rgba(255,255,255,.75)', 1.1, 430);
  drawCloudLayer(c, 0.55, 330, 'rgba(255,255,255,.95)', 0.85, 360);

  // دروازه‌ی طلایی دوردست
  const gx = 900 - Cam.x * 0.25;
  c.save(); c.globalAlpha = 0.6;
  c.fillStyle = '#f3d98b';
  c.fillRect(gx, 180, 26, 260); c.fillRect(gx + 190, 180, 26, 260);
  c.beginPath(); c.arc(gx + 108, 190, 108, Math.PI, 0); c.lineWidth = 24; c.strokeStyle = '#f3d98b'; c.stroke();
  c.restore();
}

function drawCloudLayer(c, par, baseY, col, scale, spacing) {
  const off = -Cam.x * par;
  c.fillStyle = col;
  const start = Math.floor((-off) / spacing) - 1;
  for (let i = start; i < start + Math.ceil(VW / spacing) + 3; i++) {
    const x = i * spacing + off;
    const y = baseY + Math.sin(i * 2.3) * 40;
    const s = scale * (0.8 + ((i * 37) % 10) / 20);
    c.beginPath();
    c.ellipse(x, y, 90 * s, 34 * s, 0, 0, TAU);
    c.ellipse(x + 60 * s, y + 8 * s, 62 * s, 26 * s, 0, 0, TAU);
    c.ellipse(x - 62 * s, y + 10 * s, 54 * s, 22 * s, 0, 0, TAU);
    c.fill();
  }
}
